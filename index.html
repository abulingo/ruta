<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ruta â€” viajes y envÃ­os</title>
<meta name="description" content="Pide un carro o manda un paquete con precio claro desde el primer momento.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A5AFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111926" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230A5AFF'/%3E%3Ccircle cx='42' cy='22' r='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  color-scheme:light;
  --azul:#0A5AFF; --azul-2:#0842C4; --azul-3:#3D82FF;
  --azul-suave:#EAF1FF; --azul-borde:#CFE0FF;
  --bg:#FFFFFF; --fondo:#F4F7FD; --marco:#DDE6F5; --mapabg:#E8EEF7;
  --panel:#FFFFFF; --panel2:#F5F8FE; --panel3:#EAF1FF;
  --line:#E4EAF4; --line2:#CBD8EC;
  --text:#0D1B2E; --muted:#5B6E8C; --dim:#8496AF;
  --ok:#0FA958; --bad:#E1443F; --warn:#E0912A;
  --r:18px; --rs:12px;
  /* escala de espacios: todo el layout usa estos seis valores */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px;
  --sombra:0 6px 24px rgba(13,45,110,.09);
  --sombra-alta:0 -10px 34px rgba(13,45,110,.12);
  --sombra-azul:0 8px 20px rgba(10,90,255,.28);
  --velo:rgba(255,255,255,.82);
}
/* El tema lo fija el script en <html data-tema>, resolviendo antes
   la preferencia del sistema. Por eso aquÃ­ solo hace falta un bloque. */
html[data-tema="oscuro"]{
  color-scheme:dark;
  --azul:#4C8DFF; --azul-2:#9CC0FF; --azul-3:#2F6FE0;
  --azul-suave:#16233A; --azul-borde:#28456F;
  --bg:#111926; --fondo:#0C121C; --marco:#070B12; --mapabg:#18212E;
  --panel:#151E2D; --panel2:#1B2634; --panel3:#1E2C44;
  --line:#26313F; --line2:#3A4A60;
  --text:#E8EEF8; --muted:#9BABC4; --dim:#7386A0;
  --ok:#2BC275; --bad:#F26B66; --warn:#E9A94A;
  --sombra:0 6px 24px rgba(0,0,0,.42);
  --sombra-alta:0 -10px 34px rgba(0,0,0,.5);
  --sombra-azul:0 8px 20px rgba(30,90,220,.4);
  --velo:rgba(17,25,38,.82);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--marco);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

#shell{position:relative;max-width:520px;margin:0 auto;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:0 0 60px rgba(13,45,110,.14)}

.num{font-family:"Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.025em;margin:0}
h1{font-size:27px;font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:13px}
.fine{color:var(--dim);font-size:12px;line-height:1.5}

/* ---------- marca ---------- */
.brand{font-family:"Space Grotesk";font-weight:700;font-size:19px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--azul)}
.brand i{width:23px;height:23px;border-radius:8px;background:var(--azul);display:block;position:relative;font-style:normal;box-shadow:var(--sombra-azul)}
.brand i::after{content:"";position:absolute;inset:6px 6px auto auto;width:9px;height:9px;border-radius:50%;background:#fff}
.brand.big{font-size:30px;gap:12px;color:#fff}
.brand.big i{width:34px;height:34px;border-radius:12px;background:#fff;box-shadow:none}
.brand.big i::after{inset:9px 9px auto auto;width:13px;height:13px;background:var(--azul)}

/* ---------- acceso ---------- */
.auth{position:absolute;inset:0;overflow-y:auto;background:var(--fondo)}
.hero{position:relative;padding:24px 20px 62px;background:linear-gradient(150deg,#0A5AFF 0%,#0842C4 62%,#062E8C 100%);color:#fff;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:210px;height:210px;top:-70px;right:-50px}
.hero::after{width:150px;height:150px;bottom:-60px;left:-40px}
.hero h1{margin:16px 0 6px;position:relative}
.hero p{margin:0;color:rgba(255,255,255,.82);position:relative;max-width:30ch}
.hero-cards{display:flex;gap:7px;margin-top:14px;position:relative;flex-wrap:wrap}
.hc{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);padding:7px 12px;border-radius:999px;font-size:12.5px}
.hc span{font-size:14px}
.auth-card{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-44px;position:relative;padding:18px 18px 32px;box-shadow:0 -10px 30px rgba(13,45,110,.10);min-height:60dvh}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.input{
  width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:11px 13px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s;
}
.input:focus{border-color:var(--azul);background:#fff;box-shadow:0 0 0 4px rgba(10,90,255,.12)}
.input::placeholder{color:var(--dim)}
textarea.input{resize:none;min-height:60px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 16px;border-radius:var(--rs);font-weight:600;font-size:15px;
  background:var(--panel2);border:1.5px solid var(--line);color:var(--text);
  transition:transform .08s,background .15s,opacity .15s,box-shadow .15s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--azul-3),var(--azul));color:#fff;border-color:transparent;box-shadow:var(--sombra-azul)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.suave{background:var(--azul-suave);border-color:var(--azul-borde);color:var(--azul-2)}
.btn.danger{color:var(--bad);border-color:#F6D8D7;background:#FDF3F2}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn.google{background:#fff;color:#1F2937;border-color:var(--line2)}
.btn+.btn{margin-top:8px}

.segmented{display:flex;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.segmented button{flex:1;padding:8px 6px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:.15s}
.segmented button.on{background:var(--azul);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(10,90,255,.26)}
.segmented.small button{padding:6px 10px;font-size:12.5px}

.pinbox{display:flex;gap:8px;max-width:260px;width:100%;margin-left:auto;margin-right:auto;justify-content:center}
.pinbox input{
  flex:1 1 0;width:100%;min-width:0;text-align:center;font-family:"Space Grotesk";font-size:22px;font-weight:600;
  padding:11px 0;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;outline:none;color:var(--azul-2);
}
.pinbox input:focus{border-color:var(--azul);background:#fff;box-shadow:0 0 0 4px rgba(10,90,255,.12)}
.sep{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12.5px;margin:12px 0}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}
.aviso{background:var(--azul-suave);border:1px solid var(--azul-borde);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--azul-2)}

/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--fondo)}
.topbar{
  display:flex;align-items:center;gap:var(--s2);background:var(--bg);
  padding:8px var(--s3);padding-top:calc(8px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);z-index:600
}
.topbar .grow{flex:1}
.iconbtn{
  width:35px;height:35px;border-radius:11px;background:var(--panel2);border:1.5px solid var(--line);
  display:grid;place-items:center;color:var(--muted);flex:none;position:relative;transition:.15s
}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .n{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)
}
.avatar{
  width:35px;height:35px;border-radius:50%;background:var(--azul-suave);border:1.5px solid var(--azul-borde);
  color:var(--azul-2);font-family:"Space Grotesk";font-weight:600;font-size:13px;display:grid;place-items:center;flex:none;
}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:500}
.pill.live{color:#fff;background:var(--ok);border-color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.pill.live .dot{background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

#mapwrap{flex:1;position:relative;overflow:hidden;min-height:120px}
#map{position:absolute;inset:0;background:var(--mapabg)}
.leaflet-container{background:var(--mapabg);font-family:Inter}
.leaflet-control-attribution{background:var(--velo)!important;color:var(--dim)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--sombra)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--text)!important;border-bottom-color:var(--line)!important}
.leaflet-tooltip{background:var(--text);border:0;color:#fff;font-size:12px;box-shadow:none}
.leaflet-tooltip::before{display:none}

.mk{display:grid;place-items:center}
.mk .pt{width:15px;height:15px;border-radius:50%;border:3.5px solid #fff;background:var(--azul);box-shadow:0 2px 8px rgba(13,45,110,.35)}
.mk .pt.hollow{background:var(--text)}
.mk .car{width:36px;height:36px;border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:var(--sombra-azul);border:2px solid #fff}
.mk .me{width:16px;height:16px;border-radius:50%;background:var(--azul);border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,90,255,.18)}

#cross{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:500}
#cross .pin{transform:translateY(-14px);display:grid;place-items:center}
#cross .head{width:18px;height:18px;border-radius:50%;background:var(--azul);border:3.5px solid #fff;box-shadow:0 2px 10px rgba(13,45,110,.4)}
#cross .stem{width:2px;height:16px;background:var(--azul)}
#cross .shadow{width:12px;height:4px;border-radius:50%;background:rgba(13,45,110,.25)}

/* ---------- hoja inferior ---------- */
/* Hoja inferior con tres alturas: se arrastra o se toca el asa para
   darle mÃ¡s espacio al mapa o al contenido, segÃºn lo que se estÃ© haciendo. */
.sheet{
  position:relative;z-index:610;background:var(--bg);border-radius:22px 22px 0 0;
  box-shadow:var(--sombra-alta);max-height:62dvh;overflow-y:auto;
  padding:0 var(--s3) var(--s3);overscroll-behavior:contain;
  transition:max-height .26s cubic-bezier(.4,0,.2,1);
}
.sheet.compacta{max-height:34dvh}
.sheet.expandida{max-height:86dvh}
#asa{
  position:sticky;top:0;z-index:3;display:block;width:100%;height:24px;
  background:var(--bg);border-radius:22px 22px 0 0;touch-action:none;cursor:grab;
}
#asa::after{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 0;transition:background .15s,width .15s}
#asa:hover::after,#asa:active::after{background:var(--azul);width:52px}
.grip{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 10px}
.head,.sheet .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;width:100%}
.head .grow,.sheet .head .grow{flex:1;min-width:0}
.back{width:36px;height:36px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--text);font-weight:700;font-size:16px;cursor:pointer;transition:all .15s;line-height:1;padding:0}
.back:hover{background:var(--azul-suave);color:var(--azul);border-color:var(--azul-borde)}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sombra)}
.card+.card{margin-top:8px}
.card.plano{box-shadow:none;background:var(--panel2)}

.route{display:grid;grid-template-columns:18px 1fr;gap:0 12px;align-items:center}
.route .rail{grid-row:1/3;display:grid;justify-items:center;height:100%}
.route .l1{width:10px;height:10px;border-radius:50%;background:var(--azul)}
.route .line{width:2px;flex:1;background:var(--line2);min-height:22px;border-radius:2px}
.route .l2{width:10px;height:10px;background:var(--text);border-radius:3px}
.locbtn{width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.locbtn:last-child{border-bottom:0}
.locbtn .t{font-size:14.5px;font-weight:500}
.locbtn .s{font-size:12px;color:var(--dim)}

.price-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0 8px}
.price-hero .amount{font-family:"Space Grotesk";font-weight:700;font-size:40px;line-height:1;letter-spacing:-.045em;color:var(--azul-2)}
.price-hero .amount span{font-size:17px;color:var(--dim);font-weight:500;text-decoration:line-through}
.stepper{display:flex;gap:8px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--azul-suave);border:1.5px solid var(--azul-borde);color:var(--azul-2);font-size:22px;font-family:"Space Grotesk";display:grid;place-items:center}
.hint{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:10px}

.opt{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:7px;transition:.15s;text-align:left;width:100%}
.opt.on{border-color:var(--azul);background:var(--azul-suave);box-shadow:0 4px 14px rgba(10,90,255,.14)}
.opt .ico{width:36px;height:36px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:17px;flex:none;color:var(--muted)}
.opt.on .ico{background:var(--azul);color:#fff}
.opt .grow{flex:1;min-width:0}
.opt .t{font-size:14.5px;font-weight:500}
.opt .s{font-size:12.5px;color:var(--dim)}
.opt .p{font-family:"Space Grotesk";font-weight:700;font-size:17px;text-align:right;color:var(--azul-2)}
.opt .p small{display:block;font-size:11px;color:var(--ok);font-weight:600;font-family:Inter}
.opt .p .was{font-size:11.5px;color:var(--dim);text-decoration:line-through;font-family:Inter;font-weight:400}

.badge{display:inline-block;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:500}
.badge.solid{background:var(--azul);color:#fff;border-color:var(--azul);font-weight:600}
.badge.ok{color:var(--ok);border-color:#C7EBD6;background:#EDFAF2}
.badge.warn{color:var(--warn);border-color:#F5E2C4;background:#FDF6EA}

.offer{display:flex;gap:12px;align-items:center}
.offer .grow{flex:1;min-width:0}
.offer .t{font-weight:600;font-size:15px}
.offer .s{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .price{font-family:"Space Grotesk";font-weight:700;font-size:23px;text-align:right;line-height:1.1;color:var(--azul-2)}
.offer .price small{display:block;font-family:Inter;font-size:11px;color:var(--dim);font-weight:400}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}

.wait{display:flex;align-items:center;gap:12px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--azul);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--azul-3),var(--azul));width:0;animation:fill 60s linear forwards}
@keyframes fill{to{width:100%}}

.chat{max-height:44dvh;overflow-y:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:10px;padding:4px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.mine{align-self:flex-end;background:var(--azul);color:#fff;border-color:var(--azul);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.chatbar{display:flex;gap:8px}
.chatbar .input{flex:1}

.stars{display:flex;gap:8px;justify-content:center;margin:10px 0 14px}
.stars button{font-size:34px;color:var(--line2);transition:color .12s,transform .12s}
.stars button.on{color:#F5B72A;transform:scale(1.08)}

.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .ico,.icocaja{width:38px;height:38px;border-radius:12px;background:var(--azul-suave);color:var(--azul);display:grid;place-items:center;font-size:16px;flex:none}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.list-item .s{font-size:12px;color:var(--dim)}
.list-item .amt{font-family:"Space Grotesk";font-weight:700;color:var(--azul-2)}

.empty{text-align:center;padding:24px 16px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:10px;color:var(--azul-borde)}

/* ---------- DiDi conductor style ---------- */
.didi-tooltip{background:#0B132B;color:#fff;border-radius:10px;padding:5px 9px;font-family:"Space Grotesk",system-ui,sans-serif;font-size:12px;font-weight:600;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.didi-tooltip::before{border-top-color:#0B132B !important}
.didi-tooltip-a{background:#00875A}
.didi-tooltip-a::before{border-top-color:#00875A !important}
.didi-tooltip-b{background:#DE350B}
.didi-tooltip-b::before{border-top-color:#DE350B !important}
.didi-mk-a,.didi-mk-b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff}
.didi-mk-a{background:#00875A;color:#fff}
.didi-mk-b{background:#DE350B;color:#fff}

/* ValidaciÃ³n de nÃºmero de identidad (cÃ©dula ecuatoriana u otro ID) */
function revisarCedula(c) {
  if (!c || c.length < 5) return { ok: false, duro: true, motivo: 'El nÃºmero de identidad debe tener al menos 5 dÃ­gitos' };
  if (/^\d{10}$/.test(c)) {
    const prov = +c.slice(0, 2);
    if (prov < 1 || (prov > 24 && prov !== 30)) return { ok: false, duro: false, motivo: 'Los dos primeros dÃ­gitos no corresponden a una provincia de Ecuador' };
    let suma = 0;
    for (let i = 0; i < 9; i++) {
      let v = +c[i] * (i % 2 === 0 ? 2 : 1);
      if (v > 9) v -= 9;
      suma += v;
    }
    const dig = (10 - (suma % 10)) % 10;
    if (dig !== +c[9]) return { ok: false, duro: false, motivo: 'El dÃ­gito verificador no coincide con la cÃ©dula ecuatoriana estÃ¡ndar' };
    return { ok: true };
  }
  return { ok: true };
}

/* Distancia y tiempo */
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const kmRuta  = (a, b) => +(haversine(a, b) * 1.32).toFixed(2);
const minRuta = km => Math.max(4, Math.round(km / 21 * 60 + 2));

/* ---- 3. Tarifas ---- */
const TAMANOS = {
  pequeno: { f: 1.00, t: 'PequeÃ±o', s: 'Sobre, documentos, hasta 3 kg' },
  mediano: { f: 1.25, t: 'Mediano', s: 'Caja de zapatos, hasta 10 kg' },
  grande:  { f: 1.60, t: 'Grande',  s: 'Bulto grande, hasta 25 kg' }
};
const URGENCIAS = {
  urgente: { d: 0.00, t: 'Urgente', s: 'Sale ahora mismo' },
  '1h':    { d: 0.20, t: 'Dentro de 1 hora', s: 'El conductor lo recoge en su ruta' },
  '5h':    { d: 0.40, t: 'Dentro de 5 horas', s: 'Se agrupa con otros envÃ­os del dÃ­a' }
};
function fechaQuito(f = new Date()) {
  try {
    const s = f.toLocaleString('en-US', { timeZone: 'America/Guayaquil' });
    return new Date(s);
  } catch (e) {
    return new Date(f.getTime() - 5 * 3600 * 1000);
  }
}

function factorTiempoLocal(fecha = new Date()) {
  const fq = fechaQuito(fecha);
  const dia = fq.getDay();      // 0: domingo, 6: sÃ¡bado (horario Quito)
  const hora = fq.getHours();    // 0 a 23 en Quito
  let factor = 0.052083;

  // SÃ¡bado o Domingo
  if (dia === 0 || dia === 6) {
    factor = 0.08;
  }
  // 5 a 8 pm (17:00 a 19:59)
  if (hora >= 17 && hora < 20) {
    factor = Math.max(factor, 0.06);
  }
  // 10 pm a 4 am (22:00 a 03:59)
  if (hora >= 22 || hora < 4) {
    factor = Math.max(factor, 0.09);
  }
  return factor;
}

function tarifa(km, tipo, opts = {}) {
  const min = opts.min != null ? opts.min : ((typeof S !== 'undefined' && S.dur && S.km === km) ? S.dur : minRuta(km));
  const factorMin = factorTiempoLocal();
  let p = 0.22 * km + factorMin * min;

  if (tipo === 'paquete') {
    p *= (TAMANOS[opts.tamano || 'pequeno'] || TAMANOS.pequeno).f;
  }

  // Tarifa base/bruta calculada segÃºn la fÃ³rmula
  const bruto = Math.max(1.50, Math.round(p * 20) / 20);
  const desc = tipo === 'paquete' ? (URGENCIAS[opts.urgencia || 'urgente'] || URGENCIAS.urgente).d : 0;
  let final = Math.round(bruto * (1 - desc) * 20) / 20;
  if (tipo !== 'paquete') {
    final = Math.max(1.50, final);
  }

  // Para viajes de personas, el pasajero puede rebajar hasta $0.25 respecto al precio de la fÃ³rmula (mÃ­nimo $1.50)
  const minPermitido = tipo === 'paquete' ? final : Math.max(1.50, +(final - 0.25).toFixed(2));

  return { bruto, desc, final, min, factorMin, minPermitido };
}

function puntosCurva(a, b) {
  const mid = { lat: (a.lat + b.lat) / 2 + (b.lng - a.lng) * .07, lng: (a.lng + b.lng) / 2 - (b.lat - a.lat) * .07 };
  const pts = [];
  for (let t = 0; t <= 1.001; t += .04) {
    const u = 1 - t;
    pts.push([u*u*a.lat + 2*u*t*mid.lat + t*t*b.lat, u*u*a.lng + 2*u*t*mid.lng + t*t*b.lng]);
  }
  return pts;
}

/* Ruta real por calles con OSRM. Si falla, cae a la curva estimada. */
const cacheRutas = {};
async function rutaReal(a, b) {
  const k = [a.lat.toFixed(4), a.lng.toFixed(4), b.lat.toFixed(4), b.lng.toFixed(4)].join(',');
  if (cacheRutas[k]) return cacheRutas[k];
  try {
    const u = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r = await fetch(u);
    const j = await r.json();
    const rt = j.routes && j.routes[0];
    if (!rt) throw new Error('sin ruta');
    const res = {
      pts: rt.geometry.coordinates.map(c => [c[1], c[0]]),
      km: +(rt.distance / 1000).toFixed(2),
      min: Math.max(2, Math.round(rt.duration / 60)),
      real: true
    };
    cacheRutas[k] = res;
    return res;
  } catch (e) {
    const km = kmRuta(a, b);
    return { pts: puntosCurva(a, b), km, min: minRuta(km), real: false };
  }
}

const mapa = {

    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = L.polyline(pts, { color: CONTRA(), weight: 9, opacity: .95 }).addTo(this.m);

  },
  async ruta(a, b) {
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = this.linea = null;
    if (!a || !b) return null;
    const mio = ++this.token;
    this.dibujarLinea(puntosCurva(a, b));            // provisional mientras llega la ruta real
    const r = await rutaReal(a, b);
    if (mio !== this.token) return r;                 // el usuario ya cambiÃ³ los puntos
    this.dibujarLinea(r.pts);
    this.ultima = r;
    return r;
  },
  encuadrarRuta() {
    if (this.linea) this.m.fitBounds(this.linea.getBounds(), { paddingTopLeft: [45, 70], paddingBottomRight: [45, 60] });
  },
  encuadrar(pts) {
    const l = pts.filter(Boolean).map(p => [p.lat, p.lng]);

    if (l.length === 1) this.m.setView(l[0], 15);
    else this.m.fitBounds(l, { paddingTopLeft: [50, 70], paddingBottomRight: [50, 60] });
  },
  limpiar() {
    ['mkA', 'mkB'].forEach(k => { if (this[k]) { this.m.removeLayer(this[k]); this[k] = null; } });
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = this.linea = null;
    this.limpiarConductor();
    this.limpiarDidi();
  },
  capasDidi: [],
  limpiarDidi() {
    if (this.capasDidi && this.capasDidi.length) {
      this.capasDidi.forEach(l => { try { this.m.removeLayer(l); } catch (_) {} });
      this.capasDidi = [];
    }
  },
  async dibujarCarreraDidi(posConductor, s) {
    this.limpiarDidi();
    if (!this.m || !s) return;

    const A = { lat: +s.origen_lat, lng: +s.origen_lng };
    const B = { lat: +s.destino_lat, lng: +s.destino_lng };

    if (posConductor) {
      this.conductor(posConductor);
    }

    const distYo = kmRuta(posConductor || A, A);
    const etaYo = minRuta(distYo);
    const mkA = L.marker([A.lat, A.lng], {
      icon: this.icono('<div class="didi-mk-a">ðŸ“</div>', 28)
    }).addTo(this.m);
    mkA.bindTooltip(`<b>Recogida:</b> ${etaYo} min (${distYo} km)`, {
      permanent: true, direction: 'top', className: 'didi-tooltip didi-tooltip-a'
    });
    this.capasDidi.push(mkA);

    const distViaje = s.distancia_km || kmRuta(A, B);
    const durViaje = s.duracion_min || minRuta(distViaje);
    const mkB = L.marker([B.lat, B.lng], {
      icon: this.icono('<div class="didi-mk-b">ðŸ</div>', 28)
    }).addTo(this.m);
    mkB.bindTooltip(`<b>Destino:</b> ${durViaje} min (${distViaje} km)`, {
      permanent: true, direction: 'top', className: 'didi-tooltip didi-tooltip-b'
    });
    this.capasDidi.push(mkB);

    if (posConductor) {
      const rutaIda = await rutaReal(posConductor, A);
      const lineaIdaBorde = L.polyline(rutaIda.pts, { color: '#ffffff', weight: 6, opacity: 0.85 }).addTo(this.m);
      const lineaIda = L.polyline(rutaIda.pts, { color: '#FF7D00', weight: 4, dashArray: '6, 8', opacity: 1 }).addTo(this.m);
      this.capasDidi.push(lineaIdaBorde, lineaIda);
    }

    const rutaViaje = await rutaReal(A, B);
    const lineaViajeBorde = L.polyline(rutaViaje.pts, { color: '#002B7A', weight: 8, opacity: 0.85 }).addTo(this.m);
    const lineaViaje = L.polyline(rutaViaje.pts, { color: '#0A5AFF', weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(this.m);
    this.capasDidi.push(lineaViajeBorde, lineaViaje);

    const puntos = [posConductor, A, B].filter(Boolean).map(p => [p.lat, p.lng]);
    this.m.fitBounds(puntos, { paddingTopLeft: [60, 60], paddingBottomRight: [60, 240] });
  },
  mover(desde, hasta, ms, alLlegar) {
    if (this.anim) cancelAnimationFrame(this.anim);
    const t0 = performance.now();
    const paso = ahora => {
      const t = Math.min(1, (ahora - t0) / ms);
      const e = t < .5 ? 2*t*t : -1 + (4 - 2*t)*t;
      this.conductor({ lat: desde.lat + (hasta.lat - desde.lat) * e, lng: desde.lng + (hasta.lng - desde.lng) * e });
      if (t < 1) this.anim = requestAnimationFrame(paso); else alLlegar && alLlegar();
    };
    this.anim = requestAnimationFrame(paso);
  }
};

/* LÃ­mites de Quito y valles aledaÃ±os (Pichincha) */
const EN_QUITO = (lat, lng) => lat >= -0.55 && lat <= 0.15 && lng >= -78.75 && lng <= -78.20;

/* BÃºsqueda de lugares acotada especÃ­ficamente a Quito y alrededores */
async function buscarDirecciones(q) {
  if (!q || q.trim().length < 2) return [];
  const query = q.trim();
  const queryQuito = query.toLowerCase().includes('quito') ? query : `${query}, Quito`;

  // 1. Edge Function de Supabase conectada a Google Maps API
  if (hayConfig()) {
    try {
      const u = `${CFG.SUPABASE_URL}/functions/v1/buscar-lugares?q=${encodeURIComponent(query)}`;
      const resp = await fetch(u, {
        headers: {
          'apikey': CFG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CFG.SUPABASE_ANON_KEY}`
        }
      });
      if (resp.ok) {
        const data = await resp.json();
        const items = data.resultados || data.results || (Array.isArray(data) ? data : []);
        if (items && items.length) {
          const enZona = items.map(d => ({
            texto: d.texto || d.formatted_address || d.name || 'Lugar encontrado',
            lat: +(d.lat ?? d.geometry?.location?.lat),
            lng: +(d.lng ?? d.geometry?.location?.lng)
          })).filter(x => !isNaN(x.lat) && !isNaN(x.lng) && EN_QUITO(x.lat, x.lng));
          if (enZona.length) return enZona;
        }
      }
    } catch (e) {
      console.warn('Edge function buscar-lugares no disponible, usando respaldo:', e);
    }
  }

  // 2. GeocodificaciÃ³n acotada a Quito (calles, intersecciones, barrios y lugares)
  try {
    const urls = [
      `https://nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=ec&viewbox=-78.65,0.05,-78.30,-0.45&bounded=1&q=${encodeURIComponent(query)}`,
      `https://nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=ec&viewbox=-78.65,0.05,-78.30,-0.45&bounded=1&q=${encodeURIComponent(queryQuito)}`
    ];

    let items = [];
    for (const u of urls) {
      const r = await fetch(u, { headers: { 'Accept-Language': 'es' } });
      const j = await r.json();
      if (j && j.length) {
        items = j;
        break;
      }
    }

    const vistos = new Set();
    return items
      .map(d => {
        const partes = d.display_name.split(', ');
        const nom = partes[0] || '';
        const barrio = partes.slice(1, 3).filter(x => !/Ecuador|\d{5,6}|Distrito/.test(x)).join(', ') || 'Quito';
        const label = nom + (barrio ? ` Â· ${barrio}` : '');
        return {
          texto: label,
          lat: +d.lat,
          lng: +d.lon
        };
      })
      .filter(d => {
        if (!EN_QUITO(d.lat, d.lng)) return false;
        const k = `${d.lat.toFixed(4)},${d.lng.toFixed(4)}`;
        if (vistos.has(k)) return false;
        vistos.add(k);
        return true;
      });
  } catch (e) { return []; }
}
async function direccionDe(ll) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll.lat}&lon=${ll.lng}`,
      { headers: { 'Accept-Language': 'es' } });
    const j = await r.json();
    const a = j.address || {};
    return [a.road, a.house_number, a.suburb || a.neighbourhood || a.city_district].filter(Boolean).join(' ') ||
           (j.display_name || '').split(',').slice(0, 2).join(',') || 'Punto en el mapa';
  } catch (e) { return `Punto ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`; }
}

function almacenSeguro() {
  try {
    localStorage.setItem('__ruta', '1'); localStorage.removeItem('__ruta');
    return localStorage;
  } catch (e) {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
  }
}

      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    onOfertas(id, cb) {
      const cargar = async () => {
        const { data } = await sb.from('ofertas_detalle').select('*')

      const g = j.external && j.external.google;
      out.push([g ? 'si' : 'duda', 'Acceso con Google', g ? 'Activado' : 'Desactivado (es opcional)']);
    }
  } catch (e) {
    out.push(['no', 'ConexiÃ³n con el proyecto', 'No respondiÃ³: ' + e.message]);
  }

  for (const t of ['perfiles', 'solicitudes', 'ofertas', 'mensajes', 'solicitudes_detalle',
                   'lugares', 'soporte_tickets', 'soporte_mensajes', 'soporte_bandeja']) {
    try {
      const r = await fetch(`${U}/rest/v1/${t}?select=*&limit=1`, { headers: { apikey: K, Authorization: 'Bearer ' + K } });
      if (r.status === 404) out.push(['no', 'Tabla ' + t, 'No existe. Corre supabase-esquema.sql completo en el SQL Editor']);

    } catch (e) { out.push(['no', 'Tabla ' + t, e.message]); }
  }

  try {
    const r = await fetch(U + '/rest/v1/rpc/aceptar_oferta', {
      method: 'POST',
      headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_oferta: '00000000-0000-0000-0000-000000000000' })
    });
    out.push([r.status === 404 ? 'no' : 'si', 'FunciÃ³n aceptar_oferta',
      r.status === 404 ? 'No existe. Corre el esquema completo' : 'Instalada']);
  } catch (e) { out.push(['duda', 'FunciÃ³n aceptar_oferta', 'No se pudo comprobar']); }

  return out;
}

const errorDeBase = e =>

/* ---------- Registro ---------- */
async function registrar() {
  const nombre = $('#rg-nombre').value.trim();
  const cedula = $('#rg-cedula').value.trim();
  const celular = $('#rg-celular').value.trim();
  const correo = $('#rg-correo').value.trim().toLowerCase();
  const pin = leerPin('registro');
  const rol = $('#rolsel button.on').dataset.rol;

  if (nombre.split(/\s+/).length < 2) return toast('Escribe nombre y apellido', 'bad');
  const rc = revisarCedula(cedula);
  if (!rc.ok && rc.duro) return toast(rc.motivo, 'bad');
  if (!rc.ok && !await confirmar('Revisa tu cÃ©dula', rc.motivo + '. Si estÃ¡s seguro de que el nÃºmero es correcto, puedes continuar.', 'Es correcta, continuar')) return;
  if (!celularValido(celular)) return toast('El celular debe tener 10 dÃ­gitos y empezar en 09', 'bad');
  if (!correoValido(correo)) return toast('Revisa el correo', 'bad');
  if (pin.length !== 4) return toast('El PIN necesita 4 dÃ­gitos', 'bad');
  if (rol === 'conductor' && !normalizarPlaca($('#rg-placa').value.trim()))
    return toast('La placa va con tres letras y tres o cuatro nÃºmeros, como PBA-1234', 'bad');

  const api = conectar();
  if (!api) return;

  const btn = $('#btn-registro');
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  try {
    const clave = claveDePin(pin);
    const datos = { nombre, cedula, celular, rol };
    let r = await api.sb.auth.signUp({
      email: correo, password: clave,
      options: { data: datos, emailRedirectTo: location.href.split('#')[0] }
    });

    // Si el servidor falla guardando el usuario, reintenta sin metadatos:
    // un trigger viejo sobre auth.users puede reventar justamente con ellos.
    if (r.error && errorDeBase(r.error)) {
      r = await api.sb.auth.signUp({ email: correo, password: clave });
    }

    if (r.error) return await errorRegistro(r.error, correo);

    if (!r.data.session) {
      modal(`<div class="grip"></div><h2>Confirma tu correo</h2>
        <p class="dim" style="margin:8px 0 16px">Tu cuenta se creÃ³, pero el proyecto tiene activada la confirmaciÃ³n por correo. Abre el mensaje que te llegÃ³ a <b>${esc(correo)}</b> y luego ingresa con tu PIN.</p>
        <p class="fine">Si no te llega nada, apaga <b>Confirm email</b> en Authentication â†’ Sign In / Providers â†’ Email, o configura un SMTP propio.</p>
        <button class="btn primary full" id="ok-conf" style="margin-top:14px">Entendido</button>`);
      $('#ok-conf').onclick = cerrarModal;
      return;
    }

    S.user = r.data.user;
    await guardarPerfilNuevo({ nombre, cedula, celular, correo, rol });
    if (rol === 'conductor') {
      const veh = {
        placa: normalizarPlaca($('#rg-placa').value.trim()),
        marca: $('#rg-marca').value.trim() || null,
        modelo: $('#rg-modelo').value.trim() || null,
        color: $('#rg-color').value.trim() || null,
        anio: +$('#rg-anio').value || null
      };
      try { S.vehiculo = await api.guardarVehiculo(veh); }
      catch (err) { toast('Cuenta creada, pero el vehÃ­culo no se guardÃ³: ' + err.message, 'bad'); }
    }
    await cargarPerfil();
    arrancarApp();
  } catch (e) {
    await errorRegistro(e, correo);
  } finally {
    btn.disabled = false; btn.textContent = 'Crear cuenta';
  }
}

async function errorRegistro(e, correo) {
  const msg = (e && e.message) || 'Error desconocido';
  if (/already registered|already been registered/i.test(msg)) {
    if (await confirmar('Ese correo ya tiene cuenta', 'Puedes ingresar con tu PIN de 4 dÃ­gitos.', 'Ir a ingresar')) {
      $$('#authtabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'login'));
      $('#tab-login').classList.remove('hidden');
      $('#tab-registro').classList.add('hidden');
      $('#li-correo').value = correo;
    }
    return;
  }
  if (/password/i.test(msg) && /short|6/i.test(msg)) return toast('Supabase pide mÃ­nimo 6 caracteres; el PIN se guarda como PIN+99, revisa que hayas puesto los 4 dÃ­gitos', 'bad');
  if (errorDeBase(e)) {
    return modalDiagnostico('El servidor de Supabase devolviÃ³ error 500 al guardar el usuario. Casi siempre es una de estas dos cosas: la confirmaciÃ³n por correo estÃ¡ encendida sin SMTP, o quedÃ³ un trigger sobre auth.users que falla. Esto es lo que encontrÃ©:');
  }
  toast(msg, 'bad');
}

/* Crea la fila en perfiles. Nunca bloquea el registro si algo falla. */
async function guardarPerfilNuevo(d) {
  const api = S.api;
  let { error } = await api.sb.from('perfiles').upsert({
    id: S.user.id, nombre: d.nombre, cedula: d.cedula || null,
    celular: d.celular || null, correo: d.correo, rol: d.rol || 'pasajero'
  }, { onConflict: 'id' });
  if (error && error.code === '23505') {
    toast('Esa cÃ©dula ya estÃ¡ registrada en otra cuenta, tu perfil quedÃ³ sin ese dato', 'bad');
    const r2 = await api.sb.from('perfiles').upsert({
      id: S.user.id, nombre: d.nombre, cedula: null,
      celular: d.celular || null, correo: d.correo, rol: d.rol || 'pasajero'
    }, { onConflict: 'id' });
    error = r2.error;
  }
  if (error) toast('No se pudo guardar el perfil: ' + error.message, 'bad');
}

async function cargarPerfil() {
  const api = S.api;
  const { data } = await api.sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
  let perfil = data;
  if (!perfil) {
    const md = S.user.user_metadata || {};
    await guardarPerfilNuevo({
      nombre: md.nombre || md.full_name || 'Usuario',
      cedula: md.cedula || null, celular: md.celular || null,
      correo: S.user.email, rol: md.rol || 'pasajero'
    });
    const r = await api.sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
    perfil = r.data;
  }
  if (!perfil) {
    const cached = leerLocal('perfil_cache');
    if (cached) {
      try { perfil = JSON.parse(cached); } catch (_) {}
    }
  }
  if (!perfil) { toast('No se pudo cargar tu perfil', 'bad'); return; }
  guardarLocal('perfil_cache', JSON.stringify(perfil));
  S.perfil = perfil;
  S.esSoporte = !!perfil.es_soporte;

  const v = await api.sb.from('vehiculos').select('*').eq('conductor_id', S.user.id).eq('activo', true).limit(1);

function arrancarApp() {
  $('#loading').classList.add('hidden');

  setVista('inicio');
  /* En segundo plano: atajos guardados, destinos recientes y soporte.
     Cada uno repinta solo si el usuario sigue en la pantalla que los usa. */
  const repintar = () => { if (S.vista === 'inicio' && S.paso === 'form') render(); };
  cargarLugares().then(repintar);
  cargarRecientes().then(repintar);
  escucharSoporte();

}

function ubicarme() {
  mapa.yo(S.pos);
  const marcarOrigen = () => {
    S.origen = { ...S.pos, texto: 'Mi ubicaciÃ³n actual' };
    mapa.punto('a', S.origen);
    if (S.destino) {
      S.km = kmRuta(S.origen, S.destino); S.dur = minRuta(S.km);
      mapa.ruta(S.origen, S.destino).then(r => { if (r) { S.km = r.km; S.dur = r.min; if (S.paso === 'form') render(); } });
    }
  };
  if (S.modo === 'pasajero' && !S.origen && !S.solicitud) marcarOrigen();
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    mapa.yo(S.pos);
    if (!S.solicitud && S.modo === 'pasajero' && (!S.origen || S.origen.texto === 'Mi ubicaciÃ³n actual')) {
      marcarOrigen();
      mapa.m.setView([S.pos.lat, S.pos.lng], 15);
      if (S.paso === 'form') render();
    } else if (!S.solicitud) {
      mapa.m.setView([S.pos.lat, S.pos.lng], 15);
    }
  }, () => {}, { timeout: 7000 });
}

/* El conductor solo puede trabajar si un administrador lo habilitÃ³
   y aprobÃ³ su vehÃ­culo desde el dashboard de Supabase. */
function estadoConductor() {
  if (!S.perfil) return { ok: false, motivo: 'Cargando tu perfil...' };
  if (!S.perfil.conductor_habilitado)
    return { ok: false, motivo: 'Tu cuenta de conductor estÃ¡ en revisiÃ³n. Un administrador debe habilitarla desde el panel.' };
  if (!S.vehiculo)
    return { ok: false, motivo: 'Registra tu vehÃ­culo para poder recibir solicitudes.', sinVehiculo: true };
  if (!S.vehiculo.aprobado)
    return { ok: false, motivo: 'Tu vehÃ­culo estÃ¡ en revisiÃ³n. Un administrador debe aprobarlo desde el panel.' };
  return { ok: true };
}

function escucharCercanas() {
  limpiarSubs();
  let primera = true;
  S.subs.push(S.api.cercanas(lista => {
    S.cercanas = lista.filter(s => s.pasajero_id !== S.user.id);
    /* Avisa solo de lo que no se habÃ­a mostrado antes: el conductor
       casi nunca tiene la app abierta esperando a que algo aparezca. */
    const nuevas = S.cercanas.filter(s => !S.idsVistos.has(s.id));
    nuevas.forEach(s => S.idsVistos.add(s.id));
    if (!primera && nuevas.length) {
      const s = nuevas[0];
      const km = kmRuta(S.pos, { lat: s.origen_lat, lng: s.origen_lng });
      avisar(`${s.tipo === 'paquete' ? 'EnvÃ­o' : 'Viaje'} por ${money(s.precio_ofrecido)}`,
        `A ${km} km de ti Â· ${s.origen_texto || ''}`);
    }
    primera = false;
    if (S.paso === 'solicitudes' && S.vista === 'inicio') render();
  }));
}

async function fijarPunto(cual, ll, texto) {

  else { S.destino = p; mapa.punto('b', p); }

  // Acercar la vista para visualizar dÃ³nde quedÃ³ el punto elegido

  if (S.origen && S.destino) {

}

/* ============================================================
   Alto de la hoja inferior
   Tres posiciones para que el mapa y el contenido se repartan la
   pantalla segÃºn lo que se estÃ© haciendo. Se arrastra el asa, se
   toca para pasar a la siguiente, o se usan las flechas.
   ============================================================ */
const ALTOS = ['compacta', 'media', 'expandida'];
function altoHoja(a) {
  S.alto = ALTOS.includes(a) ? a : 'media';
  guardarLocal('alto', S.alto);
  const sh = $('#sheet');
  sh.classList.toggle('compacta', S.alto === 'compacta');
  sh.classList.toggle('expandida', S.alto === 'expandida');
  $('#asa').setAttribute('aria-label', 'Panel ' + S.alto + '. Toca para cambiar el alto');
  clearTimeout(altoHoja.t);
  altoHoja.t = setTimeout(() => mapa.reencuadrar(), 300);
}
function armarAsa() {
  const asa = $('#asa');
  let y0 = null;
  const salto = n => {
    const i = ALTOS.indexOf(S.alto);
    altoHoja(ALTOS[Math.min(2, Math.max(0, i + n))]);
  };
  asa.addEventListener('pointerdown', e => { y0 = e.clientY; try { asa.setPointerCapture(e.pointerId); } catch (x) {} });
  asa.addEventListener('pointerup', e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    if (dy < -24) salto(1);
    else if (dy > 24) salto(-1);
    else altoHoja(ALTOS[(ALTOS.indexOf(S.alto) + 1) % 3]);
  });
  asa.addEventListener('pointercancel', () => { y0 = null; });
  asa.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') { e.preventDefault(); salto(1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); salto(-1); }
  });
  altoHoja(S.alto);
}

/* ============================================================
   Seguimiento en vivo
   El conductor publica su posiciÃ³n mientras tiene un servicio y
   el pasajero ve el carro moverse en el mapa con su tiempo estimado.
   ============================================================ */
let alMoverse = [];
function seguirMiGps(on) {
  if (!on) {
    if (S.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(S.watchId);
    S.watchId = null;
    alMoverse = [];
    return;
  }
  if (S.watchId != null || !navigator.geolocation) return;
  let ultimo = 0;
  S.watchId = navigator.geolocation.watchPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    mapa.yo(S.pos);
    alMoverse.forEach(f => { try { f(S.pos); } catch (e) {} });
    const ahora = Date.now();
    if (ahora - ultimo > 8000) { ultimo = ahora; S.api.publicarPos(S.pos).catch(() => {}); }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

function seguirConductor(s) {
  if (S.modo !== 'pasajero' || !s.conductor_id) return;
  if (S.subPos) { try { S.subPos(); } catch (e) {} S.subPos = null; }
  S.subPos = S.api.onPosConductor(s.conductor_id, p => {
    const antes = S.posConductor;
    S.posConductor = p;
    if (antes && (antes.lat !== p.lat || antes.lng !== p.lng)) mapa.mover(antes, p, 1400);
    else mapa.conductor(p);
    pintarEta();
  });
}
function pintarEta() {
  const el = $('#eta');
  const s = S.solicitud;
  if (!el || !s || !S.posConductor) return;
  const meta = s.estado === 'a_bordo'
    ? { lat: +s.destino_lat, lng: +s.destino_lng }
    : { lat: +s.origen_lat, lng: +s.origen_lng };
  const km = kmRuta(S.posConductor, meta);
  el.textContent = km < .2
    ? (s.estado === 'a_bordo' ? 'EstÃ¡n llegando al destino' : 'Tu conductor ya estÃ¡ afuera')
    : `A ${km} km Â· unos ${minRuta(km)} min`;
}

function seguirSolicitud() {
  limpiarSubs();
  S.subs.push(S.api.onOfertas(S.solicitud.id, async lista => {
    const antes = S.ofertas.length;
    S.ofertas = lista;
    if (lista.length > antes && S.paso === 'esperando' && !S.solicitud.auto_asignar) {
      const o = lista[0];
      avisar('Tienes una oferta', `${o.conductor_nombre || 'Un conductor'} pide ${money(o.precio)}`);
    }
    const auto = S.solicitud.tipo === 'paquete' || S.solicitud.auto_asignar;
    if (auto && S.paso === 'esperando') {
      const primera = lista.find(o => +o.precio <= +S.solicitud.precio_ofrecido);
      if (primera) {
        try {
          const sol = await S.api.aceptarOferta(primera);
          if (sol) {
            S.solicitud = { ...S.solicitud, ...sol };
            S.paso = 'viaje';
            dibujarViaje(S.solicitud);
            S.subs.push(S.api.onMensajes(S.solicitud.id, alRecibirMensajes));
            toast(`${(primera.conductor_nombre || 'Un conductor').split(' ')[0]} tomÃ³ tu ${S.solicitud.tipo === 'paquete' ? 'envÃ­o' : 'viaje'}`);
          }
        } catch (e) { /* otro conductor se adelantÃ³ o ya estÃ¡ asignada */ }
      }
    }
    if (S.paso === 'esperando') render();
  }));
  S.subs.push(S.api.onSolicitud(S.solicitud.id, sol => {
    S.solicitud = { ...S.solicitud, ...sol };
    if (['aceptado', 'en_camino', 'a_bordo'].includes(sol.estado) && S.paso !== 'viaje') {
      S.paso = 'viaje';
      dibujarViaje(S.solicitud);
      S.subs.push(S.api.onMensajes(sol.id, alRecibirMensajes));
    }
    if (sol.estado === 'finalizado') S.paso = 'calificar';
    if (sol.estado === 'cancelado' && S.paso !== 'calificar') { toast('La solicitud se cancelÃ³', 'bad'); resetViaje(); mapa.limpiar(); ubicarme(); }
    render();
  }));
}

async function enviarOferta(s, precio) {
  if (S.solicitud && !['finalizado', 'cancelado'].includes(S.solicitud.estado)) {
    return toast('Ya tienes un servicio en curso. Debes finalizarlo antes de aceptar otro.', 'bad');
  }
  const eta = minRuta(kmRuta(S.pos, { lat: s.origen_lat, lng: s.origen_lng }));
  try {
    await S.api.crearOferta(s, precio, eta);
    S.ofertaEnviada = { solicitud_id: s.id, precio };
    toast(`Oferta de ${money(precio)} enviada`);
    S.subs.push(S.api.onSolicitud(s.id, sol => {
      const mia = sol.conductor_id === S.user.id;
      if (sol.estado === 'aceptado' && mia) {
        S.solicitud = { ...s, ...sol };
        S.ofertaEnviada = null;
        S.siguiente = null;
        S.paso = 'viaje';
        dibujarViaje(S.solicitud);
        S.subs.push(S.api.onMensajes(sol.id, alRecibirMensajes));
        render();
      } else if (['cancelado', 'aceptado'].includes(sol.estado) && !mia) {
        if (S.ofertaEnviada && S.ofertaEnviada.solicitud_id === s.id) {
          S.ofertaEnviada = null;
          toast('Esa solicitud ya fue tomada por otro conductor');
        }
        render();
      }
    }));
    render();
  } catch (e) {
    toast(e.message || 'No se pudo enviar la oferta', 'bad');
  }
}

async function dibujarViaje(s) {
  const A = { lat: +s.origen_lat, lng: +s.origen_lng }, B = { lat: +s.destino_lat, lng: +s.destino_lng };
  mapa.punto('a', A); mapa.punto('b', B);
  mapa.encuadrar([A, B]);
  /* El conductor publica dÃ³nde va; el pasajero lo sigue en el mapa */
  if (S.modo === 'conductor') seguirMiGps(true);
  else seguirConductor(s);
  await mapa.ruta(A, B);
  mapa.encuadrarRuta();
}

/* Placa ecuatoriana: tres letras y tres o cuatro nÃºmeros */
function normalizarPlaca(p) {
  const s = p.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const m = s.match(/^([A-Z]{3})(\d{3,4})$/);
  return m ? m[1] + '-' + m[2] : null;
}

(async function arranque() {
  /* El enlace de "olvidÃ© mi PIN" vuelve con type=recovery en el hash */
  const recuperando = location.hash.includes('type=recovery');
  if (!hayConfig()) { pantallaAcceso(); return; }
  try {
    const api = conectar();
    if (!api) { pantallaAcceso(); return; }

    // Mantener la sesiÃ³n activa y responder a cambios de token
    api.sb.auth.onAuthStateChange(async (event, sesion) => {
      if (sesion && sesion.user) {
        S.user = sesion.user;
        if (!S.perfil) {
          await cargarPerfil();
          if (S.perfil && $('#app').classList.contains('hidden')) arrancarApp();
        }
      }
    });

    let { data } = await api.sb.auth.getSession();
    let session = data && data.session;
    if (!session) {
      try {
        const ref = await api.sb.auth.refreshSession();
        if (ref && ref.data && ref.data.session) session = ref.data.session;
      } catch (_) {}
    }

    if (session && session.user) {
      S.user = session.user;
      await cargarPerfil();
      if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
      if (S.perfil) {
        arrancarApp();
        if (recuperando) { toast('Elige tu PIN nuevo'); modalCambiarPin(); }
        return;
      }
    }
  } catch (e) { console.warn('Aviso de inicio de sesiÃ³n:', e); }
  pantallaAcceso();
})();
