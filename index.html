/* ---------- PIN ---------- */
const leerPin = cual => $$(`[data-pin="${cual}"] input`).map(i => i.value.trim()).join('');
function limpiarPin(cual) { $$(`[data-pin="${cual}"] input`).forEach(i => i.value = ''); }
function armarPines() {
  $$('.pinbox').forEach(box => {
    const ins = [...box.querySelectorAll('input')];
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && ins[i + 1]) ins[i + 1].focus();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus();
        if (e.key === 'Enter' && $('#tab-login') && !$('#tab-login').classList.contains('hidden')) $('#btn-login').click();
      });
    });
  });
}

  $('#loading').classList.add('hidden');
  $('#auth').classList.remove('hidden');

const errorDeBase = e =>
  e && (e.status === 500 || /database error|unexpected_failure|internal/i.test(e.message || ''));

/* Los errores de Supabase llegan con el texto crudo de Postgres
   ("new row violates row-level security policy for table ofertas"), que no
   le dice nada a quien está manejando. Esto los traduce; el detalle técnico
   queda en la consola para quien mantiene la app. */
const RLS = e => e && (e.code === '42501' || e.status === 403 ||
  /row-level security|violates row level|permission denied/i.test(e.message || ''));

function explicarError(e, quePasaba) {
  console.warn('[Ruta] ' + (quePasaba || 'error'), e);
  if (!e) return 'No se pudo completar la acción';
  if (e.code === '23505') return 'Eso ya estaba registrado';
  if (e.code === '23503') return 'Falta un dato relacionado, vuelve a intentarlo';
  if (RLS(e)) return 'La base rechazó la operación por permisos';
  if (e.status === 0 || /fetch|network|failed to fetch/i.test(e.message || ''))
    return 'Sin conexión con el servidor, revisa tu internet';
  return e.message || 'No se pudo completar la acción';
}

/* ---------- Registro ---------- */
async function registrar() {
  const nombre = $('#rg-nombre').value.trim();
  const cedula = $('#rg-cedula').value.trim();
  const celular = $('#rg-celular').value.trim();
  const correo = $('#rg-correo').value.trim().toLowerCase();
  const pin = leerPin('registro');
  const rol = $('#rolsel button.on').dataset.rol;

  if (nombre.split(/\s+/).length < 2) return toast('Escribe nombre y apellido', 'bad');
  const rc = revisarCedula(cedula);
  if (!rc.ok && rc.duro) return toast(rc.motivo, 'bad');
  if (!rc.ok && !await confirmar('Revisa tu cédula', rc.motivo + '. Si estás seguro de que el número es correcto, puedes continuar.', 'Es correcta, continuar')) return;
  if (!celularValido(celular)) return toast('El celular debe tener 10 dígitos y empezar en 09', 'bad');
  if (!correoValido(correo)) return toast('Revisa el correo', 'bad');
  if (pin.length !== 4) return toast('El PIN necesita 4 dígitos', 'bad');
  if (rol === 'conductor' && !normalizarPlaca($('#rg-placa').value.trim()))
    return toast('La placa va con tres letras y tres o cuatro números, como PBA-1234', 'bad');

  const api = conectar();
  if (!api) return;

  const btn = $('#btn-registro');
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  try {
    const clave = claveDePin(pin);
    const datos = { nombre, cedula, celular, rol };
    let r = await api.sb.auth.signUp({
      email: correo, password: clave,
      options: { data: datos, emailRedirectTo: location.href.split('#')[0] }
    });

    // Si el servidor falla guardando el usuario, reintenta sin metadatos:
    // un trigger viejo sobre auth.users puede reventar justamente con ellos.
    if (r.error && errorDeBase(r.error)) {
      r = await api.sb.auth.signUp({ email: correo, password: clave });
    }

    if (r.error) return await errorRegistro(r.error, correo);

    if (!r.data.session) {
      modal(`<div class="grip"></div><h2>Confirma tu correo</h2>
        <p class="dim" style="margin:8px 0 16px">Tu cuenta se creó, pero el proyecto tiene activada la confirmación por correo. Abre el mensaje que te llegó a <b>${esc(correo)}</b> y luego ingresa con tu PIN.</p>
        <p class="fine">Si no te llega nada, apaga <b>Confirm email</b> en Authentication → Sign In / Providers → Email, o configura un SMTP propio.</p>
        <button class="btn primary full" id="ok-conf" style="margin-top:14px">Entendido</button>`);
      $('#ok-conf').onclick = cerrarModal;
      return;
    }

    S.user = r.data.user;
    await guardarPerfilNuevo({ nombre, cedula, celular, correo, rol });
    if (rol === 'conductor') {
      const veh = {
        placa: normalizarPlaca($('#rg-placa').value.trim()),
        marca: $('#rg-marca').value.trim() || null,
        modelo: $('#rg-modelo').value.trim() || null,
        color: $('#rg-color').value.trim() || null,
        anio: +$('#rg-anio').value || null
      };
      try { S.vehiculo = await api.guardarVehiculo(veh); }
      catch (err) { toast('Cuenta creada, pero el vehículo no se guardó: ' + err.message, 'bad'); }
    }
    await cargarPerfil();
    arrancarApp();
  } catch (e) {
    await errorRegistro(e, correo);
  } finally {
    btn.disabled = false; btn.textContent = 'Crear cuenta';
  }
}

async function errorRegistro(e, correo) {
  const msg = (e && e.message) || 'Error desconocido';
  if (/already registered|already been registered/i.test(msg)) {
    if (await confirmar('Ese correo ya tiene cuenta', 'Puedes ingresar con tu PIN de 4 dígitos.', 'Ir a ingresar')) {
      $$('#authtabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'login'));
      $('#tab-login').classList.remove('hidden');
      $('#tab-registro').classList.add('hidden');
      $('#li-correo').value = correo;
    }
    return;
  }
  if (/password/i.test(msg) && /short|6/i.test(msg)) return toast('Supabase pide mínimo 6 caracteres; el PIN se guarda como PIN+99, revisa que hayas puesto los 4 dígitos', 'bad');
  if (errorDeBase(e)) {
    return modalDiagnostico('El servidor de Supabase devolvió error 500 al guardar el usuario. Casi siempre es una de estas dos cosas: la confirmación por correo está encendida sin SMTP, o quedó un trigger sobre auth.users que falla. Esto es lo que encontré:');
  }
  toast(msg, 'bad');
}

/* Crea la fila en perfiles. Nunca bloquea el registro si algo falla. */
async function guardarPerfilNuevo(d) {
  const api = S.api;
  let { error } = await api.sb.from('perfiles').upsert({
    id: S.user.id, nombre: d.nombre, cedula: d.cedula || null,
    celular: d.celular || null, correo: d.correo, rol: d.rol || 'pasajero'
  }, { onConflict: 'id' });
  if (error && error.code === '23505') {
    toast('Esa cédula ya está registrada en otra cuenta, tu perfil quedó sin ese dato', 'bad');
    const r2 = await api.sb.from('perfiles').upsert({
      id: S.user.id, nombre: d.nombre, cedula: null,
      celular: d.celular || null, correo: d.correo, rol: d.rol || 'pasajero'
    }, { onConflict: 'id' });
    error = r2.error;
  }
  if (error) toast('No se pudo guardar el perfil: ' + error.message, 'bad');
}

/* ---------- Ingreso ---------- */
async function ingresar() {
  const correo = $('#li-correo').value.trim().toLowerCase();
  const pin = leerPin('login');
  if (!correoValido(correo)) return toast('Revisa el correo', 'bad');
  if (pin.length !== 4) return toast('El PIN necesita 4 dígitos', 'bad');
  const espera = esperaLogin();
  if (espera) return toast(`Demasiados intentos. Espera ${espera} segundo${espera === 1 ? '' : 's'} y vuelve a probar`, 'bad');
  const api = conectar();
  if (!api) return;
  const btn = $('#btn-login');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const { data, error } = await api.sb.auth.signInWithPassword({ email: correo, password: claveDePin(pin) });
    if (error) {
      if (/invalid login/i.test(error.message)) {
        anotarFalloLogin();
        const falta = esperaLogin();
        toast(falta
          ? `Correo o PIN incorrectos. Por seguridad espera ${falta} segundos antes del siguiente intento`
          : 'Correo o PIN incorrectos', 'bad');
      }
      else if (/not confirmed/i.test(error.message)) toast('Falta confirmar tu correo. Revisa tu bandeja de entrada', 'bad');
      else if (/rate limit|too many/i.test(error.message)) toast('Demasiados intentos seguidos. Prueba de nuevo en unos minutos', 'bad');
      else if (errorDeBase(error)) modalDiagnostico('El servidor devolvió un error al iniciar sesión. Esto encontré:');
      else toast(error.message, 'bad');
      limpiarPin('login');
      return;
    }
    limpiarFalloLogin();
    S.user = data.user;
    guardarLocal('ultimo_correo', correo);
    await cargarPerfil();
    arrancarApp();
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}

async function cargarPerfil() {
  const api = S.api;
  const { data } = await api.sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
  let perfil = data;
  if (!perfil) {
    const md = S.user.user_metadata || {};
    await guardarPerfilNuevo({
      nombre: md.nombre || md.full_name || 'Usuario',
      cedula: md.cedula || null, celular: md.celular || null,
      correo: S.user.email, rol: md.rol || 'pasajero'
    });
    const r = await api.sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
    perfil = r.data;
  }
  let deCache = false;
  if (!perfil) {
    const cached = leerLocal('perfil_cache');
    if (cached) {
      try { perfil = JSON.parse(cached); deCache = !!perfil; } catch (_) {}
    }
  }
  if (!perfil) { toast('No se pudo cargar tu perfil', 'bad'); return; }
  /* El respaldo local sirve para arrancar sin red, nada más. No guarda
     cédula ni celular (el localStorage lo lee cualquiera que abra el
     teléfono) y tampoco el permiso de conductor: habilitar a alguien lo
     decide la base, no una copia en el navegador que se puede editar. */
  if (!deCache) guardarLocal('perfil_cache', JSON.stringify({
    id: perfil.id, nombre: perfil.nombre, rol: perfil.rol,
    calificacion: perfil.calificacion, viajes_totales: perfil.viajes_totales
  }));
  perfil.desdeCache = deCache;
  S.perfil = perfil;
  S.esSoporte = !deCache && !!perfil.es_soporte;
  S.modo = perfil.rol === 'conductor' ? 'conductor' : 'pasajero';
  if (deCache) { S.vehiculo = null; return; }
  const v = await api.sb.from('vehiculos').select('*').eq('conductor_id', S.user.id).eq('activo', true).limit(1);
  S.vehiculo = (v.data && v.data[0]) || null;
  if (!S.perfil.cedula || !S.perfil.celular) completarPerfil();
}

function completarPerfil() {
  modal(`<div class="grip"></div>
    <h2>Completa tus datos</h2>
    <p class="dim" style="margin:6px 0 16px">Los conductores necesitan verificar tu identidad antes de recogerte.</p>
    <div class="field"><label>Número de identidad</label><input id="cp-ced" class="input" inputmode="numeric" maxlength="15" value="${esc(S.perfil.cedula || '')}"></div>
    <div class="field"><label>Celular</label><input id="cp-cel" class="input" inputmode="tel" maxlength="10" value="${esc(S.perfil.celular || '')}"></div>
    <button class="btn primary full" id="cp-ok" style="margin-top:8px">Guardar</button>`);
  $('#cp-ok').onclick = async () => {
    const ced = $('#cp-ced').value.trim(), cel = $('#cp-cel').value.trim();
    const rc = revisarCedula(ced);
    if (!rc.ok && rc.duro) return toast(rc.motivo, 'bad');
    if (!rc.ok && !await confirmar('Revisa tu cédula', rc.motivo + '. Si estás seguro de que el número es correcto, puedes continuar.', 'Es correcta, continuar')) return;
    if (!celularValido(cel)) return toast('Celular inválido', 'bad');

    } catch (e) {

    }
  };
}

/* ============================================================
   8. Estructura de la app
   ============================================================ */
function arrancarApp() {
  $('#loading').classList.add('hidden');
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  if (!mapa.m) mapa.init(); else setTimeout(() => mapa.m.invalidateSize(), 200);
  ubicarme();
  pintarTop();
  S.paso = S.modo === 'conductor' ? 'solicitudes' : 'form';
  setVista('inicio');
  /* En segundo plano: atajos guardados, destinos recientes y soporte.
     Cada uno repinta solo si el usuario sigue en la pantalla que los usa. */
  const repintar = () => { if (S.vista === 'inicio' && S.paso === 'form') render(); };
  cargarLugares().then(repintar);
  cargarRecientes().then(repintar);
  escucharSoporte();
  pedirAvisos();
}

function ubicarme() {
  mapa.yo(S.pos);
  const marcarOrigen = () => {
    S.origen = { ...S.pos, texto: 'Mi ubicación actual' };
    if (S.destino) { S.km = kmRuta(S.origen, S.destino); S.dur = minRuta(S.km); }
    mapa.firma = null;   // que el sync vuelva a dibujar con el punto nuevo
  };
  if (S.modo === 'pasajero' && !S.origen && !S.solicitud) marcarOrigen();
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    /* Si el GPS cae fuera de Ecuador (VPN, escritorio, emulador) se
       ignora y la app sigue centrada en Quito. */
    if (!EN_ECUADOR(p.coords.latitude, p.coords.longitude)) return;
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    mapa.yo(S.pos);
    /* El GPS puede contestar varios segundos después, cuando el usuario
       ya eligió a dónde va. En ese caso se actualiza el punto pero no se
       toca el encuadre: antes el mapa saltaba de vuelta al punto azul y
       la ruta desaparecía de la pantalla. */
    const armando = S.origen && S.destino;
    const enInicio = S.vista === 'inicio' && !S.eligiendo;
    if (!S.solicitud && S.modo === 'pasajero' && (!S.origen || S.origen.texto === 'Mi ubicación actual')) {
      marcarOrigen();
      if (!armando && enInicio) mapa.m.setView([S.pos.lat, S.pos.lng], 15);
      if (enInicio) render();
    } else if (!S.solicitud && !armando && enInicio) {
      mapa.m.setView([S.pos.lat, S.pos.lng], 15);
    }
  }, () => {}, { timeout: 7000 });
}

/* El conductor solo puede trabajar si un administrador lo habilitó
   y aprobó su vehículo desde el dashboard de Supabase. */
function estadoConductor() {
  if (!S.perfil) return { ok: false, motivo: 'Cargando tu perfil...' };
  if (S.perfil.desdeCache)
    return { ok: false, motivo: 'Estamos usando una copia guardada de tu perfil porque no hubo conexión. Vuelve a entrar con internet para trabajar.' };
  if (!S.perfil.conductor_habilitado)
    return { ok: false, motivo: 'Tu cuenta de conductor está en revisión. Un administrador debe habilitarla desde el panel.' };
  if (!S.vehiculo)
    return { ok: false, motivo: 'Registra tu vehículo para poder recibir solicitudes.', sinVehiculo: true };
  if (!S.vehiculo.aprobado)
    return { ok: false, motivo: 'Tu vehículo está en revisión. Un administrador debe aprobarlo desde el panel.' };
  return { ok: true };
}

/* Centra el mapa: el conductor en su GPS, el pasajero en su punto de recogida */
function centrarEnMi() {
  /* Con una ruta armada encuadra todo el recorrido, que es lo que se quiere
     ver; sin ruta, centra en la posición propia. */
  mapa.aMano = false;
  if (mapa.linea || (mapa.capasDidi && mapa.capasDidi.length)) {
    mapa.reencuadrarPuntos();
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => {
      if (!EN_ECUADOR(p.coords.latitude, p.coords.longitude)) return;
      S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
      mapa.yo(S.pos);
    }, () => {}, { timeout: 6000 });
    return;
  }
  const ref = (S.modo === 'pasajero' && S.origen) ? S.origen : S.pos;
  mapa.m.setView([ref.lat, ref.lng], 16, { animate: true });
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    mapa.yo(S.pos);
    if (S.modo === 'conductor' || !S.origen) mapa.m.setView([S.pos.lat, S.pos.lng], 16, { animate: true });
  }, () => {}, { timeout: 6000 });
}

function pintarTop() {
  $('#avatar').textContent = iniciales(S.perfil && S.perfil.nombre);
  const esConductor = S.modo === 'conductor';
  const b = $('#btn-linea');
  b.classList.toggle('hidden', !esConductor);
  b.classList.toggle('live', S.enLinea);
  $('#linea-txt').textContent = S.enLinea ? 'En línea' : 'Fuera de línea';
  /* Trabajando, el botón de la esquina sirve para desconectarse: es lo
     que un conductor necesita a la mano, no su foto de perfil (que
     sigue en la pestaña Perfil). */
  const p = $('#btn-power');
  p.classList.toggle('hidden', !esConductor);
  p.classList.toggle('on', S.enLinea);
  p.innerHTML = IC.poder('sm');
  p.title = S.enLinea ? 'Desconectarme' : 'Conectarme';
  p.setAttribute('aria-label', p.title);
  $('#avatar').classList.toggle('hidden', esConductor);
}

function setVista(v) {
  S.vista = v;
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.vista === v));
  render();
}

async function setModo(m) {
  if (S.modo === m) return;
  limpiarSubs();
  S.modo = m;
  S.solicitud = null; S.ofertas = []; S.ofertaEnviada = null; S.siguiente = null;
  S.paso = m === 'conductor' ? 'solicitudes' : 'form';
  mapa.limpiar();
  try { await S.api.guardarPerfil({ rol: m }); } catch (e) { toast('No se pudo cambiar el rol: ' + e.message, 'bad'); }
  if (m === 'conductor' && S.enLinea) escucharCercanas();
  if (m === 'pasajero') ubicarme();
  mapa.pintarTeselas();
  pintarTop(); setVista('inicio');
}

async function alternarLinea() {
  if (!S.enLinea) {
    const e = estadoConductor();
    if (!e.ok) {
      toast(e.motivo, 'bad');
      if (e.sinVehiculo) modalVehiculo();
      return;
    }
  }
  S.enLinea = !S.enLinea;
  pintarTop();
  try { await S.api.setEnLinea(S.enLinea, S.pos); } catch (e) {}
  if (S.enLinea) { escucharCercanas(); toast('Estás en línea, te llegarán solicitudes'); }
  else { limpiarSubs(); S.cercanas = []; toast('Fuera de línea'); }
  render();
}

function escucharCercanas() {
  limpiarSubs();
  let primera = true;
  S.subs.push(S.api.cercanas(lista => {
    S.cercanas = lista.filter(s => s.pasajero_id !== S.user.id);
    /* Avisa solo de lo que no se había mostrado antes: el conductor
       casi nunca tiene la app abierta esperando a que algo aparezca. */
    const nuevas = S.cercanas.filter(s => !S.idsVistos.has(s.id));
    nuevas.forEach(s => S.idsVistos.add(s.id));
    if (!primera && nuevas.length) {
      const s = nuevas[0];
      const km = kmRuta(S.pos, { lat: s.origen_lat, lng: s.origen_lng });
      avisar(`${s.tipo === 'paquete' ? 'Envío' : 'Viaje'} por ${money(s.precio_ofrecido)}`,
        `A ${km} km de ti · ${s.origen_texto || ''}`);
    }
    primera = false;
    if (S.paso === 'solicitudes' && S.vista === 'inicio') render();
  }));
}

/* ============================================================
   9. Render
   ============================================================ */
/* ------------------------------------------------------------------
   El mapa, siempre mostrando lo que toca
   Antes el mapa solo se dibujaba en el momento de elegir un punto. Si
   el GPS contestaba tarde, si se pasaba de paso o si el usuario movia
   el mapa con el dedo, la recogida y el destino se quedaban fuera de
   pantalla: se veia el mapa en blanco con un solo punto azul. Ahora
   cada repintado deja el mapa como corresponde al paso actual.

   La "firma" es el resumen de lo que el mapa deberia estar mostrando.
   Mientras no cambie no se redibuja ni se reencuadra, asi el usuario
   puede mover el mapa a mano sin que la app se lo devuelva a su sitio.
   ------------------------------------------------------------------ */
function firmaMapa() {
  const p = x => x ? (+x.lat).toFixed(5) + ',' + (+x.lng).toFixed(5) : '-';
  const s = S.solicitud;
  if (s && !['finalizado', 'cancelado'].includes(s.estado)) return [S.modo, 'sv', s.id, s.estado].join('|');
  if (S.modo === 'conductor') {
    const c = S.cercanas[S.cercanaIdx];
    return ['cond', S.enLinea ? 'on' : 'off', c ? c.id : 'vacio'].join('|');
  }
  return ['pas', S.paso === 'calificar' ? 'fin' : 'pide', p(S.origen), p(S.destino)].join('|');
}

async function sincronizarMapa() {
  if (!mapa.m || S.eligiendo || S.vista !== 'inicio') return;
  const firma = firmaMapa();
  if (firma === mapa.firma) return;
  mapa.firma = firma;
  mapa.aMano = false;          // paso nuevo: el encuadre vuelve a ser de la app
  const vigente = () => mapa.firma === firma;

  const s = S.solicitud;

  /* 1. Servicio en curso: el conductor ve su ruta rotulada; el pasajero
        ve recogida, destino y el carro acercandose. */
  if (s && !['finalizado', 'cancelado'].includes(s.estado)) {
    const A = { lat: +s.origen_lat, lng: +s.origen_lng };
    const B = { lat: +s.destino_lat, lng: +s.destino_lng };
    if (S.modo === 'conductor') return mapa.dibujarCarreraDidi(S.pos, s);
    mapa.limpiarDidi();
    const km = +s.distancia_km || kmRuta(A, B);
    mapa.etiquetarViaje(A, B, null, { km, min: +s.duracion_min || minRuta(km) });
    mapa.encuadrar([A, B, S.posConductor]);
    await mapa.ruta(A, B);
    if (vigente()) mapa.encuadrarRuta([S.posConductor]);
    return;
  }

  /* 2. Conductor revisando las solicitudes de la zona. */
  if (S.modo === 'conductor') {
    const c = S.cercanas[S.cercanaIdx];
    if (!c) {
      mapa.limpiarDidi(); mapa.borrarRuta();
      mapa.quitarPunto('a'); mapa.quitarPunto('b');
      mapa.m.setView([S.pos.lat, S.pos.lng], 14, { animate: true });
      return;
    }
    return mapa.dibujarCarreraDidi(S.pos, c);
  }

  /* 3. Pasajero armando el pedido: los dos puntos y la ruta entre
        ellos, en cualquiera de los pasos (destino, detalles, precio). */
  mapa.limpiarDidi();
  if (S.origen && S.destino) {
    mapa.etiquetarViaje(S.origen, S.destino, null, { km: S.km, min: S.dur });
    mapa.encuadrar([S.origen, S.destino]);
    const r = await mapa.ruta(S.origen, S.destino);
    if (!vigente()) return;
    if (r) {
      S.km = r.km; S.dur = r.min;
      mapa.etiquetarViaje(S.origen, S.destino, null, { km: r.km, min: r.min });
      if (S.paso === 'form') render();
    }
    mapa.encuadrarRuta();
    return;
  }
  mapa.borrarRuta();
  mapa.quitarPunto('b');
  if (S.origen) {
    mapa.punto('a', S.origen, 'Recogida');
    mapa.m.setView([S.origen.lat, S.origen.lng], 16, { animate: true });
  } else {
    mapa.quitarPunto('a');
  }
}

function render() {
  const sh = $('#sheetbody');
  $('#sheet').scrollTop = 0;
  if (S.eligiendo) return pintarSelector(sh);
  $('#cross').classList.add('hidden');
  if (S.vista === 'actividad') return pintarActividad(sh);
  if (S.vista === 'ayuda')     return pintarAyuda(sh);
  if (S.vista === 'perfil')    return pintarPerfil(sh);
  const r = S.modo === 'conductor' ? pintarConductor(sh) : pintarPasajero(sh);
  sincronizarMapa();
  return r;
}

/* ---------- selector de ubicación ---------- */
let tGeo = null;
function abrirSelector(cual) {
  S.eligiendo = cual;
  const ref = (cual === 'origen' ? S.origen : S.destino) || S.origen || S.pos;
  mapa.m.setView([ref.lat, ref.lng], 16);
  $('#cross').classList.remove('hidden');
  render();
  mapa.m.on('moveend', etiquetaPunto);
  etiquetaPunto();
}
function cerrarSelector() {
  S.eligiendo = null;
  mapa.m.off('moveend', etiquetaPunto);
  mapa.limpiarSugerencias();
  $('#cross').classList.add('hidden');
  render();
}
function etiquetaPunto() {
  clearTimeout(tGeo);
  const el = $('#sel-dir'); if (!el) return;
  const c0 = mapa.m.getCenter();
  const ok = EN_ECUADOR(c0.lat, c0.lng);
  const btn = $('#sel-ok');
  if (btn) btn.disabled = !ok;
  if (!ok) { el.textContent = 'Ese punto está fuera de Ecuador'; return; }
  el.textContent = 'Buscando dirección...';
  tGeo = setTimeout(async () => {
    const c = mapa.m.getCenter();
    const dir = await direccionDe({ lat: c.lat, lng: c.lng });
    if ($('#sel-dir')) $('#sel-dir').textContent = dir;
  }, 450);
}
const TITULOS_SEL = {
  origen:  ['¿Dónde te recogemos?', 'Mueve el mapa o busca una dirección'],
  destino: ['¿A dónde vamos?', 'Mueve el mapa o busca una dirección'],
  lugar:   ['¿Qué lugar quieres guardar?', 'Ubícalo en el mapa y luego ponle un nombre']
};
function pintarSelector(sh) {
  const cual = S.eligiendo;
  const esLugar = cual === 'lugar';
  const tit = TITULOS_SEL[cual] || TITULOS_SEL.destino;
  sh.innerHTML = `
    <div class="head"><button class="back" id="sel-x" aria-label="Cerrar">${IC.cerrar('sm')}</button>
      <div class="grow"><h2>${tit[0]}</h2><div class="dim">${tit[1]}</div></div></div>
    <div class="buscador">
      ${IC.buscar('sm')}
      <input id="sel-q" placeholder="Nombre del lugar, calle o negocio" autocomplete="off" enterkeyhint="search">
      <button id="sel-borrar" class="hidden" aria-label="Borrar lo escrito">${IC.cerrar('sm')}</button>
    </div>
    <div id="sel-res"></div>
    ${esLugar ? '' : `<div class="chips" id="chips-sel" style="margin-top:10px"></div>`}
    <div class="card plano" style="margin-top:10px"><div class="dim">Punto elegido</div>
      <div id="sel-dir" style="margin-top:2px;font-weight:500">—</div></div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="sel-ok">${esLugar ? 'Ponerle nombre' : 'Confirmar punto'}</button>
      <button class="btn" id="sel-yo">Mi ubicación</button>
    </div>
    ${esLugar ? '' : `<button class="btn suave full sm" id="sel-guardar" style="margin-top:8px">Guardar este punto en mis lugares</button>`}`;

  $('#sel-x').onclick = cerrarSelector;
  $('#sel-ok').onclick = () => {
    const c = mapa.m.getCenter();
    fijarPunto(cual, { lat: c.lat, lng: c.lng }, $('#sel-dir').textContent);
  };
  $('#sel-yo').onclick = async () => {
    mapa.m.setView([S.pos.lat, S.pos.lng], 16);
    fijarPunto(cual, S.pos, await direccionDe(S.pos));
  };
  if (!esLugar) {
    chipsLugares('#chips-sel', l => {
      mapa.m.setView([l.lat, l.lng], 16);
      fijarPunto(cual, { lat: l.lat, lng: l.lng }, l.etiqueta);
    });
    $('#sel-guardar').onclick = () => {
      const c = mapa.m.getCenter();
      editarLugar({ lat: c.lat, lng: c.lng }, $('#sel-dir').textContent);
    };
  }

  /* Resultados en lista, como en un mapa: nombre del sitio arriba,
     dirección debajo y la distancia a la derecha. Los mismos puntos
     quedan numerados en el mapa para elegirlos tocándolos. */
  const caja = $('#sel-res');
  const pintarRes = (lista, cargando) => {
    if (cargando) {
      caja.innerHTML = `<div class="gm-cargando"><div class="spin"></div>Buscando lugares...</div>`;
      return;
    }
    if (!lista) { caja.innerHTML = ''; mapa.limpiarSugerencias(); return; }
    if (!lista.length) {
      caja.innerHTML = `<div class="gm-cargando">Sin resultados en Ecuador. Mueve el mapa y confirma el punto.</div>`;
      mapa.limpiarSugerencias();
      return;
    }
    caja.innerHTML = `<div class="gm-list">${lista.map((x, i) => `
      <button class="gm-row ${x.enQuito ? 'esta' : ''}" data-i="${i}">
        <span class="pinico">${IC.pin('sm')}</span>
        <span class="tx"><span class="n">${esc(x.nombre)}</span>
          <span class="d">${esc(x.texto || 'Ecuador')}</span></span>
        <span class="km">${x.km < 100 ? x.km + ' km' : ''}</span>
      </button>`).join('')}</div>`;
    const elegir = x => {
      mapa.m.setView([x.lat, x.lng], 17);
      fijarPunto(cual, { lat: x.lat, lng: x.lng }, x.nombre || x.texto);
    };
    $$('#sel-res .gm-row').forEach(b => b.onclick = () => elegir(lista[+b.dataset.i]));
    mapa.marcarSugerencias(lista, elegir);
    if (lista.length > 1) {
      mapa.m.fitBounds(lista.slice(0, 4).map(x => [x.lat, x.lng]),
        { paddingTopLeft: [50, 60], paddingBottomRight: [50, 60], maxZoom: 16 });
    } else {
      mapa.m.setView([lista[0].lat, lista[0].lng], 16);
    }
  };

  let t, ultima = 0;
  const caja_q = $('#sel-q');
  caja_q.oninput = e => {
    clearTimeout(t);
    const q = e.target.value.trim();
    $('#sel-borrar').classList.toggle('hidden', !q);
    if (q.length < 3) { pintarRes(null); return; }
    pintarRes(null, true);
    const mio = ++ultima;
    t = setTimeout(async () => {
      const r = await buscarDirecciones(q);
      if (mio !== ultima) return;
      pintarRes(r);
    }, 320);
  };
  $('#sel-borrar').onclick = () => {
    caja_q.value = ''; $('#sel-borrar').classList.add('hidden');
    pintarRes(null); caja_q.focus();
  };
}

async function fijarPunto(cual, ll, texto) {
  /* Ruta solo opera en Ecuador; la zona con conductores es Quito y sus
     valles, así que fuera de la ciudad se avisa antes de continuar. */
  if (!EN_ECUADOR(ll.lat, ll.lng)) {
    return toast('Ruta solo trabaja dentro de Ecuador. Elige un punto en el país.', 'bad');
  }
  if (!EN_QUITO(ll.lat, ll.lng)) {
    toast('Ese punto está fuera de Quito y sus valles: puede que no haya conductores cerca.');
  }
  if (cual === 'lugar') { cerrarSelector(); return editarLugar(ll, texto); }
  const p = { ...ll, texto };
  if (cual === 'origen') { S.origen = p; mapa.punto('a', p, 'Recogida'); }
  else { S.destino = p; mapa.punto('b', p, 'Destino'); }
  cerrarSelector();

  if (S.origen && S.destino) { S.km = kmRuta(S.origen, S.destino); S.dur = minRuta(S.km); }
  /* El dibujo y el encuadre los hace sincronizarMapa() desde render():
     un solo sitio decide que se ve en el mapa, en vez de repartirlo en
     temporizadores que se pisaban entre si. */
  render();
}

}

function pintarChat() {

    : `<div class="dim" style="padding:6px 0">Escribe si necesitas coordinar algo.</div>`;

function alRecibirMensajes(m) {
  const antes = S.mensajes.length;
  S.mensajes = m;
  const ult = m[m.length - 1];
  if (m.length > antes && ult && ult.emisor_id === 'otro' && !$('#chat-modal')) toast('Mensaje: ' + ult.texto);
  pintarChat();
  if (S.paso === 'viaje') render();
}
async function enviarMsg() {
  const i = $('#msg-modal'); if (!i) return;

  if (!t) return;
  i.value = '';
  await S.api.enviarMensaje(S.solicitud.id, t);
}

/* ============================================================
   Alto de la hoja inferior
   Tres posiciones para que el mapa y el contenido se repartan la
   pantalla según lo que se esté haciendo. Se arrastra el asa, se
   toca para pasar a la siguiente, o se usan las flechas.
   ============================================================ */
const ALTOS = ['compacta', 'media', 'expandida'];
function altoHoja(a) {
  S.alto = ALTOS.includes(a) ? a : 'media';
  guardarLocal('alto', S.alto);
  const sh = $('#sheet');
  sh.classList.toggle('compacta', S.alto === 'compacta');
  sh.classList.toggle('expandida', S.alto === 'expandida');
  const asa = $('#asa');
  const arriba = S.alto === 'expandida';
  asa.setAttribute('aria-expanded', String(arriba));
  asa.setAttribute('aria-label', arriba ? 'Bajar el panel y ver el mapa' : 'Subir el panel y ver todos los detalles');
  const tag = $('#asa .tag');
  if (tag) tag.innerHTML = arriba
    ? IC.abajo('sm') + '<span>Ver el mapa</span>'
    : IC.arriba('sm') + '<span>Ver detalles</span>';
  clearTimeout(altoHoja.t);
  altoHoja.t = setTimeout(() => mapa.reencuadrar(), 300);
}
function armarAsa() {
  const asa = $('#asa');
  asa.innerHTML = '<span class="barra"></span><span class="tag"></span>';
  let y0 = null;
  asa.addEventListener('pointerdown', e => { y0 = e.clientY; try { asa.setPointerCapture(e.pointerId); } catch (x) {} });
  asa.addEventListener('pointerup', e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    /* Arrastrar da las tres alturas; un toque salta directo entre el
       panel abierto del todo y el panel mínimo, que es lo que se hace
       el 90% de las veces. */
    if (dy < -24) altoHoja('expandida');
    else if (dy > 24) altoHoja('compacta');
    else altoHoja(S.alto === 'expandida' ? 'compacta' : 'expandida');
  });
  asa.addEventListener('pointercancel', () => { y0 = null; });
  asa.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp')   { e.preventDefault(); altoHoja('expandida'); }
    if (e.key === 'ArrowDown') { e.preventDefault(); altoHoja('compacta'); }
  });
  altoHoja(S.alto);
}

/* ============================================================
   Lugares guardados
   Casa, Trabajo y cualquier punto al que se va seguido, para no
   volver a escribir la misma dirección cada vez.
   ============================================================ */
const ICONOS_LUGAR = {
  casa: IC.casa('sm'), trabajo: IC.maletin('sm'), estudio: IC.birrete('sm'),
  familia: IC.familia('sm'), gimnasio: IC.pesa('sm'), pin: IC.pin('sm')
};
const NOMBRES_ICONO = { casa: 'Casa', trabajo: 'Trabajo', estudio: 'Estudio', familia: 'Familia', gimnasio: 'Gym', pin: 'Otro' };
const iconoLugar = l => ICONOS_LUGAR[l && l.icono] || ICONOS_LUGAR.pin;
const mismoPunto = (a, b) => haversine(a, b) < .12;

async function cargarLugares() {
  try { S.lugares = await S.api.lugares(); } catch (e) { S.lugares = []; }
}

/* Destinos a los que ya fue, para ofrecerlos sin que los guarde */
async function cargarRecientes() {
  try {
    const h = await S.api.historial();
    S.historial = h;
    const vistos = [];
    S.recientes = h
      .filter(x => x.estado === 'finalizado' && x.destino_texto && x.destino_lat != null)
      .map(x => ({ etiqueta: String(x.destino_texto).split(',')[0], direccion: x.destino_texto, lat: +x.destino_lat, lng: +x.destino_lng, reciente: true }))
      .filter(x => {
        if (vistos.some(v => mismoPunto(v, x))) return false;
        vistos.push(x); return true;
      })
      .slice(0, 4);
  } catch (e) { S.recientes = []; }
}

const sugerencias = () => [
  ...S.lugares,
  ...S.recientes.filter(r => !S.lugares.some(l => mismoPunto(l, r)))
];

/* Fila de accesos rápidos. `alElegir` recibe el lugar tocado. */
function chipsLugares(sel, alElegir, textoAlta) {
  const el = $(sel);
  if (!el) return;
  const lista = sugerencias();
  el.innerHTML =
    lista.map((l, i) => `<button class="chip" data-lg="${i}" title="${esc(l.direccion)}">
        <span class="em">${l.reciente ? IC.reloj('sm') : iconoLugar(l)}</span>
        <span class="tx">${esc(l.etiqueta)}</span></button>`).join('') +
    `<button class="chip add" data-lgmas="1"><span class="em" style="font-size:16px;font-weight:700">+</span>
      <span class="tx">${lista.length ? 'Mis lugares' : (textoAlta || 'Guardar un lugar')}</span></button>`;
  el.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => {
    const l = lista[+b.dataset.lg];
    if (l.id) S.api.usarLugar(l.id);
    alElegir(l);
  });
  el.querySelector('[data-lgmas]').onclick = () => modalLugares();
}

function modalLugares() {
  const l = S.lugares;
  modal(`<div class="grip"></div>
    <div class="head"><div class="grow"><h2>Mis lugares</h2>
      <div class="dim">Los puntos guardados aparecen como atajos al pedir un viaje</div></div>
      <button class="back" id="lu-x" aria-label="Cerrar">✕</button></div>
    ${l.length ? `<div class="card" style="padding:2px 14px">${l.map((x, i) => `
      <button class="rowbtn" data-ed="${i}">
        <div class="ico">${iconoLugar(x)}</div>
        <div class="grow"><div class="t">${esc(x.etiqueta)}</div><div class="s">${esc(x.direccion)}</div></div>
        <div class="fin">›</div></button>`).join('')}</div>`
      : `<div class="empty"><div class="big">${IC.pin()}</div>Todavía no guardas ningún lugar. Guarda tu casa y tu trabajo y los pides con un toque.</div>`}
    <button class="btn primary full" id="lu-add" style="margin-top:12px">Agregar un lugar</button>`);
  $('#lu-x').onclick = cerrarModal;
  $('#lu-add').onclick = () => { cerrarModal(); abrirSelector('lugar'); };
  $$('#modal [data-ed]').forEach(b => b.onclick = () => {
    const x = l[+b.dataset.ed];
    cerrarModal();
    editarLugar({ lat: x.lat, lng: x.lng }, x.direccion, x);
  });
}

function editarLugar(ll, texto, existente) {
  const x = existente || {};
  modal(`<div class="grip"></div>
    <h2>${existente ? 'Editar lugar' : 'Guardar este lugar'}</h2>
    <p class="dim" style="margin:6px 0 14px">${esc(texto || x.direccion || '')}</p>
    <div class="field"><label for="lg-nom">¿Cómo lo llamas?</label>
      <input id="lg-nom" class="input" maxlength="28" placeholder="Casa, Trabajo, Casa de mi mamá" value="${esc(x.etiqueta || '')}"></div>
    <label class="dim" style="font-size:12px;display:block;margin-bottom:6px">Icono</label>
    <div class="chips" id="lg-ic" style="margin:0 0 6px;padding:0">${Object.keys(ICONOS_LUGAR).map(k =>
      `<button class="chip ${(x.icono || 'pin') === k ? 'on' : ''}" data-ic="${k}">
        <span class="em">${ICONOS_LUGAR[k]}</span><span class="tx">${NOMBRES_ICONO[k]}</span></button>`).join('')}</div>
    <button class="btn primary full" id="lg-ok" style="margin-top:12px">Guardar</button>
    ${existente ? `<button class="btn danger full" id="lg-del">Eliminar este lugar</button>` : ''}
    <button class="btn ghost full" id="lg-x">Cancelar</button>`);
  let icono = x.icono || 'pin';
  $$('#lg-ic [data-ic]').forEach(b => b.onclick = () => {
    icono = b.dataset.ic;
    $$('#lg-ic [data-ic]').forEach(o => o.classList.toggle('on', o === b));
  });
  $('#lg-x').onclick = cerrarModal;
  const del = $('#lg-del');
  if (del) del.onclick = async () => {
    if (!await confirmar('Eliminar lugar', `Se quitará "${x.etiqueta}" de tus atajos.`, 'Eliminar')) return;
    try { await S.api.borrarLugar(x.id); await cargarLugares(); toast('Lugar eliminado'); cerrarModal(); render(); }
    catch (e) { toast(e.message, 'bad'); }
  };
  $('#lg-ok').onclick = async () => {
    const etiqueta = $('#lg-nom').value.trim();
    if (etiqueta.length < 2) return toast('Ponle un nombre al lugar', 'bad');
    const datos = {
      etiqueta, icono,
      direccion: texto || x.direccion,
      lat: (ll && ll.lat) != null ? ll.lat : x.lat,
      lng: (ll && ll.lng) != null ? ll.lng : x.lng
    };
    const btn = $('#lg-ok'); btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      await S.api.guardarLugar(datos, x.id);
      await cargarLugares();
      cerrarModal(); toast('Lugar guardado'); render();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Guardar';
      toast(e.code === '23505' ? 'Ya tienes un lugar con ese nombre' : (e.message || 'No se pudo guardar'), 'bad');
    }
  };
}

/* ============================================================
   Soporte
   Un ticket por consulta, con su chat. Todo queda en Supabase,
   así que la conversación sigue ahí aunque se cambie de teléfono.
   ============================================================ */
const CATS = {
  viaje:     { em: IC.ruta('sm'),     t: 'Viaje o envío',    s: 'Algo pasó durante el servicio' },
  pago:      { em: IC.billete('sm'),  t: 'Cobros y precios', s: 'El monto no cuadra' },
  cuenta:    { em: IC.personas('sm'), t: 'Mi cuenta',        s: 'Datos, acceso o PIN' },
  vehiculo:  { em: IC.carro('sm'),    t: 'Vehículo',         s: 'Aprobación o cambio' },
  seguridad: { em: IC.escudo('sm'),   t: 'Seguridad',        s: 'Conducta o incidente' },
  otro:      { em: IC.chat('sm'), t: 'Otra cosa',  s: 'Cualquier otro tema' }
};
const ESTADOS_TK = {
  abierto:    ['warn', 'Abierto'],
  en_proceso: ['',     'En proceso'],
  resuelto:   ['ok',   'Resuelto'],
  cerrado:    ['',     'Cerrado']
};
const FAQ = [
  ['¿Cómo se calcula el precio?',
   'En los viajes tú propones el precio y el conductor lo acepta o te contraoferta. En los envíos la tarifa es fija y depende de la distancia, del tamaño del paquete y de qué tan rápido lo necesitas.'],
  ['Me sale "cuenta en revisión"',
   'A los conductores y a sus vehículos los habilita un administrador antes de poder recibir solicitudes. Si ya pasaron varias horas, ábrenos un caso con tu placa y lo revisamos.'],
  ['Olvidé mi PIN',
   'En la pantalla de ingreso toca "Olvidé mi PIN". Te llega un correo para poner uno nuevo.'],
  ['¿Cómo se paga?',
   'Todo es en efectivo, directo al conductor al terminar el servicio. Ruta nunca te cobra por adelantado ni pide datos de tarjeta.'],
  ['Dejé algo olvidado en el carro',
   'Abre un caso en "Viaje o envío" con la fecha y el destino. Contactamos al conductor por ti.'],
  ['¿Puedo cancelar?',
   'Sí, mientras el viaje no haya empezado. Cancelar muy seguido puede afectar tu calificación.']
];

function limpiarSupSubs() {
  S.supSubs.forEach(f => { try { f(); } catch (e) {} });
  S.supSubs = [];
}
function sinLeerDe(t) {
  return +(S.esSoporte && S.bandeja === 'todos' ? t.sin_leer_agente : t.sin_leer_usuario) || 0;
}
function pintarBadgeSoporte() {
  const b = $('#nav-sop');
  if (!b) return;
  b.textContent = S.sinLeerSop > 9 ? '9+' : String(S.sinLeerSop);
  b.classList.toggle('hidden', !S.sinLeerSop);
}

/* Escucha permanente: mantiene el contador del menú al día y avisa
   cuando soporte responde, aunque la app esté en segundo plano. */
function escucharSoporte() {
  if (S.subSop) { try { S.subSop(); } catch (e) {} S.subSop = null; }
  S.subSop = S.api.onTickets(S.esSoporte, lista => {
    const antes = S.sinLeerSop;
    S.tickets = lista;
    S.sinLeerSop = lista.reduce((a, t) =>
      a + (+(S.esSoporte ? t.sin_leer_agente : t.sin_leer_usuario) || 0), 0);
    pintarBadgeSoporte();
    if (S.sinLeerSop > antes && !S.ticket) {
      const t = lista.find(x => +(S.esSoporte ? x.sin_leer_agente : x.sin_leer_usuario) > 0);
      if (t) {
        toast('Soporte: ' + (t.ultimo_texto || 'tienes una respuesta'));
        avisar('Soporte de Ruta', t.ultimo_texto || 'Tienes una respuesta nueva');
      }
    }
    if (S.vista === 'ayuda') render();
  });
}

function tarjetaTicket(t, i, conNombre) {
  const sin = sinLeerDe(t);
  const es = ESTADOS_TK[t.estado] || ESTADOS_TK.abierto;
  const c = CATS[t.categoria] || CATS.otro;
  return `<button class="tk" data-tk="${i}">
    <div class="ico">${c.em}</div>
    <div class="grow">
      <div class="t">${esc(t.asunto)}</div>
      <div class="s">${conNombre ? esc(t.usuario_nombre) + ' · ' : ''}${esc(t.ultimo_texto || 'Sin mensajes')}</div>
      <div class="meta"><span class="badge ${es[0]}">${es[1]}</span>
        <span class="dim">${hace(t.actualizado_en)}</span>
        ${t.rol === 'conductor' ? '<span class="badge">Conductor</span>' : ''}</div>
    </div>
    ${sin ? `<span class="badge solid">${sin}</span>` : ''}
  </button>`;
}

function pintarAyuda(sh) {
  const agente = S.esSoporte;
  const bandejaAgente = agente && S.bandeja === 'todos';
  const todos = S.tickets || [];
  const lista = bandejaAgente ? todos : todos.filter(t => t.usuario_id === S.user.id);
  const cargando = S.tickets === null;

  sh.innerHTML = `
    <div class="head"><div class="grow"><h2>Ayuda y soporte</h2>
      <div class="dim">${agente ? 'Tienes permisos de agente' : 'Escríbenos y te respondemos por chat'}</div></div></div>
    ${agente ? `<div class="segmented small" id="ay-tabs" style="margin-bottom:12px">
        <button data-b="mios" class="${S.bandeja === 'mios' ? 'on' : ''}">Mis casos</button>
        <button data-b="todos" class="${S.bandeja === 'todos' ? 'on' : ''}">Bandeja · ${todos.length}</button>
      </div>` : ''}
    ${bandejaAgente ? '' : `<button class="btn primary full" id="ay-nuevo">Abrir un caso nuevo</button>`}
    ${cargando
      ? `<div class="card" style="margin-top:12px">${[1, 2].map(() =>
          `<div class="skel-row"><div class="c skel"></div><div class="grow" style="flex:1">
            <div class="l skel" style="width:70%"></div><div class="l skel" style="width:45%;margin-top:7px"></div></div></div>`).join('')}</div>`
      : lista.length
        ? `<div class="card" style="margin-top:12px;padding:2px 14px">${lista.map((t, i) => tarjetaTicket(t, i, bandejaAgente)).join('')}</div>`
        : `<div class="empty"><div class="big">${IC.chat()}</div>${bandejaAgente ? 'No hay casos en la bandeja.' : 'No tienes casos abiertos. Si algo sale mal, escríbenos: te respondemos aquí mismo.'}</div>`}
    ${bandejaAgente ? '' : `
      <div class="sec"><h3>Preguntas frecuentes</h3></div>
      <div class="card" style="padding:2px 14px">${FAQ.map(([p, r]) =>
        `<details class="faq"><summary>${esc(p)}</summary><p>${esc(r)}</p></details>`).join('')}</div>
      <div class="card" style="margin-top:10px;display:flex;gap:12px;align-items:center">
        <div class="icocaja">${IC.escudo()}</div>
        <div class="grow"><div style="font-weight:600">¿Es una emergencia?</div>
          <div class="dim">Si estás en peligro llama primero al 911</div></div>
        <a class="btn sm danger" href="tel:911">911</a>
      </div>`}`;

  const tabs = $('#ay-tabs');
  if (tabs) $$('#ay-tabs button').forEach(b => b.onclick = () => { S.bandeja = b.dataset.b; render(); });
  const nuevo = $('#ay-nuevo');
  if (nuevo) nuevo.onclick = () => modalNuevoTicket();
  $$('#sheetbody [data-tk]').forEach(b => b.onclick = () => abrirTicket(lista[+b.dataset.tk]));
}

function modalNuevoTicket(solicitud) {
  let cat = solicitud ? 'viaje' : 'otro';
  modal(`<div class="grip"></div>
    <div class="head"><div class="grow"><h2>Escribir a soporte</h2>
      <div class="dim">Te respondemos por chat, dentro de la app</div></div>
      <button class="back" id="nt-x" aria-label="Cerrar">✕</button></div>
    <div class="sopcats" id="nt-cats">${Object.keys(CATS).map(k =>
      `<button class="sopcat ${cat === k ? 'on' : ''}" data-cat="${k}">
        <span class="em">${CATS[k].em}</span><span class="t">${CATS[k].t}</span><span class="s">${CATS[k].s}</span></button>`).join('')}</div>
    <div class="field" style="margin-top:14px"><label for="nt-as">Asunto</label>
      <input id="nt-as" class="input" maxlength="80" placeholder="Resume tu caso en una línea"></div>
    <div class="field"><label for="nt-tx">Cuéntanos qué pasó</label>
      <textarea id="nt-tx" class="input" style="min-height:92px" placeholder="Mientras más detalles nos des, más rápido te ayudamos"></textarea></div>
    ${solicitud ? `<div class="aviso" style="margin-bottom:12px">Se adjunta el servicio del ${new Date(solicitud.creado_en).toLocaleDateString('es-EC', { day: '2-digit', month: 'short' })} hacia ${esc(solicitud.destino_texto || '—')}.</div>` : ''}
    <button class="btn primary full" id="nt-ok">Abrir el caso</button>`);
  $('#nt-x').onclick = cerrarModal;
  $$('#nt-cats [data-cat]').forEach(b => b.onclick = () => {
    cat = b.dataset.cat;
    $$('#nt-cats [data-cat]').forEach(o => o.classList.toggle('on', o === b));
  });
  $('#nt-ok').onclick = async () => {
    const asunto = $('#nt-as').value.trim();
    const texto = $('#nt-tx').value.trim();
    if (asunto.length < 4) return toast('Escribe un asunto', 'bad');
    if (texto.length < 8) return toast('Cuéntanos un poco más para poder ayudarte', 'bad');
    const btn = $('#nt-ok'); btn.disabled = true; btn.textContent = 'Abriendo...';
    try {
      const t = await S.api.abrirTicket({
        categoria: cat, asunto, rol: S.modo,
        solicitud_id: solicitud ? solicitud.id : null
      });
      await S.api.enviarSoporte(t.id, texto);
      cerrarModal();
      toast('Caso abierto, te respondemos por aquí');
      abrirTicket({ ...t, ultimo_texto: texto, sin_leer_usuario: 0, sin_leer_agente: 0 });
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Abrir el caso';
      toast(e.message || 'No se pudo abrir el caso', 'bad');
    }
  };
}

function abrirTicket(t) {
  S.ticket = t;
  S.supMsgs = [];
  const agente = S.esSoporte && t.usuario_id !== S.user.id;
  const c = CATS[t.categoria] || CATS.otro;
  const rapidas = agente
    ? ['Ya lo estoy revisando', '¿Me confirmas la placa?', 'Listo, quedó resuelto']
    : ['¿Cómo va mi caso?', 'Gracias', 'Sigo con el problema'];

  modal(`<div class="grip"></div>
    <div class="head">
      <div class="icocaja">${c.em}</div>
      <div class="grow" style="margin-left:10px;min-width:0">
        <h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.asunto)}</h3>
        <div class="dim">${agente ? esc(t.usuario_nombre || 'Usuario') + ' · ' : ''}${(ESTADOS_TK[t.estado] || ESTADOS_TK.abierto)[1]}</div>
      </div>
      <button class="back" id="sp-x" aria-label="Cerrar">✕</button>
    </div>
    ${agente && t.usuario_tel ? `<a class="btn sm suave full" href="tel:${esc(t.usuario_tel)}" style="margin-bottom:10px">Llamar a ${esc((t.usuario_nombre || '').split(' ')[0])}</a>` : ''}
    <div class="chat alto" id="sup-chat"><div class="wait"><div class="spin"></div><span class="dim">Cargando la conversación...</span></div></div>
    <div class="chatbar"><input id="sup-in" class="input" placeholder="Escribe tu mensaje" autocomplete="off">
      <button class="btn sm primary" id="sup-ok">Enviar</button></div>
    <div class="navs" style="margin-top:10px">${rapidas.map(x =>
      `<button class="chipnav" data-rap="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      ${agente
        ? `<button class="btn sm" id="sp-proc">En proceso</button><button class="btn sm suave" id="sp-res">Marcar resuelto</button>`
        : (t.estado === 'resuelto' || t.estado === 'cerrado'
            ? `<button class="btn sm" disabled>Caso ${(ESTADOS_TK[t.estado] || [])[1] || ''}</button>`
            : `<button class="btn sm" id="sp-res">Ya lo resolví</button>`)}
    </div>`);

  const enviar = async () => {
    const i = $('#sup-in'); if (!i) return;
    const txt = i.value.trim();
    if (!txt) return;
    i.value = '';
    try { await S.api.enviarSoporte(t.id, txt); }
    catch (e) { toast(e.message || 'No se pudo enviar', 'bad'); i.value = txt; }
  };
  $('#sp-x').onclick = cerrarModal;
  $('#sup-ok').onclick = enviar;
  $('#sup-in').onkeydown = e => { if (e.key === 'Enter') enviar(); };
  $$('#modal [data-rap]').forEach(b => b.onclick = () => S.api.enviarSoporte(t.id, b.dataset.rap).catch(() => {}));
  const proc = $('#sp-proc');
  if (proc) proc.onclick = async () => {
    try { await S.api.estadoTicket(t.id, 'en_proceso'); toast('Marcado en proceso'); } catch (e) { toast(e.message, 'bad'); }
  };
  const res = $('#sp-res');
  if (res) res.onclick = async () => {
    try { await S.api.estadoTicket(t.id, 'resuelto'); toast('Caso marcado como resuelto'); cerrarModal(); render(); }
    catch (e) { toast(e.message, 'bad'); }
  };

  limpiarSupSubs();
  S.supSubs.push(S.api.onSoporte(t.id, ms => {
    const nuevos = ms.length > S.supMsgs.length;
    S.supMsgs = ms;
    pintarSupChat();
    if (nuevos) S.api.marcarLeidos(t.id, agente).catch(() => {});
  }));
}

function pintarSupChat() {
  const c = $('#sup-chat');
  if (!c) return;
  if (!S.supMsgs.length) {
    c.innerHTML = `<div class="dim" style="padding:8px 0">Escribe tu consulta y te respondemos por aquí.</div>`;
    return;
  }
  c.innerHTML = S.supMsgs.map(m => {
    const mio = m.emisor_id && m.emisor_id === S.user.id;
    const clase = m.autor === 'sistema' ? 'sis' : (mio ? 'mine' : '');
    const quien = m.autor === 'sistema' ? '' : (mio ? '' : (m.autor === 'soporte' ? 'Soporte Ruta' : 'Usuario'));
    return `<div class="msg ${clase}">${quien ? `<span class="quien">${quien}</span>` : ''}${esc(m.texto)}<span class="hora">${horaCorta(m.creado_en)}</span></div>`;
  }).join('');
  c.scrollTop = c.scrollHeight;
}

/* ============================================================
   Seguimiento en vivo
   El conductor publica su posición mientras tiene un servicio y
   el pasajero ve el carro moverse en el mapa con su tiempo estimado.
   ============================================================ */
let alMoverse = [];
function seguirMiGps(on) {
  if (!on) {
    if (S.watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(S.watchId);
    S.watchId = null;
    alMoverse = [];
    return;
  }
  if (S.watchId != null || !navigator.geolocation) return;
  let ultimo = 0;
  S.watchId = navigator.geolocation.watchPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    mapa.yo(S.pos);
    alMoverse.forEach(f => { try { f(S.pos); } catch (e) {} });
    const ahora = Date.now();
    if (ahora - ultimo > 8000) { ultimo = ahora; S.api.publicarPos(S.pos).catch(() => {}); }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 5000 });
}

function seguirConductor(s) {
  if (S.modo !== 'pasajero' || !s.conductor_id) return;
  if (S.subPos) { try { S.subPos(); } catch (e) {} S.subPos = null; }
  S.subPos = S.api.onPosConductor(s.conductor_id, p => {
    const antes = S.posConductor;
    S.posConductor = p;
    if (antes && (antes.lat !== p.lat || antes.lng !== p.lng)) mapa.mover(antes, p, 1400);
    else mapa.conductor(p);
    pintarEta();
  });
}
function pintarEta() {
  const el = $('#eta');
  const s = S.solicitud;
  if (!el || !s || !S.posConductor) return;
  const meta = s.estado === 'a_bordo'
    ? { lat: +s.destino_lat, lng: +s.destino_lng }
    : { lat: +s.origen_lat, lng: +s.origen_lng };
  const km = kmRuta(S.posConductor, meta);
  el.textContent = km < .2
    ? (s.estado === 'a_bordo' ? 'Están llegando al destino' : 'Tu conductor ya está afuera')
    : `A ${km} km · unos ${minRuta(km)} min`;
}

/* ============================================================
   Cancelaciones con motivo
   ============================================================ */
const MOTIVOS = {
  pasajero: ['Ya no lo necesito', 'El conductor demora mucho', 'Me equivoqué de dirección', 'Conseguí otro transporte', 'Otro motivo'],
  conductor: ['Estoy demasiado lejos', 'El pasajero no aparece', 'Problema con el vehículo', 'La dirección está mal', 'Otro motivo']
};
function pedirMotivo() {
  const lista = MOTIVOS[S.modo] || MOTIVOS.pasajero;
  return new Promise(res => {
    modal(`<div class="grip"></div>
      <h2>¿Por qué cancelas?</h2>
      <p class="dim" style="margin:6px 0 14px">Nos sirve para mejorar el servicio. Cancelar muy seguido puede afectar tu calificación.</p>
      <div class="card" style="padding:2px 14px">${lista.map((x, i) =>
        `<button class="rowbtn" data-m="${i}"><div class="grow"><div class="t">${esc(x)}</div></div><div class="fin">›</div></button>`).join('')}</div>
      <button class="btn ghost full" id="mo-x" style="margin-top:10px">Mejor sigo esperando</button>`);
    alCerrarModal = () => res(null);
    $$('#modal [data-m]').forEach(b => b.onclick = () => { res(lista[+b.dataset.m]); cerrarModal(); });
    $('#mo-x').onclick = () => { res(null); cerrarModal(); };
  });
}
async function cancelarCon(s) {
  const motivo = await pedirMotivo();
  if (!motivo) return false;
  try { await S.api.cancelarSolicitud(s.id, motivo); }
  catch (e) { toast(e.message || 'No se pudo cancelar', 'bad'); return false; }
  return true;
}

        </button>`;

      <p class="fine" style="margin-top:10px">Mientras más tiempo le des al conductor, más barato: 20% menos dentro de una hora y 40% menos dentro de cinco.</p>`;
    $$('#sheet [data-urg]').forEach(b => b.onclick = () => { S.urgencia = b.dataset.urg; irA('datos'); });

    const t = tarifa(S.km, 'paquete', { tamano: S.tamano, urgencia: S.urgencia });

async function publicar() {
  const t = tarifa(S.km, S.tipo, { tamano: S.tamano, urgencia: S.urgencia });
  const d = {
    tipo: S.tipo,
    urgencia: S.tipo === 'paquete' ? S.urgencia : null,
    tamano: S.tipo === 'paquete' ? S.tamano : null,
    descripcion: S.tipo === 'paquete' ? S.descripcion : null,
    destinatario: S.tipo === 'paquete' ? S.destinatario : null,
    destinatario_tel: S.tipo === 'paquete' ? S.destTel : null,
    pasajeros: S.tipo === 'viaje' ? S.pasajeros : null,
    notas: S.notas || null,
    origen_lat: S.origen.lat, origen_lng: S.origen.lng, origen_texto: S.origen.texto,
    destino_lat: S.destino.lat, destino_lng: S.destino.lng, destino_texto: S.destino.texto,
    distancia_km: S.km, duracion_min: S.dur,
    auto_asignar: S.tipo === 'paquete' ? true : S.auto,
    precio_sugerido: t.final,
    precio_ofrecido: S.tipo === 'paquete' ? t.final : S.precio,
    estado: 'buscando'
  };
  const btn = $('#p-publicar');
  if (btn) { btn.disabled = true; btn.textContent = 'Publicando...'; }
  try {
    S.solicitud = await S.api.crearSolicitud(d);
    S.paso = 'esperando';
    seguirSolicitud();
    render();
  } catch (e) {
    toast(e.message || 'No se pudo publicar', 'bad');
    if (btn) { btn.disabled = false; btn.textContent = 'Reintentar'; }
  }
}

function seguirSolicitud() {
  limpiarSubs();
  S.subs.push(S.api.onOfertas(S.solicitud.id, async lista => {
    const antes = S.ofertas.length;
    S.ofertas = lista;
    if (lista.length > antes && S.paso === 'esperando' && !S.solicitud.auto_asignar) {
      const o = lista[0];
      avisar('Tienes una oferta', `${o.conductor_nombre || 'Un conductor'} pide ${money(o.precio)}`);
    }
    const auto = S.solicitud.tipo === 'paquete' || S.solicitud.auto_asignar;
    if (auto && S.paso === 'esperando') {
      const primera = lista.find(o => +o.precio <= +S.solicitud.precio_ofrecido);
      if (primera) {
        try {
          const sol = await S.api.aceptarOferta(primera);
          if (sol) {
            S.solicitud = { ...S.solicitud, ...sol };
            S.paso = 'viaje';
            dibujarViaje(S.solicitud);
            S.subs.push(S.api.onMensajes(S.solicitud.id, alRecibirMensajes));
            toast(`${(primera.conductor_nombre || 'Un conductor').split(' ')[0]} tomó tu ${S.solicitud.tipo === 'paquete' ? 'envío' : 'viaje'}`);
          }
        } catch (e) { /* otro conductor se adelantó o ya está asignada */ }
      }
    }
    if (S.paso === 'esperando') render();
  }));
  S.subs.push(S.api.onSolicitud(S.solicitud.id, sol => {
    S.solicitud = { ...S.solicitud, ...sol };
    if (['aceptado', 'en_camino', 'a_bordo'].includes(sol.estado) && S.paso !== 'viaje') {
      S.paso = 'viaje';
      dibujarViaje(S.solicitud);
      S.subs.push(S.api.onMensajes(sol.id, alRecibirMensajes));
    }
    if (sol.estado === 'finalizado') S.paso = 'calificar';
    if (sol.estado === 'cancelado' && S.paso !== 'calificar') { toast('La solicitud se canceló', 'bad'); resetViaje(); mapa.limpiar(); ubicarme(); }
    render();
  }));
}

function pasoEsperando(sh) {
  const s = S.solicitud;
  const fijo = s.tipo === 'paquete';
  const ofs = S.ofertas.map(o => `
    <div class="card">
      <div class="offer">
        <div class="avatar">${iniciales(o.conductor_nombre)}</div>

          <div class="s">${esc(o.vehiculo_texto || 'Vehículo registrado')} · llega en ${o.eta_min || '—'} min</div>
        </div>
        <div class="price">${money(o.precio)}<small>${fijo ? 'precio fijo' : (o.precio > s.precio_ofrecido ? 'contraoferta' : 'tu precio')}</small></div>
      </div>
      <button class="btn primary full sm" data-of="${o.id}" style="margin-top:10px">${fijo ? 'Enviar con' : 'Viajar con'} ${esc((o.conductor_nombre || '').split(' ')[0])}</button>
    </div>`).join('');
  sh.innerHTML = `
    <div class="wait"><div class="spin"></div>

      <div class="dim">${fijo || s.auto_asignar
        ? 'Se asigna al primer conductor que acepte' + (fijo ? ' el precio fijo de ' + money(s.precio_ofrecido) : '')
        : (S.ofertas.length ? S.ofertas.length + ' oferta(s) recibida(s)' : 'Avisando a los conductores cercanos')}</div></div>
    </div>
    <div class="bar"><i></i></div>
    <div style="margin-top:14px">${ofs || `<div class="empty"><div class="big">${IC.reloj()}</div>${fijo ? 'Aún nadie lo toma. Si demora, prueba con una franja de entrega más amplia.' : 'Aún nadie responde. Si demora, sube un poco tu precio.'}</div>`}</div>
    <button class="btn danger full" id="p-cancelar" style="margin-top:6px">Cancelar solicitud</button>`;
  $$('#sheet [data-of]').forEach(b => b.onclick = async () => {
    const of = S.ofertas.find(o => o.id === b.dataset.of);
    b.disabled = true; b.textContent = 'Confirmando...';
    try {
      const sol = await S.api.aceptarOferta(of);
      S.solicitud = { ...S.solicitud, ...sol };
      S.paso = 'viaje';
      dibujarViaje(S.solicitud);
      S.subs.push(S.api.onMensajes(S.solicitud.id, alRecibirMensajes));
      render();
    } catch (e) {
      toast(RLS(e) ? 'Esa oferta ya no está disponible' : explicarError(e, 'aceptarOferta'), 'bad');
      render();
    }
  });
  $('#p-cancelar').onclick = async () => {
    /* Todavía no hay conductor asignado: no vale la pena pedir motivo */
    try { await S.api.cancelarSolicitud(S.solicitud.id, 'Cancelada durante la búsqueda'); } catch (e) {}
    resetViaje(); mapa.limpiar(); ubicarme(); render();
  };
}

const ETIQUETAS = {
  aceptado:   s => ['Conductor asignado', s.tipo === 'paquete' ? 'Va por tu paquete' : 'Se dirige a recogerte'],
  en_camino:  s => ['En camino', 'Puedes seguirlo en el mapa'],
  a_bordo:    s => [s.tipo === 'paquete' ? 'Paquete a bordo' : 'Viaje en curso', 'Rumbo al destino'],
  finalizado: s => ['Finalizado', 'Gracias por viajar con Ruta']
};

/* Comparte los datos del viaje por WhatsApp o donde el teléfono ofrezca.
   Es lo que pide cualquiera antes de subirse a un carro de noche. */
function compartirViaje(s) {
  const txt =
    `Voy en Ruta con ${s.conductor_nombre || 'un conductor'}` +
    (s.placa ? ` (placa ${s.placa}${s.vehiculo_texto ? ', ' + s.vehiculo_texto : ''})` : '') + '.\n' +
    `Salgo de: ${s.origen_texto}\nVoy a: ${s.destino_texto}\n` +
    `Punto de recogida: https://www.google.com/maps?q=${s.origen_lat},${s.origen_lng}\n` +
    `Destino: https://www.google.com/maps?q=${s.destino_lat},${s.destino_lng}`;
  if (navigator.share) { navigator.share({ title: 'Mi viaje en Ruta', text: txt }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(txt); toast('Datos del viaje copiados, pégalos en tu chat'); }
  catch (e) { toast('Tu navegador no permite compartir desde aquí', 'bad'); }
}

function pasoCalificar(sh) {

/* ---------- conductor ---------- */
function pintarConductor(sh) {
  if (S.solicitud && !['finalizado', 'cancelado'].includes(S.solicitud.estado)) {
    S.paso = 'viaje';
    return viajeConductor(sh);
  }
  if (S.paso === 'calificar') return pasoCalificar(sh);
  return pasoSolicitudes(sh);
}

/* Tarjeta que ve el conductor.
   Cada dato aparece una sola vez. Antes el numero de pasajeros salia de
   distintivo y otra vez de chip, la urgencia igual, y el precio traia un
   "$0.31 por km recorrido" que repetia el mismo numero de otra forma: tres
   lineas para decir lo que cabe en una. Ahora la cabecera es una sola fila
   -quien pide, como paga, cuanto- y debajo solo van los datos que no caben
   ahi (que contiene, notas, a quien se entrega), que ademas se esconden con
   el panel bajo para que el mapa se lleve la pantalla.
   Las direcciones escritas siguen fuera a proposito: van rotuladas en el
   mapa, que es donde el conductor las mira. */
function tarjetaSolicitudDidi(s, idx, total) {
  const A = { lat: +s.origen_lat, lng: +s.origen_lng };
  const B = { lat: +s.destino_lat, lng: +s.destino_lng };
  const distYo = kmRuta(S.pos, A);
  const etaYo = minRuta(distYo);
  const distViaje = +s.distancia_km || kmRuta(A, B);
  const durViaje = +s.duracion_min || minRuta(distViaje);
  const esperando = S.ofertaEnviada && S.ofertaEnviada.solicitud_id === s.id;
  const esEnvio = s.tipo === 'paquete';
  const precio = +s.precio_ofrecido || 0;
  const totalKm = +(distYo + distViaje).toFixed(2);
  const porKm = totalKm > 0 ? (precio / totalKm) : 0;
  const viajes = s.pasajero_viajes != null ? s.pasajero_viajes : null;
  const urg = esEnvio ? (URGENCIAS[s.urgencia] || null) : null;

  /* Fila de cabecera: lo que decide si se toma la carrera. */
  const meta = [
    `<span class="chipdato acento">${IC.billete('sm')}Efectivo</span>`,
    esEnvio
      ? (s.tamano ? `<span class="chipdato">${IC.caja('sm')}${(TAMANOS[s.tamano] || {}).t || ''}</span>` : '')
      : (s.pasajeros ? `<span class="chipdato">${IC.personas('sm')}${s.pasajeros} pasajero${s.pasajeros > 1 ? 's' : ''}</span>` : ''),
    urg ? `<span class="chipdato ${s.urgencia === 'urgente' ? 'urge' : ''}">${IC.reloj('sm')}${urg.t}</span>` : ''
  ].filter(Boolean).join('');

  /* Lo que no cabe arriba. Solo se ve con el panel a media altura. */
  const extras = [
    esEnvio && s.descripcion ? `<span class="chipdato">${IC.sobre('sm')}${esc(s.descripcion)}</span>` : '',
    esEnvio && s.destinatario ? `<span class="chipdato">${IC.pin('sm')}Entregar a ${esc(s.destinatario)}</span>` : '',
    s.notas ? `<span class="chipdato">${IC.nota('sm')}${esc(s.notas)}</span>` : '',
    porKm ? `<span class="chipdato">${IC.ruta('sm')}${money(porKm)} por km · ${totalKm} km en total</span>` : ''
  ].filter(Boolean).join('');

  return `
    <div class="didi-card" id="didi-sol-card">
      <div class="didi-nav-bar">
        ${total > 1
          ? `<button class="didi-nav-btn" id="didi-prev" ${idx <= 0 ? 'disabled' : ''} aria-label="Anterior">${IC.atras('sm')}</button>
             <div class="didi-counter">Carrera ${idx + 1} de ${total}</div>
             <button class="didi-nav-btn" id="didi-next" ${idx >= total - 1 ? 'disabled' : ''} aria-label="Siguiente" style="transform:scaleX(-1)">${IC.atras('sm')}</button>`
          : `<div class="didi-counter solo">${esEnvio ? 'Un envío cerca' : 'Una carrera cerca'}</div>`}
      </div>

      <div class="didi-top">
        <div class="didi-quien">
          <div class="didi-pax-avatar">${iniciales(s.pasajero_nombre || 'P')}</div>
          <div style="min-width:0">
            <div class="nom">${esc(s.pasajero_nombre || 'Pasajero')}</div>
            <div class="dim" style="font-size:12px;display:flex;align-items:center;gap:4px">
              <span class="estrella">${IC.estrella('sm')}</span>${(+s.pasajero_calificacion || 5).toFixed(1)}
              ${viajes != null ? ` · ${viajes} viaje${viajes === 1 ? '' : 's'}` : ''}
            </div>
          </div>
        </div>
        <div class="didi-meta">${meta}</div>
        <div class="didi-plata">
          <div class="didi-price">${money(precio)}</div>
          <div class="didi-tags">
            <span class="badge solid">${esEnvio ? IC.caja('sm') : IC.carro('sm')}${esEnvio ? 'Envío' : 'Viaje'}</span>
          </div>
        </div>
      </div>

      <div class="tira">
        <div class="t1"><span class="marca a"></span>
          <span><span class="et">Ir a recoger</span><br><span class="vl">${etaYo} min · ${distYo} km</span></span></div>
        <div class="t1"><span class="marca b"></span>
          <span><span class="et">${esEnvio ? 'Llevar el paquete' : 'Llevar al pasajero'}</span><br><span class="vl">${durViaje} min · ${distViaje} km</span></span></div>
      </div>

      ${esperando
        ? `<div class="wait" style="margin-top:12px"><div class="spin"></div><div class="dim">Ofertaste ${money(S.ofertaEnviada.precio)}, esperando respuesta</div></div>`
        : `<div class="didi-acciones">
            <button class="btn primary full" data-ok="${s.id}">
              ${esEnvio ? 'Tomar el envío por ' + money(precio) : 'Aceptar por ' + money(precio)}
            </button>
            ${!esEnvio ? `<button class="btn suave full oculta-compacta" data-otro="${s.id}">Pedir otro precio</button>` : ''}
           </div>`}

      ${total > 1 ? `
        <div class="didi-puntos">
          ${Array.from({ length: total }).map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}
        </div>` : ''}
    </div>
  `;
}

function tarjetaSolicitud(s) {
  return tarjetaSolicitudDidi(s, 0, 1);
}

function pasoSolicitudes(sh) {
  if (S.solicitud && !['finalizado', 'cancelado'].includes(S.solicitud.estado)) {
    S.paso = 'viaje';
    return viajeConductor(sh);
  }
  const hab = estadoConductor();
  if (!hab.ok) {
    mapa.limpiarDidi();
    sh.innerHTML = `
      <div class="empty"><div class="big">${IC.reloj()}</div>
        <h3 style="margin-bottom:6px;color:var(--text)">Cuenta en revisión</h3>
        <p class="dim">${esc(hab.motivo)}</p></div>
      ${hab.sinVehiculo ? `<button class="btn primary full" id="c-veh">Registrar mi vehículo</button>` : ''}
      <button class="btn full" id="c-recargar" style="margin-top:${hab.sinVehiculo ? '10px' : '0'}">Ya me habilitaron, revisar</button>`;
    const bv = $('#c-veh'); if (bv) bv.onclick = modalVehiculo;
    $('#c-recargar').onclick = async () => { await cargarPerfil(); pintarTop(); render(); };
    return;
  }
  if (!S.enLinea) {
    mapa.limpiarDidi();
    sh.innerHTML = `
      <div class="empty"><div class="big">${IC.poder()}</div>
        <h3 style="margin-bottom:6px;color:var(--text)">Estás fuera de línea</h3>
        <p class="dim">Ponte en línea para ver los viajes y envíos que se publican cerca de ti.</p></div>
      <button class="btn primary full" id="c-online">Ponerme en línea</button>`;
    $('#c-online').onclick = alternarLinea;
    return;
  }

  const total = S.cercanas.length;
  if (!total) {
    mapa.limpiarDidi();
    sh.innerHTML = `
      <div class="head"><div class="grow"><h2>Solicitudes cerca</h2>
        <div class="dim">Escuchando la zona...</div></div>
        <button class="pill live" id="c-off"><span class="dot"></span>En línea</button></div>
      <div class="empty"><div class="spin" style="margin:0 auto 12px"></div>Sin solicitudes por ahora. Te avisamos apenas alguien publique una carrera o envío.</div>`;
    $('#c-off').onclick = alternarLinea;
    return;
  }

  S.cercanaIdx = Math.max(0, Math.min(S.cercanaIdx || 0, total - 1));
  const s = S.cercanas[S.cercanaIdx];

  /* Sin encabezado propio: el contador va dentro de la tarjeta y el
     "En línea" ya está arriba, en la barra. Son unos 70 px menos de
     panel, que se los queda el mapa. */
  sh.innerHTML = tarjetaSolicitudDidi(s, S.cercanaIdx, total);

  // Navegación por la lista (flechas anterior / siguiente)
  const prevBtn = $('#didi-prev');
  const nextBtn = $('#didi-next');
  if (prevBtn) prevBtn.onclick = () => {
    if (S.cercanaIdx > 0) {
      S.cercanaIdx--;
      render();
    }
  };
  if (nextBtn) nextBtn.onclick = () => {
    if (S.cercanaIdx < total - 1) {
      S.cercanaIdx++;
      render();
    }
  };

  // Soporte de deslizamiento táctil (swipe izquierda / derecha)
  const cardEl = $('#didi-sol-card');
  if (cardEl) {
    let startX = 0;
    cardEl.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    cardEl.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - startX;
      if (diff > 50 && S.cercanaIdx > 0) {
        S.cercanaIdx--; render();
      } else if (diff < -50 && S.cercanaIdx < total - 1) {
        S.cercanaIdx++; render();
      }
    }, { passive: true });
  }

  $$('#sheet [data-ok]').forEach(b => b.onclick = () => {
    const sol = S.cercanas.find(x => x.id === b.dataset.ok);
    if (sol) enviarOferta(sol, sol.precio_ofrecido);
  });
  $$('#sheet [data-otro]').forEach(b => b.onclick = () => {
    const sol = S.cercanas.find(x => x.id === b.dataset.otro);
    if (sol) modalContraoferta(sol);
  });
}

function modalContraoferta(s) {
  let p = +(s.precio_ofrecido + .5).toFixed(2);
  modal(`<div class="grip"></div>
    <h2>Tu contraoferta</h2>
    <p class="dim" style="margin:6px 0 14px">${esc(s.pasajero_nombre || 'El pasajero')} ofrece ${money(s.precio_ofrecido)} por ${s.distancia_km} km</p>
    <div class="price-hero"><div class="amount" id="co-n">$${p.toFixed(2)}</div>
      <div class="stepper"><button id="co-menos">−</button><button id="co-mas">+</button></div></div>
    <div class="row">
      <button class="btn primary" id="co-ok">Enviar oferta</button>
      <button class="btn" id="co-x">Cancelar</button>
    </div>`);
  const pinta = () => $('#co-n').textContent = '$' + p.toFixed(2);
  $('#co-menos').onclick = () => { p = Math.max(1, +(p - .25).toFixed(2)); pinta(); };
  $('#co-mas').onclick = () => { p = +(p + .25).toFixed(2); pinta(); };
  $('#co-x').onclick = cerrarModal;
  $('#co-ok').onclick = () => { cerrarModal(); enviarOferta(s, p); };
}

/* Motivos por los que la base puede rechazar una oferta. Se revisan aquí
   antes de mandarla para que el conductor lea qué le falta en vez del
   "new row violates row-level security policy for table ofertas" de
   Postgres, que además tapaba el motivo real. */
async function puedoOfertar(s) {
  const hab = estadoConductor();
  if (!hab.ok) { toast(hab.motivo, 'bad'); if (hab.sinVehiculo) modalVehiculo(); return false; }
  if (s.pasajero_id && S.user && s.pasajero_id === S.user.id) {
    toast('Esa solicitud es tuya: no puedes tomarla como conductor', 'bad');
    return false;
  }
  /* La lista se refresca cada 10 s: en ese hueco la carrera ya pudo irse. */
  let viva = s;
  try { viva = (await S.api.estadoDeSolicitud(s.id)) || s; } catch (e) {}
  if (viva.estado !== 'buscando') {
    toast('Esa solicitud ya fue tomada por otro conductor', 'bad');
    S.cercanas = S.cercanas.filter(x => x.id !== s.id);
    S.cercanaIdx = Math.max(0, Math.min(S.cercanaIdx, S.cercanas.length - 1));
    render();
    return false;
  }
  return true;
}

async function enviarOferta(s, precio) {
  if (S.solicitud && !['finalizado', 'cancelado'].includes(S.solicitud.estado)) {
    return toast('Ya tienes un servicio en curso. Debes finalizarlo antes de aceptar otro.', 'bad');
  }
  if (!await puedoOfertar(s)) return;
  const eta = minRuta(kmRuta(S.pos, { lat: s.origen_lat, lng: s.origen_lng }));
  try {
    await S.api.crearOferta(s, precio, eta);
    S.ofertaEnviada = { solicitud_id: s.id, precio };
    toast(`Oferta de ${money(precio)} enviada`);
    S.subs.push(S.api.onSolicitud(s.id, sol => {
      const mia = sol.conductor_id === S.user.id;
      if (sol.estado === 'aceptado' && mia) {
        S.solicitud = { ...s, ...sol };
        S.ofertaEnviada = null;
        S.siguiente = null;
        S.paso = 'viaje';
        dibujarViaje(S.solicitud);
        S.subs.push(S.api.onMensajes(sol.id, alRecibirMensajes));
        render();
      } else if (['cancelado', 'aceptado'].includes(sol.estado) && !mia) {
        if (S.ofertaEnviada && S.ofertaEnviada.solicitud_id === s.id) {
          S.ofertaEnviada = null;
          toast('Esa solicitud ya fue tomada por otro conductor');
        }
        render();
      }
    }));
    render();
  } catch (e) {
    if (RLS(e)) {
      /* El perfil que tiene la app puede estar viejo (o venir del respaldo
         local): se relee de la base para que la pantalla diga la verdad. */
      toast('La base no te deja tomar esta carrera. Revisando tu cuenta...', 'bad');
      try { await cargarPerfil(); } catch (_) {}
      const hab = estadoConductor();
      if (!hab.ok) toast(hab.motivo, 'bad');
      else toast('Tu cuenta está en orden: si vuelve a fallar, hay que revisar las reglas de la tabla ofertas en Supabase (parche_ofertas_rls.sql)', 'bad');
      pintarTop(); render();
      return;
    }
    toast(explicarError(e, 'crearOferta'), 'bad');
  }
}

/* Arranca el seguimiento en vivo del servicio recién aceptado. El dibujo
   del mapa lo hace sincronizarMapa() desde render(): aquí solo quedan los
   efectos que no son pintar (GPS propio del conductor, posición del carro
   para el pasajero). */
async function dibujarViaje(s) {
  if (S.modo === 'conductor') seguirMiGps(true);
  else seguirConductor(s);
  mapa.firma = null;
  await sincronizarMapa();
}

    <div class="tira" style="margin-top:0">
      <div class="t1"><span class="marca ${yendoAlDestino ? 'b' : 'a'}"></span>

    </div>

    ${botonWaze(meta, yendoAlDestino ? 'Navegar a la entrega' : 'Navegar a la recogida')}
    ${a ? `<button class="btn primary full" id="c-next" style="margin-top:8px">${a.t}</button>` : ''}

    <div class="acciones">
      <button class="btn suave" id="abrir-chat" style="justify-content:flex-start;overflow:hidden">
        <span style="display:flex;flex-direction:column;align-items:flex-start;min-width:0">
          <span style="font-size:13.5px">${esc((o.nombre || '').split(' ')[0] || 'Pasajero')}</span>
          <span style="font-size:11.5px;font-weight:500;opacity:.8">Escribir mensaje</span>
        </span>
      </button>
      <a class="iconacc" href="tel:${esc(o.tel)}" aria-label="Llamar">${IC.telefono()}</a>
      <button class="iconacc" id="c-mapa" aria-label="Ver el recorrido completo">${IC.ruta()}</button>
    </div>
    ${nuevos ? `<div class="dim" style="margin-top:6px">${nuevos} mensaje(s) sin leer</div>` : ''}

    ${yendoAlDestino ? `<div class="dim oculta-compacta" id="restante" style="text-align:center;margin-top:8px">Calculando distancia al punto de entrega...</div>` : ''}

      <button class="btn danger sm" id="c-cancel">Cancelar</button>

  $('#c-mapa').onclick = () => modalRecorrido(s);
  $('#c-ayuda').onclick = () => modalNuevoTicket(s);
  if (a) $('#c-next').onclick = async () => {
    const btn = $('#c-next'); btn.disabled = true;
    try {
      await S.api.cambiarEstado(s.id, a.next);
      s.estado = a.next;
      if (a.next === 'a_bordo') vigilarProximidad(s);
      if (a.next === 'finalizado') { detenerProximidad(); s.precio_final = s.precio_final || s.precio_ofrecido; S.paso = 'calificar'; }
      render();
    } catch (e) { toast(e.message, 'bad'); btn.disabled = false; }

  $('#c-cancel').onclick = async () => {
    if (!await cancelarCon(s)) return;
