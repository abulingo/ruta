/* ---------- recorrido completo ---------- */
function modalRecorrido(s, conAcciones = false) {
  const A = { lat: s.origen_lat, lng: s.origen_lng };
  const B = { lat: s.destino_lat, lng: s.destino_lng };
  const soyConductor = S.modo === 'conductor';
  const fijo = s.tipo === 'paquete';
  const k1 = kmRuta(S.pos, A), m1 = minRuta(k1);
  const k2 = +s.distancia_km || kmRuta(A, B), m2 = +s.duracion_min || minRuta(k2);
  const tramo = (km, min) => `${km} km<br><span class="dim" style="font-family:Inter;font-weight:400">${min} min</span>`;

  modal(`<div class="grip"></div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
      <h2>Recorrido</h2>
      <div class="dim" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fijo ? 'Envío' : 'Viaje'} de ${esc(s.pasajero_nombre || 'un pasajero')}</div>
    </div>
    <div class="mapabox">
      <div id="map2" style="position:absolute;inset:0"></div>
      <button class="fab cerrar" id="rc-x" title="Cerrar">✕</button>
      <button class="fab yo" id="rc-yo" title="Centrar el mapa">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
      </button>
    </div>
    <div class="card plano" style="margin-top:12px">
      ${soyConductor ? `<div class="leg"><div class="n">1</div>
        <div class="grow"><div style="font-weight:600">Ir a recoger</div><div class="dim">${esc(s.origen_texto)}</div>
          ${botonesNav(S.pos, A)}</div>
        <div class="v" id="leg1">${tramo(k1, m1)}</div></div>` : ''}
      <div class="leg"><div class="n">${soyConductor ? '2' : '1'}</div>
        <div class="grow"><div style="font-weight:600">${fijo ? 'Llevar el paquete' : 'Llevar al pasajero'}</div>
          <div class="dim">${esc(s.destino_texto)}</div>
          ${soyConductor ? botonesNav(A, B) : ''}</div>
        <div class="v" id="leg2">${tramo(k2, m2)}</div></div>
      <div class="leg"><div class="n">Σ</div>
        <div class="grow"><div style="font-weight:600">Total desde donde estás</div>
          <div class="dim">${soyConductor ? 'Recogida más entrega' : 'Trayecto contratado'}</div></div>
        <div class="v" id="legT">${tramo(soyConductor ? +(k1 + k2).toFixed(2) : k2, soyConductor ? m1 + m2 : m2)}</div></div>
      <div class="leg"><div class="n">$</div>
        <div class="grow"><div style="font-weight:600">${soyConductor ? 'Recibes' : 'Pagas'}</div>
          <div class="dim">${fijo ? 'Precio fijo del envío' : 'Efectivo al terminar'}</div></div>
        <div class="v">${money(s.precio_final || s.precio_ofrecido)}</div></div>
    </div>
    ${conAcciones ? `<div class="row" style="margin-top:10px">
        <button class="btn primary" id="rc-ok">Aceptar ${money(s.precio_ofrecido)}</button>
        ${fijo ? '' : `<button class="btn" id="rc-otro">Ofertar otro</button>`}
      </div>` : ''}`);

  setTimeout(async () => {
    if (!$('#map2')) return;
    mapaSec = L.map('map2', { zoomControl: false, attributionControl: false }).setView([A.lat, A.lng], 14);
    L.tileLayer(TILES(), { maxZoom: 19, subdomains: 'abcd' }).addTo(mapaSec);
    const ico = (h, t = 22) => L.divIcon({ className: 'mk', html: h, iconSize: [t, t], iconAnchor: [t / 2, t / 2] });
    const capas = [];

    const viaje = await rutaReal(A, B);
    if (!mapaSec) return;
    capas.push(L.polyline(viaje.pts, { color: CONTRA(), weight: 9 }).addTo(mapaSec));
    capas.push(L.polyline(viaje.pts, { color: AZUL(), weight: 5, lineJoin: 'round' }).addTo(mapaSec));
    if ($('#leg2')) $('#leg2').innerHTML = tramo(viaje.km, viaje.min);

    let ida = null;
    if (soyConductor) {
      ida = await rutaReal(S.pos, A);
      if (!mapaSec) return;
      capas.push(L.polyline(ida.pts, { color: '#8FB4FF', weight: 5, dashArray: '7 9' }).addTo(mapaSec));
      capas.push(L.marker([S.pos.lat, S.pos.lng], { icon: ico('<div class="car">' + IC.carro() + '</div>', 36) }).addTo(mapaSec));
      if ($('#leg1')) $('#leg1').innerHTML = tramo(ida.km, ida.min);
    }
    if ($('#legT')) {
      const km = soyConductor ? +(ida.km + viaje.km).toFixed(2) : viaje.km;
      const min = soyConductor ? ida.min + viaje.min : viaje.min;
      $('#legT').innerHTML = tramo(km, min);
    }

    capas.push(L.marker([A.lat, A.lng], { icon: ico('<div class="pt"></div>') }).addTo(mapaSec).bindTooltip('Recogida'));
    capas.push(L.marker([B.lat, B.lng], { icon: ico('<div class="pt hollow"></div>') }).addTo(mapaSec).bindTooltip('Entrega'));
    const grupo = L.featureGroup(capas);
    mapaSec.fitBounds(grupo.getBounds(), { padding: [40, 40] });
    setTimeout(() => { if (mapaSec) mapaSec.invalidateSize(); }, 140);
  }, 90);

  $('#rc-x').onclick = cerrarModal;
  $('#rc-yo').onclick = () => {
    if (!mapaSec) return;
    const ref = S.modo === 'conductor' ? S.pos : A;
    mapaSec.setView([ref.lat, ref.lng], 16, { animate: true });
  };
  if (conAcciones) {
    $('#rc-ok').onclick = () => { cerrarModal(); enviarOferta(s, s.precio_ofrecido); };
    const b = $('#rc-otro'); if (b) b.onclick = () => { cerrarModal(); modalContraoferta(s); };
  }
}

/* ---------- aviso a 2 km del destino ---------- */
/* Se cuelga del mismo watchPosition que publica la ubicación del
   conductor, para no abrir dos suscripciones al GPS a la vez. */
function vigilarProximidad(s) {
  S.avisoProx = false;
  const B = { lat: +s.destino_lat, lng: +s.destino_lng };
  alMoverse.push(p => {
    const d = haversine(p, B);
    const el = $('#restante');
    if (el) el.textContent = d < .3 ? 'Estás llegando al punto de entrega' : `Faltan ${d.toFixed(1)} km para la entrega`;
  });
  seguirMiGps(true);
}
function detenerProximidad() { seguirMiGps(false); }

      <div class="kv"><span class="k">Estado</span><span class="v">${v.aprobado
        ? '<span class="badge ok">Aprobado</span>' : '<span class="badge warn">En revisión</span>'}</span></div></div>`
      : `<button class="btn full" id="pf-veh" style="margin-top:10px">Registrar vehículo</button>`}

    <button class="btn danger full" id="pf-salir" style="margin-top:14px">Cerrar sesión</button>
    <p class="fine" style="margin-top:14px">Ruta funciona con pago en efectivo. El precio de los viajes lo acuerdas con el conductor; el de los envíos es fijo.</p>`;
  $('#sw-rol').onclick = () => setModo(S.modo === 'conductor' ? 'pasajero' : 'conductor');
  $('#pf-editar').onclick = modalSoporteEdicion;
  $('#pf-lugares').onclick = modalLugares;
  $('#pf-ayuda').onclick = () => setVista('ayuda');
  $('#pf-pin').onclick = modalCambiarPin;
  const bv = $('#pf-veh'); if (bv) bv.onclick = () => modalVehiculo();
  const be = $('#pf-veh-ed'); if (be) be.onclick = () => modalVehiculo(S.vehiculo);
  $('#pf-salir').onclick = async () => {
    if (S.solicitud && !['finalizado', 'cancelado'].includes(S.solicitud.estado) &&
        !await confirmar('Tienes un servicio en curso', 'Si cierras sesión ahora perderás el seguimiento en el mapa y el chat.', 'Cerrar sesión igual')) return;
    try { await S.api.salir(); } catch (e) {}
    limpiarSubs(); limpiarSupSubs(); detenerProximidad();
    if (S.subSop) { try { S.subSop(); } catch (e) {} S.subSop = null; }
    S.user = null; S.perfil = null; S.vehiculo = null; S.solicitud = null;
    S.origen = null; S.destino = null; S.enLinea = false; S.cercanas = [];
    S.lugares = []; S.recientes = []; S.tickets = null; S.sinLeerSop = 0; S.esSoporte = false;
    pintarBadgeSoporte();
    if (mapa.m) mapa.limpiar();
    limpiarPin('login');
    pantallaAcceso();
  };
}

/* Editar nombre, cédula y celular sin salir de la app */
function modalDatos() {
  const p = S.perfil || {};
  modal(`<div class="grip"></div>
    <h2>Mis datos</h2>
    <p class="dim" style="margin:6px 0 14px">El correo no se puede cambiar desde aquí: escríbenos a soporte si lo necesitas.</p>
    <div class="field"><label for="md-nom">Nombre y apellido</label>
      <input id="md-nom" class="input" autocomplete="name" value="${esc(p.nombre || '')}"></div>
    <div class="row">
      <div class="field"><label for="md-ced">Número de identidad</label>
        <input id="md-ced" class="input" inputmode="numeric" maxlength="15" value="${esc(p.cedula || '')}"></div>
      <div class="field"><label for="md-cel">Celular</label>
        <input id="md-cel" class="input" inputmode="tel" maxlength="10" value="${esc(p.celular || '')}"></div>
    </div>
    <button class="btn primary full" id="md-ok" style="margin-top:10px">Guardar cambios</button>
    <button class="btn ghost full" id="md-x">Cancelar</button>`);
  $('#md-x').onclick = cerrarModal;
  $('#md-ok').onclick = async () => {
    const nombre = $('#md-nom').value.trim();
    const cedula = $('#md-ced').value.trim();
    const celular = $('#md-cel').value.trim();
    if (nombre.split(/\s+/).length < 2) return toast('Escribe nombre y apellido', 'bad');
    const rc = revisarCedula(cedula);
    if (!rc.ok && rc.duro) return toast(rc.motivo, 'bad');
    if (!rc.ok && !await confirmar('Revisa tu cédula', rc.motivo + '. Si estás seguro de que el número es correcto, puedes continuar.', 'Es correcta, continuar')) return;
    if (!celularValido(celular)) return toast('El celular debe tener 10 dígitos y empezar en 09', 'bad');
    const btn = $('#md-ok'); btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      await S.api.guardarPerfil({ nombre, cedula, celular });
      cerrarModal(); toast('Datos actualizados'); pintarTop(); render();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Guardar cambios';
      toast(e.code === '23505' ? 'Esa cédula ya está registrada en otra cuenta' : e.message, 'bad');

/* Placa ecuatoriana: tres letras y tres o cuatro números */
function normalizarPlaca(p) {
  const s = p.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const m = s.match(/^([A-Z]{3})(\d{3,4})$/);
  return m ? m[1] + '-' + m[2] : null;
}

function modalVehiculo(existente) {
  const v = existente || {};
  modal(`<div class="grip"></div><h2>${existente ? 'Editar vehículo' : 'Tu vehículo'}</h2>
    <p class="dim" style="margin:6px 0 14px">Un administrador revisa estos datos antes de habilitarte para recibir solicitudes.</p>
    <div class="row">
      <div class="field"><label for="v-placa">Placa</label>
        <input id="v-placa" class="input" maxlength="8" placeholder="PBA-1234" value="${esc(v.placa || '')}"></div>
      <div class="field"><label for="v-anio">Año</label>
        <input id="v-anio" class="input" inputmode="numeric" maxlength="4" placeholder="2019" value="${esc(v.anio || '')}"></div>
    </div>
    <div class="row">
      <div class="field"><label for="v-marca">Marca</label>
        <input id="v-marca" class="input" placeholder="Chevrolet" value="${esc(v.marca || '')}"></div>
      <div class="field"><label for="v-modelo">Modelo</label>
        <input id="v-modelo" class="input" placeholder="Sail" value="${esc(v.modelo || '')}"></div>
    </div>
    <div class="field"><label for="v-color">Color</label>
      <input id="v-color" class="input" placeholder="Gris" value="${esc(v.color || '')}"></div>
    ${existente && existente.aprobado ? `<div class="aviso" style="margin-bottom:10px">Si cambias la placa, un administrador tendrá que aprobar el vehículo otra vez.</div>` : ''}
    <button class="btn primary full" id="v-ok" style="margin-top:6px">Guardar vehículo</button>
    <button class="btn ghost full" id="v-x">Cancelar</button>`);
  $('#v-x').onclick = cerrarModal;
  $('#v-ok').onclick = async () => {
    const placa = normalizarPlaca($('#v-placa').value.trim());
    if (!placa) return toast('La placa va con tres letras y tres o cuatro números, como PBA-1234', 'bad');
    const anio = +$('#v-anio').value || null;
    if (anio && (anio < 1980 || anio > new Date().getFullYear() + 1)) return toast('Revisa el año del vehículo', 'bad');
    const datos = {
      placa, anio,
      marca:  $('#v-marca').value.trim() || null,
      modelo: $('#v-modelo').value.trim() || null,
      color:  $('#v-color').value.trim() || null
    };
    const btn = $('#v-ok'); btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      S.vehiculo = await S.api.guardarVehiculo(datos, v.id);
      cerrarModal(); toast('Vehículo guardado'); render();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Guardar vehículo';
      toast(e.message || 'No se pudo guardar el vehículo', 'bad');
    }
  };
}

(async function arranque() {
  /* El enlace de "olvidé mi PIN" vuelve con type=recovery en el hash */
  const recuperando = location.hash.includes('type=recovery');
  if (!hayConfig()) { pantallaAcceso(); return; }
  try {
    const api = conectar();
    if (!api) { pantallaAcceso(); return; }

    // Mantener la sesión activa y responder a cambios de token
    api.sb.auth.onAuthStateChange(async (event, sesion) => {
      if (sesion && sesion.user) {
        S.user = sesion.user;
        if (!S.perfil) {
          await cargarPerfil();
          if (S.perfil && $('#app').classList.contains('hidden')) arrancarApp();
        }
      }
    });

    let { data } = await api.sb.auth.getSession();
    let session = data && data.session;
    if (!session) {
      try {
        const ref = await api.sb.auth.refreshSession();
        if (ref && ref.data && ref.data.session) session = ref.data.session;
      } catch (_) {}
    }

    if (session && session.user) {
      S.user = session.user;
      await cargarPerfil();
      if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
      if (S.perfil) {
        arrancarApp();
        if (recuperando) { toast('Elige tu PIN nuevo'); modalCambiarPin(); }
        return;
      }
    }
  } catch (e) { console.warn('Aviso de inicio de sesión:', e); }
  pantallaAcceso();
})();
