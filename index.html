<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ruta — viajes y envíos</title>
<meta name="description" content="Pide un carro o manda un paquete con precio claro desde el primer momento.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Politica de seguridad de contenido. Deja pasar solo los origenes que la
     app usa de verdad: las dos librerias, las fuentes, las teselas del mapa,
     el enrutador y Supabase. Cualquier otro dominio queda bloqueado, asi un
     script inyectado no puede sacar datos ni cargar codigo de fuera.
     'unsafe-inline' sigue siendo necesario porque toda la app vive en un
     <script> y un <style> dentro de este archivo.
     Falta por cabecera HTTP real (el <meta> no las admite), configuralas en
     el hosting: Content-Security-Policy: frame-ancestors 'none';
     X-Content-Type-Options: nosniff; Referrer-Policy: strict-origin-when-cross-origin;
     Strict-Transport-Security: max-age=31536000; includeSubDomains. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  form-action 'self';
  script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: blob: https://*.cartocdn.com https://*.tile.openstreetmap.org https://*.supabase.co;
  connect-src 'self' https://*.supabase.co wss://*.supabase.co https://router.project-osrm.org https://nominatim.openstreetmap.org;
  worker-src 'self' blob:;
  manifest-src 'self'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A5AFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111926" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230A5AFF'/%3E%3Ccircle cx='42' cy='22' r='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
      crossorigin="anonymous">
<style>
:root{
  color-scheme:light;
  --azul:#0A5AFF; --azul-2:#0842C4; --azul-3:#3D82FF;
  --azul-suave:#EAF1FF; --azul-borde:#CFE0FF;
  --bg:#FFFFFF; --fondo:#F4F7FD; --marco:#DDE6F5; --mapabg:#E8EEF7;
  --panel:#FFFFFF; --panel2:#F5F8FE; --panel3:#EAF1FF;
  --line:#E4EAF4; --line2:#CBD8EC;
  --text:#0D1B2E; --muted:#5B6E8C; --dim:#8496AF;
  --ok:#0FA958; --bad:#E1443F; --warn:#E0912A;
  --r:18px; --rs:12px;
  /* escala de espacios: todo el layout usa estos seis valores */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px;
  --sombra:0 6px 24px rgba(13,45,110,.09);
  --sombra-alta:0 -10px 34px rgba(13,45,110,.12);
  --sombra-azul:0 8px 20px rgba(10,90,255,.28);
  --velo:rgba(255,255,255,.82);
}
/* El tema lo fija el script en <html data-tema>, resolviendo antes
   la preferencia del sistema. Por eso aquí solo hace falta un bloque. */
html[data-tema="oscuro"]{
  color-scheme:dark;
  --azul:#4C8DFF; --azul-2:#9CC0FF; --azul-3:#2F6FE0;
  --azul-suave:#16233A; --azul-borde:#28456F;
  --bg:#111926; --fondo:#0C121C; --marco:#070B12; --mapabg:#18212E;
  --panel:#151E2D; --panel2:#1B2634; --panel3:#1E2C44;
  --line:#26313F; --line2:#3A4A60;
  --text:#E8EEF8; --muted:#9BABC4; --dim:#7386A0;
  --ok:#2BC275; --bad:#F26B66; --warn:#E9A94A;
  --sombra:0 6px 24px rgba(0,0,0,.42);
  --sombra-alta:0 -10px 34px rgba(0,0,0,.5);
  --sombra-azul:0 8px 20px rgba(30,90,220,.4);
  --velo:rgba(17,25,38,.82);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--marco);color:var(--text);
  font-family:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

#shell{position:relative;max-width:520px;margin:0 auto;height:100dvh;overflow:hidden;background:var(--bg);box-shadow:0 0 60px rgba(13,45,110,.14)}

.num{font-family:"Space Grotesk",Inter,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:"Space Grotesk",Inter,"Segoe UI",sans-serif;letter-spacing:-.025em;margin:0}
h1{font-size:27px;font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.dim{color:var(--dim);font-size:13px}
.fine{color:var(--dim);font-size:12px;line-height:1.5}

/* ---------- marca ---------- */
.brand{font-family:"Space Grotesk",Inter,"Segoe UI",sans-serif;font-weight:700;font-size:19px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;color:var(--azul)}
.brand i{width:23px;height:23px;border-radius:8px;background:var(--azul);display:block;position:relative;font-style:normal;box-shadow:var(--sombra-azul)}
.brand i::after{content:"";position:absolute;inset:6px 6px auto auto;width:9px;height:9px;border-radius:50%;background:#fff}
.brand.big{font-size:30px;gap:12px;color:#fff}
.brand.big i{width:34px;height:34px;border-radius:12px;background:#fff;box-shadow:none}
.brand.big i::after{inset:9px 9px auto auto;width:13px;height:13px;background:var(--azul)}

/* ---------- acceso ---------- */
.auth{position:absolute;inset:0;overflow-y:auto;background:var(--fondo)}
.hero{position:relative;padding:24px 20px 62px;background:linear-gradient(150deg,#0A5AFF 0%,#0842C4 62%,#062E8C 100%);color:#fff;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:210px;height:210px;top:-70px;right:-50px}
.hero::after{width:150px;height:150px;bottom:-60px;left:-40px}
.hero h1{margin:16px 0 6px;position:relative}
.hero p{margin:0;color:rgba(255,255,255,.82);position:relative;max-width:30ch}
.hero-cards{display:flex;gap:7px;margin-top:14px;position:relative;flex-wrap:wrap}
.hc{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);padding:7px 12px;border-radius:999px;font-size:12.5px}
.hc span{font-size:14px}
.auth-card{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-44px;position:relative;padding:18px 18px 32px;box-shadow:0 -10px 30px rgba(13,45,110,.10);min-height:60dvh}

.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.input{
  width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:11px 13px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s;
}
.input:focus{border-color:var(--azul);background:#fff;box-shadow:0 0 0 4px rgba(10,90,255,.12)}
.input::placeholder{color:var(--dim)}
textarea.input{resize:none;min-height:60px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 16px;border-radius:var(--rs);font-weight:600;font-size:15px;
  background:var(--panel2);border:1.5px solid var(--line);color:var(--text);
  transition:transform .08s,background .15s,opacity .15s,box-shadow .15s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--azul-3),var(--azul));color:#fff;border-color:transparent;box-shadow:var(--sombra-azul)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.suave{background:var(--azul-suave);border-color:var(--azul-borde);color:var(--azul-2)}
.btn.danger{color:var(--bad);border-color:#F6D8D7;background:#FDF3F2}
.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn.google{background:#fff;color:#1F2937;border-color:var(--line2)}
.btn+.btn{margin-top:8px}

.segmented{display:flex;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.segmented button{flex:1;padding:8px 6px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;transition:.15s}
.segmented button.on{background:var(--azul);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(10,90,255,.26)}
.segmented.small button{padding:6px 10px;font-size:12.5px}

.pinbox{display:flex;gap:8px;max-width:260px;width:100%;margin-left:auto;margin-right:auto;justify-content:center}
.pinbox input{
  flex:1 1 0;width:100%;min-width:0;text-align:center;font-family:"Space Grotesk";font-size:22px;font-weight:600;
  padding:11px 0;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;outline:none;color:var(--azul-2);
}
.pinbox input:focus{border-color:var(--azul);background:#fff;box-shadow:0 0 0 4px rgba(10,90,255,.12)}
.sep{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12.5px;margin:12px 0}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}
.aviso{background:var(--azul-suave);border:1px solid var(--azul-borde);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--azul-2)}

/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--fondo)}
.topbar{
  display:flex;align-items:center;gap:var(--s2);background:var(--bg);
  padding:8px var(--s3);padding-top:calc(8px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);z-index:600
}
.topbar .grow{flex:1}
.iconbtn{
  width:35px;height:35px;border-radius:11px;background:var(--panel2);border:1.5px solid var(--line);
  display:grid;place-items:center;color:var(--muted);flex:none;position:relative;transition:.15s
}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .n{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)
}
.avatar{
  width:35px;height:35px;border-radius:50%;background:var(--azul-suave);border:1.5px solid var(--azul-borde);
  color:var(--azul-2);font-family:"Space Grotesk";font-weight:600;font-size:13px;display:grid;place-items:center;flex:none;
}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:500}
.pill.live{color:#fff;background:var(--ok);border-color:var(--ok)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.pill.live .dot{background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

#mapwrap{flex:1;position:relative;overflow:hidden;min-height:120px}
#map{position:absolute;inset:0;background:var(--mapabg)}
.leaflet-container{background:var(--mapabg);font-family:Inter}
.leaflet-control-attribution{background:var(--velo)!important;color:var(--dim)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--sombra)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--text)!important;border-bottom-color:var(--line)!important}
.leaflet-tooltip{background:var(--text);border:0;color:#fff;font-size:12px;box-shadow:none}
.leaflet-tooltip::before{display:none}

.mk{display:grid;place-items:center}
.mk .pt{width:15px;height:15px;border-radius:50%;border:3.5px solid #fff;background:var(--azul);box-shadow:0 2px 8px rgba(13,45,110,.35)}
.mk .pt.hollow{background:var(--text)}
.mk .car{width:36px;height:36px;border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:var(--sombra-azul);border:2px solid #fff}
.mk .me{width:16px;height:16px;border-radius:50%;background:var(--azul);border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,90,255,.18)}

#cross{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:500}
#cross .pin{transform:translateY(-14px);display:grid;place-items:center}
#cross .head{width:18px;height:18px;border-radius:50%;background:var(--azul);border:3.5px solid #fff;box-shadow:0 2px 10px rgba(13,45,110,.4)}
#cross .stem{width:2px;height:16px;background:var(--azul)}
#cross .shadow{width:12px;height:4px;border-radius:50%;background:rgba(13,45,110,.25)}

/* ---------- hoja inferior ---------- */
/* Hoja inferior con tres alturas: se arrastra o se toca el asa para
   darle más espacio al mapa o al contenido, según lo que se esté haciendo. */
.sheet{
  position:relative;z-index:610;background:var(--bg);border-radius:22px 22px 0 0;
  box-shadow:var(--sombra-alta);max-height:62dvh;overflow-y:auto;
  padding:0 var(--s3) var(--s3);overscroll-behavior:contain;
  transition:max-height .26s cubic-bezier(.4,0,.2,1);
}
.sheet.compacta{max-height:34dvh}
.sheet.expandida{max-height:86dvh}
#asa{
  position:sticky;top:0;z-index:3;display:block;width:100%;height:24px;
  background:var(--bg);border-radius:22px 22px 0 0;touch-action:none;cursor:grab;
}
#asa::after{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 0;transition:background .15s,width .15s}
#asa:hover::after,#asa:active::after{background:var(--azul);width:52px}
.grip{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 10px}
.head,.sheet .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;width:100%}
.head .grow,.sheet .head .grow{flex:1;min-width:0}
.back{width:36px;height:36px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--text);font-weight:700;font-size:16px;cursor:pointer;transition:all .15s;line-height:1;padding:0}
.back:hover{background:var(--azul-suave);color:var(--azul);border-color:var(--azul-borde)}

.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sombra)}
.card+.card{margin-top:8px}
.card.plano{box-shadow:none;background:var(--panel2)}

.route{display:grid;grid-template-columns:18px 1fr;gap:0 12px;align-items:center}
.route .rail{grid-row:1/3;display:grid;justify-items:center;height:100%}
.route .l1{width:10px;height:10px;border-radius:50%;background:var(--azul)}
.route .line{width:2px;flex:1;background:var(--line2);min-height:22px;border-radius:2px}
.route .l2{width:10px;height:10px;background:var(--text);border-radius:3px}
.locbtn{width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.locbtn:last-child{border-bottom:0}
.locbtn .t{font-size:14.5px;font-weight:500}
.locbtn .s{font-size:12px;color:var(--dim)}

.price-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0 8px}
.price-hero .amount{font-family:"Space Grotesk";font-weight:700;font-size:40px;line-height:1;letter-spacing:-.045em;color:var(--azul-2)}
.price-hero .amount span{font-size:17px;color:var(--dim);font-weight:500;text-decoration:line-through}
.stepper{display:flex;gap:8px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--azul-suave);border:1.5px solid var(--azul-borde);color:var(--azul-2);font-size:22px;font-family:"Space Grotesk";display:grid;place-items:center}
.hint{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:10px}

.opt{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:7px;transition:.15s;text-align:left;width:100%}
.opt.on{border-color:var(--azul);background:var(--azul-suave);box-shadow:0 4px 14px rgba(10,90,255,.14)}
.opt .ico{width:36px;height:36px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:17px;flex:none;color:var(--muted)}
.opt.on .ico{background:var(--azul);color:#fff}
.opt .grow{flex:1;min-width:0}
.opt .t{font-size:14.5px;font-weight:500}
.opt .s{font-size:12.5px;color:var(--dim)}
.opt .p{font-family:"Space Grotesk";font-weight:700;font-size:17px;text-align:right;color:var(--azul-2)}
.opt .p small{display:block;font-size:11px;color:var(--ok);font-weight:600;font-family:Inter}
.opt .p .was{font-size:11.5px;color:var(--dim);text-decoration:line-through;font-family:Inter;font-weight:400}

.badge{display:inline-block;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:500}
.badge.solid{background:var(--azul);color:#fff;border-color:var(--azul);font-weight:600}
.badge.ok{color:var(--ok);border-color:#C7EBD6;background:#EDFAF2}
.badge.warn{color:var(--warn);border-color:#F5E2C4;background:#FDF6EA}

.offer{display:flex;gap:12px;align-items:center}
.offer .grow{flex:1;min-width:0}
.offer .t{font-weight:600;font-size:15px}
.offer .s{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .price{font-family:"Space Grotesk";font-weight:700;font-size:23px;text-align:right;line-height:1.1;color:var(--azul-2)}
.offer .price small{display:block;font-family:Inter;font-size:11px;color:var(--dim);font-weight:400}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}

.wait{display:flex;align-items:center;gap:12px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--azul);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:4px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--azul-3),var(--azul));width:0;animation:fill 60s linear forwards}
@keyframes fill{to{width:100%}}

.chat{max-height:44dvh;overflow-y:auto;display:flex;flex-direction:column;gap:7px;margin-bottom:10px;padding:4px 0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.msg.mine{align-self:flex-end;background:var(--azul);color:#fff;border-color:var(--azul);border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.chatbar{display:flex;gap:8px}
.chatbar .input{flex:1}

.stars{display:flex;gap:8px;justify-content:center;margin:10px 0 14px}
.stars button{font-size:34px;color:var(--line2);transition:color .12s,transform .12s}
.stars button.on{color:#F5B72A;transform:scale(1.08)}

.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .ico,.icocaja{width:38px;height:38px;border-radius:12px;background:var(--azul-suave);color:var(--azul);display:grid;place-items:center;font-size:16px;flex:none}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.list-item .s{font-size:12px;color:var(--dim)}
.list-item .amt{font-family:"Space Grotesk";font-weight:700;color:var(--azul-2)}

.empty{text-align:center;padding:24px 16px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:10px;color:var(--azul-borde)}

/* ---------- DiDi conductor style ---------- */
.didi-tooltip{background:#0B132B;color:#fff;border-radius:10px;padding:5px 9px;font-family:"Space Grotesk",system-ui,sans-serif;font-size:12px;font-weight:600;border:none;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.didi-tooltip::before{border-top-color:#0B132B !important}
.didi-tooltip-a{background:#00875A}
.didi-tooltip-a::before{border-top-color:#00875A !important}
.didi-tooltip-b{background:#DE350B}
.didi-tooltip-b::before{border-top-color:#DE350B !important}
.didi-mk-a,.didi-mk-b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff}
.didi-mk-a{background:#00875A;color:#fff}
.didi-mk-b{background:#DE350B;color:#fff}
.didi-card{background:var(--panel);border:1.5px solid var(--azul-borde);border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(10,90,255,.08);margin-top:2px;position:relative}
.didi-nav-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;min-height:24px}
.didi-nav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;font-weight:700;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.didi-nav-btn:hover:not(:disabled){background:var(--azul-suave);color:var(--azul)}
.didi-nav-btn:disabled{opacity:.25;cursor:not-allowed}
.didi-counter{font-size:13px;color:var(--muted);font-weight:600}
.didi-counter.solo{flex:1;text-align:center}
.didi-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-bottom:10px}
.didi-quien{grid-column:1;grid-row:1;min-width:0;display:flex;align-items:center;gap:9px}
.didi-quien .nom{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.didi-meta{grid-column:1/-1;grid-row:2;display:flex;flex-wrap:wrap;gap:5px}
.didi-meta .chipdato{padding:4px 9px;font-size:11.5px}
.didi-meta .chipdato.urge{background:#FDF6EA;border-color:#F5E2C4;color:var(--warn);font-weight:600}
.didi-plata{grid-column:2;grid-row:1;justify-self:end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.didi-price{font-family:"Space Grotesk";font-size:27px;font-weight:800;color:var(--azul-2);line-height:1;white-space:nowrap}
.didi-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.didi-tags .badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;padding:4px 8px}
.didi-acciones{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.didi-acciones .btn{font-size:15px;padding:13px}
.didi-puntos{display:flex;justify-content:center;gap:6px;margin-top:10px}
.didi-puntos i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:all .2s}
.didi-puntos i.on{width:18px;background:var(--azul)}
/* En cuanto hay ancho de sobra los chips se meten entre el nombre y el
   precio, en una sola fila. En el teléfono van debajo: apretar el nombre
   o el precio, que son lo que se lee primero, sale más caro que una línea
   de más. */
@media(min-width:430px){
  .didi-top{grid-template-columns:minmax(0,1fr) auto auto}
  .didi-meta{grid-column:2;grid-row:1;flex-direction:column;align-items:flex-end;flex-wrap:nowrap}
  .didi-plata{grid-column:3}
}
.didi-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.didi-metric-box{background:var(--panel2);border-radius:12px;padding:10px;border:1px solid var(--line)}
.didi-metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.didi-metric-val{font-size:13.5px;font-weight:700;color:var(--text);margin-top:2px}
.didi-pax-box{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.didi-pax-avatar{width:36px;height:36px;flex:none;border-radius:50%;background:var(--azul-suave);color:var(--azul);display:grid;place-items:center;font-weight:700;font-size:14px}
.didi-route{display:grid;grid-template-columns:20px 1fr;gap:0 12px;align-items:center;margin:10px 0}
.didi-dot{width:10px;height:10px;border-radius:50%;margin:auto}
.didi-dot.a{background:#00875A}
.didi-dot.b{background:#DE350B}
.didi-line-dash{width:2px;height:24px;background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 4px,transparent 4px,transparent 8px);margin:auto}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--azul-suave);border:1.5px solid var(--azul-borde);border-radius:14px;padding:10px}
.stat .n{font-family:"Space Grotesk";font-weight:700;font-size:21px;color:var(--azul-2)}
.stat .l{font-size:11.5px;color:var(--muted)}

.switch{width:48px;height:28px;border-radius:999px;background:var(--line2);border:0;position:relative;transition:.18s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch.on{background:var(--azul)}
.switch.on i{left:23px}

.bottomnav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:620}
.bottomnav button{flex:1;padding:6px 4px;border-radius:12px;color:var(--dim);font-size:11px;display:grid;justify-items:center;gap:3px;font-weight:500;position:relative}
.bottomnav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav button.on{color:var(--azul)}
.bottomnav button .n{
  position:absolute;top:0;left:50%;margin-left:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;border:2px solid var(--bg)
}

.leg{display:flex;align-items:center;gap:10px;padding:8px 0}
.leg+.leg{border-top:1px solid var(--line)}
.leg .n{width:28px;height:28px;border-radius:10px;background:var(--azul-suave);color:var(--azul-2);display:grid;place-items:center;font-size:12px;font-family:"Space Grotesk";font-weight:600;flex:none}
.leg .grow{flex:1;min-width:0}
.leg .v{font-family:"Space Grotesk";font-weight:700;white-space:nowrap;text-align:right}
.navs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chipnav{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--azul-suave);border:1px solid var(--azul-borde);color:var(--azul-2);
  font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;
}
.chipnav:active{transform:scale(.96)}
.chipnav b{font-weight:600}
.mapabox{height:40dvh;min-height:230px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);position:relative}
.fab{
  position:absolute;z-index:700;width:42px;height:42px;border-radius:50%;
  background:#fff;border:1px solid var(--line);box-shadow:0 3px 12px rgba(13,45,110,.22);
  display:grid;place-items:center;color:var(--azul);
}
.fab:active{transform:scale(.94)}
.fab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.fab.cerrar{color:var(--muted);font-size:16px;font-weight:600}
#fab-yo{right:12px;bottom:12px}
.mapabox .fab.yo{right:10px;bottom:10px}
.mapabox .fab.cerrar{right:10px;top:10px}

.diag{display:flex;gap:10px;align-items:flex-start;padding:11px 0}
.diag+.diag{border-top:1px solid var(--line)}
.diag .est{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;margin-top:2px}
.diag .est.si{background:var(--ok)}
.diag .est.no{background:var(--bad)}
.diag .est.duda{background:var(--warn)}
.diag .t{font-weight:600;font-size:14px}
.diag .s{font-size:12.5px;color:var(--muted)}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:min(460px,92vw)}
.toast{background:var(--text);color:#fff;border-radius:13px;padding:12px 15px;font-size:14px;box-shadow:0 10px 28px rgba(13,45,110,.28);animation:drop .2s ease}
.toast.bad{background:var(--bad)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.modal{position:fixed;inset:0;background:rgba(13,27,46,.45);z-index:1500;display:grid;place-items:end center;backdrop-filter:blur(3px)}
.modal .box{background:var(--bg);border-radius:24px 24px 0 0;padding:16px 14px 20px;width:min(520px,100%);max-height:90dvh;overflow-y:auto}
@media(min-width:560px){.modal{place-items:center}.modal .box{border-radius:24px}}
.loading{position:fixed;inset:0;background:linear-gradient(150deg,#0A5AFF,#0842C4);display:grid;place-items:center;z-index:3000}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- foco visible (teclado y lectores de pantalla) ---------- */
:focus-visible{outline:2.5px solid var(--azul);outline-offset:2px;border-radius:6px}
.input:focus-visible{outline:none}

/* ---------- lugares guardados ---------- */
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 var(--s1);margin:0 calc(var(--s3)*-1);padding-left:var(--s3);padding-right:var(--s3);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:7px;flex:none;padding:8px 13px;border-radius:999px;
  background:var(--panel2);border:1.5px solid var(--line);color:var(--text);
  font-size:13px;font-weight:500;white-space:nowrap;max-width:200px;transition:.15s
}
.chip:active{transform:scale(.96)}
.chip .em{font-size:14px;line-height:1}
.chip .tx{overflow:hidden;text-overflow:ellipsis}
.chip.add{background:var(--azul-suave);border-color:var(--azul-borde);color:var(--azul-2);font-weight:600}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}

.sec{display:flex;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s2)}
.sec h3{flex:1;min-width:0}
.sec .mas{font-size:13px;color:var(--azul);font-weight:600}

.rowbtn{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--line)
}
.rowbtn:last-child{border-bottom:0}
.rowbtn .ico{width:36px;height:36px;border-radius:11px;background:var(--azul-suave);color:var(--azul);display:grid;place-items:center;font-size:16px;flex:none}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowbtn .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowbtn .fin{color:var(--dim);font-size:18px;flex:none}

/* ---------- soporte ---------- */
.tk{display:flex;gap:var(--s3);align-items:flex-start;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--azul-suave);color:var(--azul)}
.tk .grow{flex:1;min-width:0}
.tk .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .s{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}

.msg.sis{align-self:center;max-width:92%;text-align:center;background:var(--azul-suave);border-color:var(--azul-borde);color:var(--azul-2);font-size:13px;border-radius:14px}
.msg .quien{display:block;font-size:11px;font-weight:600;opacity:.72;margin-bottom:2px}
.msg .hora{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.chat.alto{max-height:52dvh;min-height:34dvh}
.sopcats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.sopcat{
  display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;text-align:left;
  background:var(--panel2);border:1.5px solid var(--line);transition:.15s
}
.sopcat.on{border-color:var(--azul);background:var(--azul-suave)}
.sopcat .em{font-size:18px}
.sopcat .t{font-size:13.5px;font-weight:600}
.sopcat .s{font-size:11.5px;color:var(--dim);line-height:1.35}

/* ---------- avisos de conexión ---------- */
#red{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));
  z-index:1400;background:var(--warn);color:#fff;border-radius:999px;padding:8px 16px;
  font-size:13px;font-weight:600;box-shadow:var(--sombra);white-space:nowrap
}

/* ---------- esqueletos de carga ---------- */
.skel{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel3) 37%,var(--panel2) 63%);background-size:400% 100%;animation:brillo 1.3s ease infinite;border-radius:10px}
@keyframes brillo{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-row{display:flex;gap:var(--s3);align-items:center;padding:12px 0}
.skel-row .c{width:38px;height:38px;border-radius:12px;flex:none}
.skel-row .l{height:11px;border-radius:6px}

/* ---------- preguntas frecuentes ---------- */
.faq{border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq summary{
  list-style:none;cursor:pointer;padding:12px 0;font-size:14.5px;font-weight:500;
  display:flex;align-items:center;gap:10px
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;color:var(--azul);font-weight:600;flex:none}
.faq[open] summary::after{content:"−"}
.faq p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.55}

/* ---------- ajustes finos de espacio ---------- */
.card{padding:var(--s3)}
.card+.card{margin-top:var(--s2)}
.field{margin-bottom:var(--s2)}
.auth-card{padding:var(--s4) var(--s4) var(--s6)}
.empty{padding:var(--s5) var(--s4)}
.stats{gap:var(--s2);margin-bottom:var(--s3)}
@media(max-height:680px){
  .hero{padding:18px 20px 54px}
  h1{font-size:24px}
  .price-hero .amount{font-size:34px}
  .sheet{max-height:66dvh}
}
@media(min-width:560px){
  #shell{border-radius:0}
  .sheet{max-height:60dvh}
}

/* ============================================================
   Iconos, panel deslizante, buscador y tarjetas del conductor
   ============================================================ */

/* Toda la interfaz usa SVG propio: los emojis y los simbolos de caja
   cambian de tipografia o salen como cuadros vacios en Windows. */
.ic{width:18px;height:18px;flex:none;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.ic.solido{fill:currentColor;stroke:none}
.opt .ico .ic,.rowbtn .ico .ic,.list-item .ico .ic,.icocaja .ic,.tk .ico .ic,.sopcat .em .ic{width:19px;height:19px}
.hc .ic{width:15px;height:15px}
.empty .big .ic{width:38px;height:38px;margin:0 auto;stroke-width:1.4}
.mk .car .ic{width:20px;height:20px;stroke-width:2.1}
.chip .em .ic{width:15px;height:15px}
.btn .ic{margin-right:-2px}

/* ---------- asa: un toque sube el panel, otro lo baja ---------- */
#asa{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:center;
  width:100%;height:30px;background:var(--bg);border-radius:22px 22px 0 0;
  touch-action:none;cursor:pointer;padding:0
}
#asa::after{display:none}
#asa .barra{width:42px;height:4px;border-radius:4px;background:var(--line2);transition:background .15s,width .15s}
#asa:hover .barra,#asa:active .barra{background:var(--azul);width:56px}
#asa .tag{
  position:absolute;right:2px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  color:var(--azul-2);background:var(--azul-suave);border:1px solid var(--azul-borde);
  font-size:11.5px;font-weight:600;white-space:nowrap
}
#asa .tag .ic{width:13px;height:13px}
.sheet.compacta .oculta-compacta{display:none!important}
.sheet.compacta{max-height:40dvh}
.sheet.expandida{max-height:88dvh}
/* Con el panel abajo se aprieta lo que queda para que el botón de
   aceptar siga visible sin desplazar. */
.sheet.compacta .head{margin-bottom:8px}
.sheet.compacta .didi-card{padding:12px;margin-top:2px}
.sheet.compacta .didi-top{margin-bottom:8px}
.sheet.compacta .didi-price{font-size:26px}
.sheet.compacta .tira{margin:9px 0}
.sheet.compacta .didi-acciones{margin-top:9px}
.sheet.compacta .didi-nav-bar{margin-bottom:6px}

/* ---------- buscador de lugares ---------- */
.buscador{
  display:flex;align-items:center;gap:9px;background:var(--panel2);
  border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;transition:.15s
}
.buscador:focus-within{border-color:var(--azul);background:var(--bg);box-shadow:0 0 0 4px rgba(10,90,255,.12)}
.buscador input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.buscador input::placeholder{color:var(--dim)}
.buscador>.ic{color:var(--dim)}
.buscador button{display:grid;place-items:center;color:var(--dim);padding:2px}
.gm-list{margin-top:10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;box-shadow:var(--sombra)}
.gm-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);transition:background .12s}
.gm-row:last-child{border-bottom:0}
.gm-row:hover,.gm-row:active{background:var(--panel2)}
.gm-row .pinico{width:32px;height:32px;border-radius:50%;background:var(--panel2);color:var(--muted);display:grid;place-items:center;flex:none}
.gm-row.esta .pinico{background:var(--azul-suave);color:var(--azul)}
.gm-row .tx{flex:1;min-width:0}
.gm-row .n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-row .d{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-row .km{font-size:11.5px;color:var(--dim);font-family:"Space Grotesk",Inter,sans-serif;flex:none}
.gm-cargando{display:flex;align-items:center;gap:10px;padding:14px 4px;color:var(--dim);font-size:13.5px}
.mk .sugpin{
  width:24px;height:24px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:#fff;border:2px solid var(--azul);color:var(--azul-2);
  font-size:11.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(13,45,110,.3)
}
.mk .sugpin span{transform:rotate(45deg)}

/* ---------- tarjeta de solicitud del conductor ---------- */
.didi-metric-label{text-transform:none;font-size:11.5px;display:flex;align-items:center;gap:5px}
.didi-metric-label .ic{width:14px;height:14px}
.tira{
  display:flex;align-items:stretch;gap:0;border:1.5px solid var(--line);
  border-radius:14px;overflow:hidden;margin:12px 0;background:var(--panel2)
}
.tira .t1{flex:1;min-width:0;padding:9px 12px;display:flex;align-items:center;gap:9px}
.tira .t1+.t1{border-left:1.5px solid var(--line)}
.tira .marca{width:10px;height:10px;border-radius:50%;flex:none}
.tira .marca.a{background:#00875A}
.tira .marca.b{background:#DE350B}
.tira .et{font-size:11.5px;color:var(--muted);line-height:1.2}
.tira .vl{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:14px;white-space:nowrap}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipdato{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:500;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.chipdato .ic{width:14px;height:14px}
.chipdato.acento{background:var(--azul-suave);border-color:var(--azul-borde);color:var(--azul-2);font-weight:600}
.estrella{color:#F5B72A;display:inline-flex}

/* ---------- botones de accion del conductor ---------- */
.btn.waze{background:#33CCFF;border-color:#2BB7E6;color:#04314A;font-weight:700}
.btn.waze:active{background:#2BB7E6}
.acciones{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:10px}
.acciones .btn{margin-top:0}
.iconacc{
  width:46px;height:46px;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);
  display:grid;place-items:center;color:var(--muted);position:relative;flex:none
}
.iconacc:active{transform:scale(.95)}
.iconacc .n{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)
}

/* ---------- envio paso a paso ---------- */
.pasos{display:flex;gap:6px;margin:2px 0 14px}
.pasos i{height:4px;flex:1;border-radius:4px;background:var(--line);transition:background .2s}
.pasos i.on{background:var(--azul)}
.resumen-envio{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;
  background:var(--azul-suave);border:1px solid var(--azul-borde);margin-bottom:12px;font-size:13px;color:var(--azul-2)
}
.resumen-envio .grow{flex:1;min-width:0}
.resumen-envio button{color:var(--azul);font-weight:700;font-size:12.5px;text-decoration:underline}

/* ---------- boton de conexion del conductor ---------- */
#btn-power{
  width:35px;height:35px;border-radius:50%;display:grid;place-items:center;flex:none;
  border:1.5px solid var(--line2);background:var(--panel2);color:var(--muted);transition:.15s
}
#btn-power.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 10px rgba(15,169,88,.35)}
#btn-power:active{transform:scale(.94)}

</style>
</head>

  if (seg < 86400) return 'hace ' + Math.floor(seg / 3600) + ' h';
  if (seg < 604800) return 'hace ' + Math.floor(seg / 86400) + ' d';

/* Validación de número de identidad (cédula ecuatoriana u otro ID) */
function revisarCedula(c) {
  if (!c || c.length < 5) return { ok: false, duro: true, motivo: 'El número de identidad debe tener al menos 5 dígitos' };
  if (/^\d{10}$/.test(c)) {
    const prov = +c.slice(0, 2);
    if (prov < 1 || (prov > 24 && prov !== 30)) return { ok: false, duro: false, motivo: 'Los dos primeros dígitos no corresponden a una provincia de Ecuador' };
    let suma = 0;
    for (let i = 0; i < 9; i++) {
      let v = +c[i] * (i % 2 === 0 ? 2 : 1);
      if (v > 9) v -= 9;
      suma += v;
    }
    const dig = (10 - (suma % 10)) % 10;
    if (dig !== +c[9]) return { ok: false, duro: false, motivo: 'El dígito verificador no coincide con la cédula ecuatoriana estándar' };
    return { ok: true };
  }
  return { ok: true };
}
/* Un PIN de 4 dígitos son 10 000 combinaciones, y el correo de alguien no
   es un secreto. Sin freno, un script las prueba todas en un rato. Tras tres
   fallos seguidos la app espera, doblando la espera en cada intento; el
   contador sobrevive a recargar la página, que si no bastaba con F5.
   Ojo: esto es la mitad del trabajo. La otra mitad es del servidor, y va en
   Supabase → Authentication → Rate limits y Attack protection (captcha).
   Subir el PIN a 6 dígitos cambiaría la clave de todas las cuentas ya
   creadas, así que esa decisión queda para una migración aparte. */
const FRENO = { fallos: +leerLocal('login_fallos', 0) || 0, hasta: +leerLocal('login_hasta', 0) || 0 };
const esperaLogin = () => Math.max(0, Math.ceil((FRENO.hasta - Date.now()) / 1000));
function anotarFalloLogin() {
  FRENO.fallos++;
  if (FRENO.fallos >= 3) {
    const seg = Math.min(300, 10 * Math.pow(2, FRENO.fallos - 3));
    FRENO.hasta = Date.now() + seg * 1000;
    guardarLocal('login_hasta', FRENO.hasta);
  }
  guardarLocal('login_fallos', FRENO.fallos);
}
function limpiarFalloLogin() {
  FRENO.fallos = 0; FRENO.hasta = 0;
  guardarLocal('login_fallos', 0); guardarLocal('login_hasta', 0);
}

const celularValido = c => /^09\d{8}$/.test(c);
const correoValido  = c => /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(c);
const claveDePin    = pin => pin + '99';

/* Distancia y tiempo */
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const kmRuta  = (a, b) => +(haversine(a, b) * 1.32).toFixed(2);
const minRuta = km => Math.max(4, Math.round(km / 21 * 60 + 2));

/* ---- 3. Tarifas ---- */
const TAMANOS = {
  pequeno: { f: 1.00, t: 'Pequeño', s: 'Sobre, documentos, hasta 3 kg', i: 'sobre' },
  mediano: { f: 1.25, t: 'Mediano', s: 'Caja de zapatos, hasta 10 kg',  i: 'caja' },
  grande:  { f: 1.60, t: 'Grande',  s: 'Bulto grande, hasta 25 kg',     i: 'bulto' }
};
const URGENCIAS = {
  urgente: { d: 0.00, t: 'Urgente', s: 'Sale ahora mismo', i: 'rayo' },
  '1h':    { d: 0.20, t: 'Dentro de 1 hora', s: 'El conductor lo recoge en su ruta', i: 'reloj' },
  '5h':    { d: 0.40, t: 'Dentro de 5 horas', s: 'Se agrupa con otros envíos del día', i: 'agenda' }
};
function fechaQuito(f = new Date()) {
  try {
    const s = f.toLocaleString('en-US', { timeZone: 'America/Guayaquil' });
    return new Date(s);
  } catch (e) {
    return new Date(f.getTime() - 5 * 3600 * 1000);
  }
}

function factorTiempoLocal(fecha = new Date()) {
  const fq = fechaQuito(fecha);
  const dia = fq.getDay();      // 0: domingo, 6: sábado (horario Quito)
  const hora = fq.getHours();    // 0 a 23 en Quito
  let factor = 0.052083;

  // Sábado o Domingo
  if (dia === 0 || dia === 6) {
    factor = 0.08;
  }
  // 5 a 8 pm (17:00 a 19:59)
  if (hora >= 17 && hora < 20) {
    factor = Math.max(factor, 0.06);
  }
  // 10 pm a 4 am (22:00 a 03:59)
  if (hora >= 22 || hora < 4) {
    factor = Math.max(factor, 0.09);
  }
  return factor;
}

function tarifa(km, tipo, opts = {}) {
  const min = opts.min != null ? opts.min : ((typeof S !== 'undefined' && S.dur && S.km === km) ? S.dur : minRuta(km));
  const factorMin = factorTiempoLocal();
  let p = 0.22 * km + factorMin * min;

  if (tipo === 'paquete') {
    p *= (TAMANOS[opts.tamano || 'pequeno'] || TAMANOS.pequeno).f;
  }

  // Tarifa base/bruta calculada según la fórmula
  const bruto = Math.max(1.50, Math.round(p * 20) / 20);
  const desc = tipo === 'paquete' ? (URGENCIAS[opts.urgencia || 'urgente'] || URGENCIAS.urgente).d : 0;
  let final = Math.round(bruto * (1 - desc) * 20) / 20;
  if (tipo !== 'paquete') {
    final = Math.max(1.50, final);
  }

  // Para viajes de personas, el pasajero puede rebajar hasta $0.25 respecto al precio de la fórmula (mínimo $1.50)
  const minPermitido = tipo === 'paquete' ? final : Math.max(1.50, +(final - 0.25).toFixed(2));

  return { bruto, desc, final, min, factorMin, minPermitido };
}

/* ---- 5. Mapa ---- */
const QUITO = { lat: -0.1807, lng: -78.4678 };
/* La app trabaja en Ecuador continental. Fuera de este rectángulo no se
   acepta ningún punto, y el mapa tampoco deja salirse de él. */
const LIM_EC = { sur: -5.05, norte: 1.70, oeste: -81.15, este: -75.05 };
const esOscuro = () => document.documentElement.dataset.tema === 'oscuro';
const TILES  = () => esOscuro() ? CFG.TILES_OSCURO
  : (S.modo === 'conductor' ? CFG.TILES_CLARO : CFG.TILES_LUGARES);
const AZUL   = () => esOscuro() ? '#5C9BFF' : '#0A5AFF';
const CONTRA = () => esOscuro() ? '#0B121C' : '#ffffff';

function puntosCurva(a, b) {
  const mid = { lat: (a.lat + b.lat) / 2 + (b.lng - a.lng) * .07, lng: (a.lng + b.lng) / 2 - (b.lat - a.lat) * .07 };
  const pts = [];
  for (let t = 0; t <= 1.001; t += .04) {
    const u = 1 - t;
    pts.push([u*u*a.lat + 2*u*t*mid.lat + t*t*b.lat, u*u*a.lng + 2*u*t*mid.lng + t*t*b.lng]);
  }
  return pts;
}

/* Enlaces de navegación externa. El conductor navega con Waze, que es
   lo que usa en la calle; el pasajero conserva las dos opciones. */
const linkMaps = (desde, hasta) =>
  `https://www.google.com/maps/dir/?api=1${desde ? `&origin=${desde.lat},${desde.lng}` : ''}&destination=${hasta.lat},${hasta.lng}&travelmode=driving`;
const linkWaze = hasta => `https://www.waze.com/ul?ll=${hasta.lat},${hasta.lng}&navigate=yes`;
const botonesNav = (desde, hasta) => S.modo === 'conductor'
  ? `<div class="navs"><a class="chipnav" href="${linkWaze(hasta)}" target="_blank" rel="noopener">Abrir en Waze</a></div>`
  : `<div class="navs">
      <a class="chipnav" href="${linkMaps(desde, hasta)}" target="_blank" rel="noopener">Google Maps</a>
      <a class="chipnav" href="${linkWaze(hasta)}" target="_blank" rel="noopener">Waze</a>
    </div>`;
const botonWaze = (hasta, txt) =>
  `<a class="btn waze full" href="${linkWaze(hasta)}" target="_blank" rel="noopener">${IC.waze()}${txt || 'Navegar con Waze'}</a>`;

/* Ruta real por calles con OSRM. Si falla, cae a la curva estimada. */
const cacheRutas = {};
async function rutaReal(a, b) {
  const k = [a.lat.toFixed(4), a.lng.toFixed(4), b.lat.toFixed(4), b.lng.toFixed(4)].join(',');
  if (cacheRutas[k]) return cacheRutas[k];
  try {
    const u = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r = await fetch(u);
    const j = await r.json();
    const rt = j.routes && j.routes[0];
    if (!rt) throw new Error('sin ruta');
    const res = {
      pts: rt.geometry.coordinates.map(c => [c[1], c[0]]),
      km: +(rt.distance / 1000).toFixed(2),
      min: Math.max(2, Math.round(rt.duration / 60)),
      real: true
    };
    cacheRutas[k] = res;
    return res;
  } catch (e) {
    const km = kmRuta(a, b);
    return { pts: puntosCurva(a, b), km, min: minRuta(km), real: false };
  }
}

const mapa = {
  m: null, capa: null, mkA: null, mkB: null, mkC: null, mkYo: null, linea: null, borde: null, anim: null,
  init() {
    this.m = L.map('map', {
      zoomControl: false,
      maxBounds: L.latLngBounds([LIM_EC.sur, LIM_EC.oeste], [LIM_EC.norte, LIM_EC.este]),
      maxBoundsViscosity: .9,
      minZoom: 6
    }).setView([QUITO.lat, QUITO.lng], 14);
    this.pintarTeselas();
    setTimeout(() => this.m.invalidateSize(), 250);
    this.vigilarTamano();
    /* Arrastrar o hacer zoom con el dedo manda: mientras el usuario esté
       mirando otra parte del mapa, la app no se lo devuelve a su sitio.
       Se escuchan solo gestos de verdad; 'zoomstart' no sirve porque salta
       también con los encuadres que hace la propia app. */
    const cont = this.m.getContainer();
    this.m.on('dragstart', () => { this.aMano = true; });
    cont.addEventListener('wheel', () => { this.aMano = true; }, { passive: true });
    cont.addEventListener('dblclick', () => { this.aMano = true; });
    cont.addEventListener('touchstart', e => { if (e.touches.length > 1) this.aMano = true; }, { passive: true });
  },
  /* El alto del mapa depende de cuánto ocupe la hoja, que cambia sola con
     el contenido. Con un observador el mapa se entera siempre, también al
     rotar el teléfono o al abrirse el teclado. */
  vigilarTamano() {
    const caja = document.getElementById('mapwrap');
    if (!caja) return;
    const avisar = () => {
      clearTimeout(this.tRes);
      this.tRes = setTimeout(() => this.reencuadrar(), 160);
    };
    if (window.ResizeObserver) { this.obs = new ResizeObserver(avisar); this.obs.observe(caja); }
    window.addEventListener('resize', avisar);
    window.addEventListener('orientationchange', avisar);
  },
  /* Cambia el mapa base al cambiar de tema, y repinta la ruta con
     los colores nuevos para que siga contrastando. */
  pintarTeselas() {
    if (!this.m) return;
    const nueva = L.tileLayer(TILES(), { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(this.m);
    if (this.capa) this.m.removeLayer(this.capa);
    this.capa = nueva;
    nueva.bringToBack();
    if (this.linea) this.dibujarLinea(this.linea.getLatLngs());
  },
  /* Ajusta el alto del mapa cuando la hoja inferior cambia de tamaño.
     Al cambiar el alto cambia el encuadre util, asi que los puntos se
     vuelven a meter en pantalla: es justo cuando el usuario quiere ver
     mas mapa. */
  reencuadrar() {
    if (!this.m) return;
    this.m.invalidateSize({ pan: false });
    if (this.aMano) return;          // el usuario movió el mapa: se respeta
    this.reencuadrarPuntos();
  },
  reencuadrarPuntos() {
    if (!this.m) return;
    try {
      if (this.capasDidi && this.capasDidi.length) {
        /* El carro del conductor vive fuera de capasDidi (no se borra al
           cambiar de carrera), así que hay que sumarlo a mano o se queda
           pegado al borde de abajo. */
        const b = L.featureGroup(this.capasDidi).getBounds();
        if (this.mkC) b.extend(this.mkC.getLatLng());
        this.ajustar(b);
      } else if (this.linea) {
        this.encuadrarRuta([this.mkC ? this.mkC.getLatLng() : null]);
      } else if (this.mkA && this.mkB) {
        this.encuadrar([this.mkA.getLatLng(), this.mkB.getLatLng()]);
      }
    } catch (_) {}
  },
  icono(html, size = 22) {
    return L.divIcon({ className: 'mk', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
  },
  punto(cual, ll, etiqueta) {
    const key = cual === 'a' ? 'mkA' : 'mkB';
    const html = cual === 'a' ? '<div class="pt"></div>' : '<div class="pt hollow"></div>';
    if (this[key]) this.m.removeLayer(this[key]);
    this[key] = L.marker([ll.lat, ll.lng], { icon: this.icono(html) }).addTo(this.m);
    if (etiqueta) this[key].bindTooltip(etiqueta, {
      permanent: true, direction: 'top', offset: [0, -8],
      className: 'didi-tooltip ' + (cual === 'a' ? 'didi-tooltip-a' : 'didi-tooltip-b')
    });
  },
  /* Recogida y destino rotulados sobre el mapa con su tiempo y su
     distancia: es lo primero que mira el conductor, y al pasajero le
     ahorra abrir el panel para saber cuánto falta. */
  etiquetarViaje(a, b, ida, viaje) {
    if (a) this.punto('a', a, ida ? `Recogida: ${ida.min} min (${ida.km} km)` : 'Recogida');
    if (b) this.punto('b', b, viaje ? `Destino: ${viaje.min} min (${viaje.km} km)` : 'Destino');
  },
  /* Resultados de búsqueda dibujados en el mapa, numerados igual que
     en la lista, para elegir tocando el punto. */
  capasSug: [],
  limpiarSugerencias() {
    (this.capasSug || []).forEach(l => { try { this.m.removeLayer(l); } catch (_) {} });
    this.capasSug = [];
  },
  marcarSugerencias(items, alTocar) {
    this.limpiarSugerencias();
    (items || []).slice(0, 6).forEach((x, i) => {
      const mk = L.marker([x.lat, x.lng], { icon: this.icono(`<div class="sugpin"><span>${i + 1}</span></div>`, 24) }).addTo(this.m);
      mk.bindTooltip(esc(x.nombre || x.texto), { direction: 'top', className: 'didi-tooltip' });
      if (alTocar) mk.on('click', () => alTocar(x));
      this.capasSug.push(mk);
    });
  },
  yo(ll) {
    if (this.mkYo) this.m.removeLayer(this.mkYo);
    this.mkYo = L.marker([ll.lat, ll.lng], { icon: this.icono('<div class="me"></div>') }).addTo(this.m);
  },
  conductor(ll) {
    if (!this.mkC) this.mkC = L.marker([ll.lat, ll.lng], { icon: this.icono('<div class="car">' + IC.carro() + '</div>', 36) }).addTo(this.m);
    else this.mkC.setLatLng([ll.lat, ll.lng]);
  },
  limpiarConductor() {
    if (this.anim) cancelAnimationFrame(this.anim);
    if (this.mkC) { this.m.removeLayer(this.mkC); this.mkC = null; }
  },
  token: 0,
  dibujarLinea(pts) {
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = L.polyline(pts, { color: CONTRA(), weight: 9, opacity: .95 }).addTo(this.m);
    this.linea = L.polyline(pts, { color: AZUL(), weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(this.m);
  },
  async ruta(a, b) {
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = this.linea = null;
    if (!a || !b) return null;
    const mio = ++this.token;
    this.dibujarLinea(puntosCurva(a, b));            // provisional mientras llega la ruta real
    const r = await rutaReal(a, b);
    if (mio !== this.token) return r;                 // el usuario ya cambió los puntos
    this.dibujarLinea(r.pts);
    this.ultima = r;
    return r;
  },
  /* Margen proporcional al alto real del mapa. Antes era fijo (60 a 240 px):
     con la hoja abierta el mapa mide poco mas de 200 px y ese margen se comia
     la vista entera, asi que la recogida y el destino quedaban fuera de
     pantalla. Ahora el margen se calcula sobre lo que hay. */
  margen() {
    const h = this.m ? this.m.getSize().y : 300;
    const w = this.m ? this.m.getSize().x : 360;
    return {
      v: Math.max(26, Math.min(60, Math.round(h * .16))),
      h: Math.max(26, Math.min(60, Math.round(w * .12)))
    };
  },
  ajustar(bounds) {
    /* Leaflet guarda el tamaño del contenedor de cuando se midió. El panel
       de abajo crece y encoge con su contenido, así que el mapa cambia de
       alto en cada repintado y Leaflet sigue calculando con el alto viejo:
       encuadraba la ruta en un mapa más grande del que hay y los puntos
       quedaban fuera de la pantalla. Por eso se vuelve a medir antes de
       encuadrar. Este era el motivo de que el mapa saliera "vacío". */
    this.m.invalidateSize({ pan: false });
    const m = this.margen();
    this.m.fitBounds(bounds, {
      paddingTopLeft: [m.h, m.v], paddingBottomRight: [m.h, m.v], maxZoom: 16.5, animate: true
    });
  },
  encuadrarRuta(extra) {
    if (!this.linea) return;
    const b = this.linea.getBounds();
    (extra || []).filter(Boolean).forEach(p => b.extend([p.lat, p.lng]));
    this.ajustar(b);
  },
  encuadrar(pts) {
    const l = (pts || []).filter(Boolean).map(p => [p.lat, p.lng]);
    if (!l.length) return;
    if (l.length === 1) this.m.setView(l[0], 16, { animate: true });
    else this.ajustar(L.latLngBounds(l));
  },
  borrarRuta() {
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = this.linea = null;
  },
  quitarPunto(cual) {
    const k = cual === 'a' ? 'mkA' : 'mkB';
    if (this[k]) { this.m.removeLayer(this[k]); this[k] = null; }
  },
  limpiar() {
    this.firma = null;
    ['mkA', 'mkB'].forEach(k => { if (this[k]) { this.m.removeLayer(this[k]); this[k] = null; } });
    [this.borde, this.linea].forEach(l => { if (l) this.m.removeLayer(l); });
    this.borde = this.linea = null;
    this.limpiarConductor();
    this.limpiarDidi();
    this.limpiarSugerencias();
  },
  capasDidi: [],
  limpiarDidi() {
    if (this.capasDidi && this.capasDidi.length) {
      this.capasDidi.forEach(l => { try { this.m.removeLayer(l); } catch (_) {} });
      this.capasDidi = [];
    }
  },
  tokenDidi: 0,
  async dibujarCarreraDidi(posConductor, s) {
    this.limpiarDidi();
    if (!this.m || !s) return;
    /* Dos carreras seguidas (el conductor desliza la tarjeta) llegaban
       a dibujarse encima una de otra porque las rutas vuelven de la red
       en desorden. El token deja pasar solo a la ultima pedida. */
    const mio = ++this.tokenDidi;
    const vigente = () => mio === this.tokenDidi;

    const A = { lat: +s.origen_lat, lng: +s.origen_lng };
    const B = { lat: +s.destino_lat, lng: +s.destino_lng };

    if (posConductor) {
      this.conductor(posConductor);
    }

    const distYo = kmRuta(posConductor || A, A);
    const etaYo = minRuta(distYo);
    const mkA = L.marker([A.lat, A.lng], {
      icon: this.icono('<div class="didi-mk-a">' + IC.pin('sm') + '</div>', 28)
    }).addTo(this.m);
    mkA.bindTooltip(`<b>Recogida:</b> ${etaYo} min (${distYo} km)`, {
      permanent: true, direction: 'top', className: 'didi-tooltip didi-tooltip-a'
    });
    this.capasDidi.push(mkA);

    const distViaje = s.distancia_km || kmRuta(A, B);
    const durViaje = s.duracion_min || minRuta(distViaje);
    const mkB = L.marker([B.lat, B.lng], {
      icon: this.icono('<div class="didi-mk-b">' + IC.bandera('sm') + '</div>', 28)
    }).addTo(this.m);
    mkB.bindTooltip(`<b>Destino:</b> ${durViaje} min (${distViaje} km)`, {
      permanent: true, direction: 'top', className: 'didi-tooltip didi-tooltip-b'
    });
    this.capasDidi.push(mkB);

    if (posConductor) {
      const rutaIda = await rutaReal(posConductor, A);
      if (!vigente()) return;
      const lineaIdaBorde = L.polyline(rutaIda.pts, { color: '#ffffff', weight: 6, opacity: 0.85 }).addTo(this.m);
      const lineaIda = L.polyline(rutaIda.pts, { color: '#FF7D00', weight: 4, dashArray: '6, 8', opacity: 1 }).addTo(this.m);
      this.capasDidi.push(lineaIdaBorde, lineaIda);
    }

    const rutaViaje = await rutaReal(A, B);
    if (!vigente()) return;
    const lineaViajeBorde = L.polyline(rutaViaje.pts, { color: '#002B7A', weight: 8, opacity: 0.85 }).addTo(this.m);
    const lineaViaje = L.polyline(rutaViaje.pts, { color: '#0A5AFF', weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }).addTo(this.m);
    this.capasDidi.push(lineaViajeBorde, lineaViaje);

    const puntos = [posConductor, A, B].filter(Boolean).map(p => [p.lat, p.lng]);
    this.ajustar(L.latLngBounds(puntos));
  },
  mover(desde, hasta, ms, alLlegar) {
    if (this.anim) cancelAnimationFrame(this.anim);
    const t0 = performance.now();
    const paso = ahora => {
      const t = Math.min(1, (ahora - t0) / ms);
      const e = t < .5 ? 2*t*t : -1 + (4 - 2*t)*t;
      this.conductor({ lat: desde.lat + (hasta.lat - desde.lat) * e, lng: desde.lng + (hasta.lng - desde.lng) * e });
      if (t < 1) this.anim = requestAnimationFrame(paso); else alLlegar && alLlegar();
    };
    this.anim = requestAnimationFrame(paso);
  }
};

/* Quito y sus valles: la zona donde la app tiene conductores. */
const EN_QUITO = (lat, lng) => lat >= -0.55 && lat <= 0.15 && lng >= -78.75 && lng <= -78.20;
/* Ecuador continental: fuera de aquí no se puede poner ningún punto. */
const EN_ECUADOR = (lat, lng) =>
  lat >= LIM_EC.sur && lat <= LIM_EC.norte && lng >= LIM_EC.oeste && lng <= LIM_EC.este;

/* Búsqueda de lugares. Primero la Edge Function buscar-lugares, que
   consulta Google Places y por eso entiende nombres de negocios
   ("byd paseo"); si no responde, geocodificación de OpenStreetMap.
   Todo se filtra a Ecuador y se ordena poniendo Quito primero y luego
   lo más cercano a quien busca. */
async function buscarDirecciones(q) {
  if (!q || q.trim().length < 2) return [];
  const query = q.trim();
  const cerca = (S.pos && EN_ECUADOR(S.pos.lat, S.pos.lng)) ? S.pos : QUITO;

  const ordenar = lista => lista
    .filter(x => !isNaN(x.lat) && !isNaN(x.lng) && EN_ECUADOR(x.lat, x.lng))
    .map(x => ({ ...x, km: +haversine(cerca, x).toFixed(1), enQuito: EN_QUITO(x.lat, x.lng) }))
    .filter((x, i, arr) => arr.findIndex(y =>
      y.lat.toFixed(4) === x.lat.toFixed(4) && y.lng.toFixed(4) === x.lng.toFixed(4)) === i)
    .sort((a, b) => (b.enQuito - a.enQuito) || (a.km - b.km))
    .slice(0, 7);

  if (hayConfig()) {
    try {
      const u = `${CFG.SUPABASE_URL}/functions/v1/buscar-lugares` +
                `?q=${encodeURIComponent(query)}&lat=${cerca.lat}&lng=${cerca.lng}`;
      const resp = await fetch(u, {
        headers: {
          'apikey': CFG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CFG.SUPABASE_ANON_KEY}`
        }
      });
      if (resp.ok) {
        const data = await resp.json();
        const items = data.resultados || data.results || (Array.isArray(data) ? data : []);
        const listos = ordenar((items || []).map(x => {
          const texto = x.texto || x.formatted_address || x.direccion || x.name || '';
          return {
            nombre: x.nombre || x.name || texto.split(',')[0] || 'Lugar',
            texto: texto || (x.nombre || x.name || ''),
            lat: +(x.lat != null ? x.lat : (x.geometry && x.geometry.location && x.geometry.location.lat)),
            lng: +(x.lng != null ? x.lng : (x.geometry && x.geometry.location && x.geometry.location.lng))
          };
        }));
        if (listos.length) return listos;
      }
    } catch (e) {
      console.warn('La Edge Function buscar-lugares no respondió, uso OpenStreetMap:', e);
    }
  }

  /* Respaldo: se pregunta primero por la zona de Quito y, si no hay
     nada, por el resto del país. */
  try {
    const base = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=ec&limit=8';
    const urls = [
      `${base}&viewbox=-78.75,0.15,-78.20,-0.55&bounded=1&q=${encodeURIComponent(query)}`,
      `${base}&viewbox=-78.75,0.15,-78.20,-0.55&bounded=1&q=${encodeURIComponent(query + ', Quito')}`,
      `${base}&q=${encodeURIComponent(query)}`
    ];
    let items = [];
    for (const u of urls) {
      const r = await fetch(u, { headers: { 'Accept-Language': 'es' } });
      const j = await r.json();
      if (j && j.length) { items = j; break; }
    }
    return ordenar(items.map(x => {
      const partes = (x.display_name || '').split(', ');
      const a = x.address || {};
      const nombre = partes[0] || 'Lugar';
      const resto = [a.road, a.suburb || a.neighbourhood || a.city_district, a.city || a.town || a.county]
        .filter(Boolean).filter(v => v !== nombre).slice(0, 3).join(', ');
      return { nombre, texto: resto || partes.slice(1, 4).join(', '), lat: +x.lat, lng: +x.lon };
    }));
  } catch (e) { return []; }
}

async function direccionDe(ll) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll.lat}&lon=${ll.lng}`,
      { headers: { 'Accept-Language': 'es' } });
    const j = await r.json();
    const a = j.address || {};
    return [a.road, a.house_number, a.suburb || a.neighbourhood || a.city_district].filter(Boolean).join(' ') ||
           (j.display_name || '').split(',').slice(0, 2).join(',') || 'Punto en el mapa';
  } catch (e) { return `Punto ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`; }
}

   6. Capa de datos (Supabase)
   ============================================================ */
function almacenSeguro() {
  try {
    localStorage.setItem('__ruta', '1'); localStorage.removeItem('__ruta');
    return localStorage;
  } catch (e) {
    const m = {};
    return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } };
  }
}

function crearAPI(url, key) {
  if (!window.supabase || !window.supabase.createClient) throw new Error('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.');
  const sb = window.supabase.createClient(url, key, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storage: almacenSeguro() }
  });
  const yo = () => S.user && S.user.id;

  return {
    sb,
    async crearSolicitud(d) {
      const { data, error } = await sb.from('solicitudes').insert({ ...d, pasajero_id: yo() }).select().single();
      if (error) throw error;
      return { ...data, pasajero_nombre: S.perfil.nombre, pasajero_calificacion: S.perfil.calificacion, pasajero_tel: S.perfil.celular };
    },
    async cancelarSolicitud(id, motivo) {
      const { error } = await sb.from('solicitudes')
        .update({ estado: 'cancelado', motivo_cancelacion: motivo || null, cancelado_por: yo() })
        .eq('id', id);
      if (error) throw error;
    },
    onSolicitud(id, cb) {
      const traer = async () => {
        const { data } = await sb.from('solicitudes_detalle').select('*').eq('id', id).maybeSingle();
        if (data) cb(data);
      };
      const ch = sb.channel('sol-' + id)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'solicitudes', filter: 'id=eq.' + id }, traer)
        .subscribe();
      const t = setInterval(traer, 12000);           // respaldo por si el realtime no está activo
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    onOfertas(id, cb) {
      const cargar = async () => {
        const { data } = await sb.from('ofertas_detalle').select('*')
          .eq('solicitud_id', id).eq('estado', 'pendiente').order('precio');
        cb(data || []);
      };
      cargar();
      const ch = sb.channel('ofe-' + id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ofertas', filter: 'solicitud_id=eq.' + id }, cargar)
        .subscribe();
      const t = setInterval(cargar, 8000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    async aceptarOferta(of) {
      const { error } = await sb.rpc('aceptar_oferta', { p_oferta: of.id });
      if (error) throw error;
      const { data } = await sb.from('solicitudes_detalle').select('*').eq('id', of.solicitud_id).maybeSingle();
      return data;
    },
    async crearOferta(sol, precio, eta) {
      const { data, error } = await sb.from('ofertas')
        .insert({ solicitud_id: sol.id, conductor_id: yo(), precio, eta_min: eta, estado: 'pendiente' })
        .select().single();
      if (error) throw error;
      return data;
    },
    /* Antes de ofertar se relee la solicitud: entre que se pintó la tarjeta
       y el momento del toque pudo haberla tomado otro conductor, y la base
       lo rechazaría con un error que no dice nada. */
    async estadoDeSolicitud(id) {
      const { data } = await sb.from('solicitudes_detalle').select('id,estado,pasajero_id,precio_ofrecido,tipo')
        .eq('id', id).maybeSingle();
      return data;
    },
    async cambiarEstado(id, estado) {
      const campos = { estado };
      if (estado === 'finalizado') campos.finalizado_en = new Date().toISOString();
      const { error } = await sb.from('solicitudes').update(campos).eq('id', id);
      if (error) throw error;
    },
    cercanas(cb) {
      const cargar = async () => {
        const { data, error } = await sb.from('solicitudes_detalle').select('*')
          .eq('estado', 'buscando').order('creado_en', { ascending: false }).limit(30);
        if (error) return;
        cb((data || []).filter(s => haversine(S.pos, { lat: s.origen_lat, lng: s.origen_lng }) <= 12));
      };
      cargar();
      const ch = sb.channel('cercanas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, cargar).subscribe();
      const t = setInterval(cargar, 10000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    async setEnLinea(on, pos) {
      await sb.from('conductores_estado').upsert({
        conductor_id: yo(), en_linea: on, lat: pos.lat, lng: pos.lng, actualizado_en: new Date().toISOString()
      });
    },
    async enviarMensaje(id, texto) {
      const { error } = await sb.from('mensajes').insert({ solicitud_id: id, emisor_id: yo(), texto });
      if (error) toast(error.message, 'bad');
    },
    onMensajes(id, cb) {
      const cargar = async () => {
        const { data } = await sb.from('mensajes').select('*').eq('solicitud_id', id).order('creado_en');
        cb((data || []).map(m => ({ ...m, emisor_id: m.emisor_id === yo() ? 'yo' : 'otro' })));
      };
      cargar();
      const ch = sb.channel('msg-' + id)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes', filter: 'solicitud_id=eq.' + id }, cargar)
        .subscribe();
      const t = setInterval(cargar, 7000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    async historial() {
      const col = S.modo === 'conductor' ? 'conductor_id' : 'pasajero_id';
      const { data } = await sb.from('solicitudes_detalle').select('*')
        .eq(col, yo()).in('estado', ['finalizado', 'cancelado'])
        .order('creado_en', { ascending: false }).limit(50);
      return data || [];
    },
    async calificar(sol, estrellas, comentario) {
      const para = S.modo === 'conductor' ? sol.pasajero_id : sol.conductor_id;
      if (!para) return;
      await sb.from('calificaciones').insert({ solicitud_id: sol.id, de_id: yo(), para_id: para, estrellas, comentario });
    },
    async guardarPerfil(campos) {
      const { data, error } = await sb.from('perfiles').update(campos).eq('id', yo()).select().single();
      if (error) throw error;
      S.perfil = data;
      return data;
    },

    /* ---------- vehículo ---------- */
    async guardarVehiculo(v, id) {
      const q = id
        ? sb.from('vehiculos').update(v).eq('id', id)
        : sb.from('vehiculos').insert({ ...v, conductor_id: yo() });
      const { data, error } = await q.select().single();
      if (error) throw error;
      return data;
    },

    /* ---------- lugares guardados ---------- */
    async lugares() {
      const { data } = await sb.from('lugares').select('*').eq('usuario_id', yo())
        .order('usos', { ascending: false }).order('creado_en');
      return data || [];
    },
    async guardarLugar(l, id) {
      const q = id
        ? sb.from('lugares').update(l).eq('id', id)
        : sb.from('lugares').insert({ ...l, usuario_id: yo() });
      const { data, error } = await q.select().single();
      if (error) throw error;
      return data;
    },
    async borrarLugar(id) {
      const { error } = await sb.from('lugares').delete().eq('id', id);
      if (error) throw error;
    },
    usarLugar(id) { sb.rpc('usar_lugar', { p_lugar: id }).then(() => {}, () => {}); },

    /* ---------- soporte ---------- */
    async abrirTicket(t) {
      const { data, error } = await sb.from('soporte_tickets').insert({ ...t, usuario_id: yo() }).select().single();
      if (error) throw error;
      return data;
    },
    async estadoTicket(id, estado) {
      const { error } = await sb.from('soporte_tickets').update({ estado }).eq('id', id);
      if (error) throw error;
    },
    async enviarSoporte(ticketId, texto) {
      const { error } = await sb.from('soporte_mensajes').insert({ ticket_id: ticketId, emisor_id: yo(), texto });
      if (error) throw error;
    },
    async marcarLeidos(ticketId, comoAgente) {
      let q = sb.from('soporte_mensajes').update({ leido: true }).eq('ticket_id', ticketId).eq('leido', false);
      q = comoAgente ? q.eq('autor', 'usuario') : q.neq('autor', 'usuario');
      await q;
    },
    onSoporte(ticketId, cb) {
      const cargar = async () => {
        const { data } = await sb.from('soporte_mensajes').select('*').eq('ticket_id', ticketId).order('creado_en');
        cb(data || []);
      };
      cargar();
      const ch = sb.channel('sop-' + ticketId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'soporte_mensajes', filter: 'ticket_id=eq.' + ticketId }, cargar)
        .subscribe();
      const t = setInterval(cargar, 9000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },
    onTickets(todos, cb) {
      const cargar = async () => {
        let q = sb.from('soporte_bandeja').select('*').order('actualizado_en', { ascending: false }).limit(60);
        if (!todos) q = q.eq('usuario_id', yo());
        const { data } = await q;
        cb(data || []);
      };
      cargar();
      const ch = sb.channel('sop-bandeja')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'soporte_mensajes' }, cargar)
        .subscribe();
      const t = setInterval(cargar, 25000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },

    /* ---------- posición en vivo del conductor ---------- */
    async publicarPos(pos) {
      await sb.from('conductores_estado').upsert({
        conductor_id: yo(), en_linea: true, lat: pos.lat, lng: pos.lng,
        actualizado_en: new Date().toISOString()
      });
    },
    onPosConductor(id, cb) {
      const cargar = async () => {
        const { data } = await sb.from('conductores_estado').select('lat,lng,actualizado_en')
          .eq('conductor_id', id).maybeSingle();
        if (data && data.lat != null) cb({ lat: +data.lat, lng: +data.lng, en: data.actualizado_en });
      };
      cargar();
      const ch = sb.channel('pos-' + id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'conductores_estado', filter: 'conductor_id=eq.' + id }, cargar)
        .subscribe();
      const t = setInterval(cargar, 6000);
      return () => { clearInterval(t); sb.removeChannel(ch); };
    },

    /* ---------- PIN ---------- */
    async recuperarPin(correo) {
      const { error } = await sb.auth.resetPasswordForEmail(correo, { redirectTo: location.href.split('#')[0] });
      if (error) throw error;
    },
    async cambiarPin(pin) {
      const { error } = await sb.auth.updateUser({ password: claveDePin(pin) });
      if (error) throw error;
    },

    async salir() { await sb.auth.signOut(); }
  };
}

const hayConfig = () => !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);

function conectar() {
  if (!hayConfig()) { modalConfig(); return null; }
  if (!S.api) {
    try { S.api = crearAPI(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); }
    catch (e) { toast(e.message, 'bad'); return null; }
  }
  return S.api;
}

  el.classList.remove('hidden');
  el.innerHTML = 'Falta conectar tu proyecto de Supabase para poder crear cuentas. Toca <b>Configurar Supabase</b> aquí abajo.';
}

/* Revisa el proyecto y dice exactamente qué está mal */
async function diagnostico() {
  const out = [];
  const U = CFG.SUPABASE_URL, K = CFG.SUPABASE_ANON_KEY;
  if (!U || !K) { out.push(['no', 'Configuración', 'Falta la URL del proyecto o la clave anon']); return out; }

  try {
    const r = await fetch(U + '/auth/v1/settings', { headers: { apikey: K } });
    if (!r.ok) {
      out.push(['no', 'Servicio de autenticación', `Respondió ${r.status}. Revisa que la URL y la clave anon sean del mismo proyecto`]);
    } else {
      const j = await r.json();
      out.push(['si', 'Conexión con el proyecto', 'La URL y la clave anon funcionan']);
      out.push([j.disable_signup ? 'no' : 'si', 'Registro de cuentas nuevas',
        j.disable_signup
          ? 'DESACTIVADO. Actívalo en Authentication → Sign In / Providers → Allow new users to sign up'
          : 'Permitido']);
      out.push([j.mailer_autoconfirm ? 'si' : 'duda', 'Confirmación por correo',
        j.mailer_autoconfirm
          ? 'Apagada: las cuentas quedan listas al instante'
          : 'ENCENDIDA. Sin un SMTP propio configurado, el envío del correo falla y el registro devuelve error 500. Apágala en Authentication → Sign In / Providers → Email → Confirm email, o configura tu propio SMTP']);
      const g = j.external && j.external.google;
      out.push([g ? 'si' : 'duda', 'Acceso con Google', g ? 'Activado' : 'Desactivado (es opcional)']);
    }
  } catch (e) {
    out.push(['no', 'Conexión con el proyecto', 'No respondió: ' + e.message]);
  }

  for (const t of ['perfiles', 'solicitudes', 'ofertas', 'mensajes', 'solicitudes_detalle',
                   'lugares', 'soporte_tickets', 'soporte_mensajes', 'soporte_bandeja']) {
    try {
      const r = await fetch(`${U}/rest/v1/${t}?select=*&limit=1`, { headers: { apikey: K, Authorization: 'Bearer ' + K } });
      if (r.status === 404) out.push(['no', 'Tabla ' + t, 'No existe. Corre supabase-esquema.sql completo en el SQL Editor']);
      else if (r.status >= 500) out.push(['no', 'Tabla ' + t, 'El servidor respondió ' + r.status]);
      else out.push(['si', 'Tabla ' + t, 'Existe y responde']);
    } catch (e) { out.push(['no', 'Tabla ' + t, e.message]); }
  }

  try {
    const r = await fetch(U + '/rest/v1/rpc/aceptar_oferta', {
      method: 'POST',
      headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_oferta: '00000000-0000-0000-0000-000000000000' })
    });
    out.push([r.status === 404 ? 'no' : 'si', 'Función aceptar_oferta',
      r.status === 404 ? 'No existe. Corre el esquema completo' : 'Instalada']);
  } catch (e) { out.push(['duda', 'Función aceptar_oferta', 'No se pudo comprobar']); }

  return out;
}
